# actionlint-template: v3: self-hosted runner labels for actionlint.
self-hosted-runner:
  labels:
    - ubuntu-latest
    - ubuntu-22.04
    - codex
    - codex-task
    - claude
    - code-review
    - qwen
    - ci-gate
    - bigdisk
    - release

# code-review.yml is the handbook's template and is not edited in this
# repository; the ignore covers SC2015 in that one file only, so every other
# workflow still gets the full shellcheck rule set.
paths:
  .github/workflows/code-review.yml:
    ignore:
      - 'SC2015:'
