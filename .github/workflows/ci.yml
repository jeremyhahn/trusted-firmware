# 633)`, fails CI when a workflow of the repository has a job that names
# `release` and that a pull request could run, or whose `if:` does not
# restrict it to a push to main or a tag, or a workflow_dispatch on main.
# The bigdisk-docker pools get a rootless Docker daemon of their own at the
# same /var/run/docker.sock path (no workflow change; see ci-standard.md
# §3a). A repository adopts v1.38 in one CI-file PR that also moves its
# release.yml jobs to the release label, pins its build and scan images by
# @sha256 digest and pulls them by digest before docker create or run, and
# sets RELEASE_RUNNER only once Infrastructure reports the release pools
# live. Every other job, gate and tier is v1.37's.
# v1.37 (2026-11-13, ruling 580): every job in every template carries
# timeout-minutes so a hung job ends itself. Ceilings by kind: unit, race,
# lint and other test jobs 60; integration, image builds, soak and release
# 120; gates and aggregators 10. A repository sets a job at or under its
# ceiling, sized at 1.5 x the job's longest green run; a job whose green
# runs need more keeps its measured value. automerge.yml, nightly.yml and
# revert-red-main.yml gain the timeouts they lacked.
# v1.36 (2026-11-13, Tenant Agent, owner approval 16:1xZ: keep CI caches
# local): a self-hosted job never restores or saves the Actions cache, which
# lives in Azure blob storage behind the office's internet line. The
# self-hosted pools (the Infra Department's runner configuration) give every job persistent
# per-host caches: GOCACHE and GOMODCACHE, CI_HOST_CACHE for anything else a
# repository caches (trusted-firmware's OP-TEE stack under
# $CI_HOST_CACHE/optee/<pin>, renamed into place whole), GOPROXY and
# DEVCACHE_GOPROXY through Athens, and TRIVY_DB_REPOSITORY and
# TRIVY_JAVA_DB_REPOSITORY through the dev-cache ghcr mirror. So, in any job
# that can run self-hosted: every actions/setup-go step takes
# `cache: ${{ runner.environment != 'self-hosted' }}`, and an actions/cache
# step runs only when a CI_HOST_CACHE lookup missed (once per host and key).
# scripts/in-toolchain-image.sh v6 passes the TRIVY_* settings to a bridge
