      - name: Reuse the toolchain image
        run: |
          ( umask 077; : > "$RUNNER_TEMP/gomodauth.env"
            for v in GOPRIVATE GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
              if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
            done )
          # v1.29.4 and v1.29.5: Athens first when the runner sets DEVCACHE_GOPROXY
          # and the cache answers, `|` so any error falls through to the public
          # proxy; "$bp" is one quoted make argument and the Makefile quotes it.
          bp=
          if [ -n "${DEVCACHE_GOPROXY:-}" ] && curl -s -o /dev/null --max-time 5 "$DEVCACHE_GOPROXY/"; then
            bp="GO_BUILD_PROXY=$DEVCACHE_GOPROXY|https://proxy.golang.org|direct"
          fi
          make docker-image-toolchain ${bp:+"$bp"} MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env"
          rm -f "$RUNNER_TEMP/gomodauth.env"
          echo "TOOLCHAIN_IMAGE=$(make -s toolchain-image)" >> "$GITHUB_ENV"

      # CUSTOMIZE (trusted-firmware): sdk/go's suite under -race, with the
      # cross-implementation suite against tfwsim (the real firmware compiled
      # for the host), gated at COVERAGE_THRESHOLD. The suite is compiled in by
      # the tfwsim build tag (#163); untagged, this step would run the unit
      # tests alone and the PR tier no simulator test. Every tfwsim-* binary the
      # suite starts must be on the make line, or the suite fails for want of
      # it. The tests fail the step before the gate reads a profile, so a
      # broken suite is never also reported as a coverage drop.
      - name: sdk/go under -race (cross-implementation suite, COVERAGE_THRESHOLD)
        env:
          SDK_RACE_SCRIPT: |
            set -eu
            export GOWORK=off
            make tfwsim tfwsim-atecc608a tfwsim-app-example tfwsim-auto tfwsim-prov tfwsim-otaboot
            cd sdk/go
            go test -race -count=1 -timeout=900s -tags tfwsim -coverprofile=../../coverage.out ./...
