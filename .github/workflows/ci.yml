# ci-template: v1.54 (customized)
# v1.54 (2026-11-22, Tenant Agent ruling 1137, owner order: the Dells and
# the AMD SEV host are always used for CI, and nothing sits idle): the
# preflight step `Balanced runner pool (ruling 1137)` replaces the hosted
# first rule of rulings 999 and 1024 (v1.46 to v1.53, `Hosted or overflow
# runner (ruling 1024)`) with balancing. It counts this repository's jobs,
# in progress plus queued, from one listing: H on hosted runners, S1 on
# bigdisk (not bigdisk-docker) and S2 on bigdisk-docker. The limits are
# repository variables set by the Infra Department, each a plain decimal
# integer: CI_HOSTED_SHARE (HS, its share of the account's 40 hosted
# runners; unset, 0 or not a number gives a ::warning and 12),
# CI_SELF_HOSTED_BIGDISK (C1) and CI_SELF_HOSTED_BIGDISK_DOCKER (C2), the
# self-hosted units of each label (either unset, 0 or not a number sends
# the run hosted with a ::warning: both are needed to place a run on the
# Dells). Hosted use is H/HS; self-hosted use is the larger of S1/C1 and
# S2/C2. The pool with the lower use wins, compared by cross-multiplication
# in whole numbers, and a tie goes hosted; a full pool (H >= HS, or
# S1 >= C1 or S2 >= C2) sends the run to the other; with both full, the run
# takes the pool with fewer queued jobs (bigdisk and bigdisk-docker
# together), and a tie goes hosted. The self-hosted units are shared across
# repositories, so C1 and C2 can overstate this repository's free room;
# counting its queued self-hosted jobs corrects for that: when the units
# are busy elsewhere its jobs queue, its self-hosted use rises, and its
# runs go hosted. The grace period, HOSTED_JOBS_PER_REPO and
# HOSTED_QUEUE_GRACE_SECONDS are removed. Unchanged: a fork's head takes the
# hosted default with a ::notice and no call (v1.52), off github.com there
# is no selection, the token reaches curl from a file descriptor, and a
# reply that is not 200 or a listing short of its total sends the run
# hosted with a ::warning. Every workflow that reads the outputs `runner`
# and `runner_docker` takes the same decision. testdata/runner-select-tests.py
# holds the cases. Adopt as a ci.yml-only bump that keeps the CUSTOMIZE
# blocks; CI configuration rolls out at once (ruling 443).
# v1.53 (2026-11-21, Tenant Agent ruling 1087, owner order: remove the
# bottlenecks): main has one concurrency group per event again, `main-{event}`,
# so a newer push to main cancels the older main run still queued or in
# progress, and the newest run validates every merge under it. This
# supersedes v1.26.2's `main-{event}-{sha}` (ruling 145): with hosted
# concurrency at 20 jobs on the Free plan, nothing cancelled a superseded
# main run, and trusted-firmware had 40 main runs queued ahead of PR work.
# A schedule run keeps `schedule-{repository}` and a workflow_dispatch run
# keeps `main-workflow_dispatch`, so neither shares a group with a push run.
# v1.53 also (Tenant Agent on trusted-firmware #821): (0) `Runner labels
# (ruling 633)` lets code-review.yml's API-only jobs take exactly
# [self-hosted, linux, x64, bigdisk] for a same-repository head under a PR
# event, so the Review scope job no longer waits behind the hosted queue
# (code-review.yml v5.12.12); a fork's head still takes a standard image
# (testdata/runner-labels-tests.py part I). (1) CI Gate runs on
# !cancelled() off pull_request, so a main run cancelled by a newer push
# posts a skipped gate, not a failed one; a pull request keeps always(), as
# a skipped required check counts as passed (testdata/ci-gate-cancel-tests.py).
# (2) main-green for a release or an alpha tag is a ci.yml run for the exact
# commit to be tagged, completed with conclusion success: a push run, or,
# when the newest push runs were cancelled by later pushes, a
# workflow_dispatch run on main (group main-workflow_dispatch, which no push
# cancels); the tag goes on that run's head_sha. A red, cancelled or missing
# main run never stops a pull request's merge (local-software-factory.md
# steps 11 and 12). (3) preflight takes the Dells' bigdisk pool while
# CI_PREFLIGHT_RUNS_ON is unset; the Infra Department sets it to
# `"ubuntu-latest"` on every repository when that pool has no online runner
# for 10 minutes, and unsets it when the pool is back (devops.md). (4)
# ci-mask-lan.sh masks internal host names as well as private addresses, and
# no comment names an internal repository.
# cancel-in-progress stays a literal `true`. Only the group changes. Adopt as
# a ci.yml-only PR that keeps the CUSTOMIZE blocks, together with v1.52's
# runner selection (internal pull requests run on our runners), separately
# from code-review.yml.
# v1.52 (2026-11-21, Tenant Agent order, defect fix): a fork's pull request
# under pull_request reached a self-hosted runner. preflight's runs-on had
# no fork check, so on github.com it took the Dells' bigdisk pool for a
# fork's head, and `Hosted or overflow runner (ruling 1024)` could overflow
# every other job of that run to the Dells. A pull request whose head
# repository is not this repository, a deleted fork included, now runs
# every job on ubuntu-latest: preflight's runs-on adds the clause
# `(!startsWith(github.event_name, 'pull_request') ||
# github.event.pull_request.head.repo.full_name == github.repository)`
# before the variable, so a fork takes `ubuntu-latest` whatever
# CI_PREFLIGHT_RUNS_ON holds, and the selection step outputs the hosted
# default for a fork's head with a ::notice and no API call. `Runner labels
# (ruling 633)` gives a fork's head under pull_request, as under
# pull_request_target since v1.51, no unset-variable exemption, and reads
# the selection outputs for it at their hosted default, as the step emits.
# Same-repository pull requests, pushes and Gitea are unchanged.
# testdata/runner-labels-tests.py part H and testdata/runner-select-tests.py
# part E hold the cases. Adopt as a one-file bump that keeps the CUSTOMIZE
# blocks.
# v1.51 (2026-11-21, ruling 633 hardening): `Runner labels (ruling 633)`
# also checks every runs-on under pull_request_target, same-repository and
# fork. code-review.yml and signatures.yml run on that base-defined event, so
# a runs-on that picks a self-hosted label only there was never read. In a
# workflow with that trigger a fork's head gets no overflow and no
# unset-variable exemption: a fork never reaches a self-hosted runner, and
# its finding says so. testdata/runner-labels-tests.py part G holds the
# cases. No other change.
# v1.50 (2026-11-21, rulings 999/1024 "hosted first with overflow to the
# Dells", defect fix): the overflow never fired under load. The Actions
# API's runs?status=queued listing returns fewer items than its total_count
# while runs change state (go-trusted-platform preflights 01:15Z-01:40Z on
# 11-21: "61 of 62 entries", "57 of 59"; go-quicbaas 02:23Z: "30 of 31"),
# and `Hosted or overflow runner (ruling 1024)` treated every short list as
# an unread count and picked hosted, so the longer the hosted queue, the
# surer the hosted pick. A short list is now a lower bound: the counts can
# only be under, never over, so a lower bound at or past
# HOSTED_JOBS_PER_REPO, or a hosted job of another run queued past the
# grace in it, overflows as before. A short list that does not reach either
# trigger still picks hosted with a ::warning naming the shortfall. A reply
# that is not 200, a missing total_count or list, a threshold that is not a
# number, and more than 1000 entries still pick hosted with a warning.
# testdata/runner-select-tests.py C4 and B7 hold the cases. Adopt as a
# one-file bump that keeps the CUSTOMIZE blocks.
