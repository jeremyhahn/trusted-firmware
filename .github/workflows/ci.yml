# v1.45 (2026-11-18, Tenant Agent ruling 901): every job that builds an image
# (lint, lint-gates, image, integration, soak) runs scripts/ci-image-history.sh
# on the images it will use, after its last build step and before its first
# use, on a pool runner: a pool build passes the LAN caches as BuildKit
# secrets, which no history entry keeps, and the check fails on any private
# address in an image's history or config. publish-images checks through
