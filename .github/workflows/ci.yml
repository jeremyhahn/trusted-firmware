  optee-stack:
    # CUSTOMIZE (trusted-firmware, #253, ruling 250 (a); modelled on the
    # esp32-build job ahead of esp32-qemu-test): the OP-TEE stack (the
    # fetched release, its toolchains and the built stack) is built and
    # cached here, ahead of the optee job, so the test job always starts
    # from a warm cache. On a hit this job only looks the key up and passes
    # in minutes; on a miss it builds the stack cold and actions/cache's post
    # step saves it. It runs under the optee job's own needs and if.
    name: OP-TEE stack [optee-tools, optee-qemu]
    needs: [image, preflight]   # v1.29.3
    if: ${{ !cancelled() && needs.image.outputs.built == 'true' && !github.event.pull_request.draft && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && needs.preflight.outputs.optee == 'true')) && (github.event_name != 'schedule' || needs.preflight.outputs.verdict == 'run') }}   # v1.26
    # CUSTOMIZE (trusted-firmware, run 71052): the stack job saves `optee-4.11.0`
    # and the optee job restores it. On ubuntu-latest (DS-7400) both jobs share the
    # repository's Actions cache.
    runs-on: ubuntu-latest
    # CUSTOMIZE: run 70765, the one job built cold: setup, image and restore
    # miss 2 min, optee-tools 5, optee-qemu 133, the copy out of the
    # container 13 and the actions/cache save over 2: 2 + 5 + 133 + 13 + 2 =
    # 155. Its tests (26 more) now run in the optee job, so the cold build
    # fits under 180, the runner's own 3-hour job limit (ruling 250 (a)).
    # CA ruling 580's 120 ceiling for image builds would cut a cold build off
    # at 120 of its 155 minutes, so this job keeps 180.
    timeout-minutes: 180
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      CI_CACHE_CLASS: ${{ github.event_name == 'push' && 'main' || 'pr' }}
      IMAGE_CLASS: ${{ github.event_name == 'push' && 'main' || 'pr' }}
      IMAGE_TRUSTED_CLASS: ${{ github.event_name != 'push' && 'main' || '' }}
      IMAGE_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # v1.21.1: the image job's masking step, first, as in every job.
      - name: Free hosted runner disk
        if: ${{ runner.environment == 'github-hosted' }}   # v1.48: overflow runs on the Dells
        # Owner ruling 999: ubuntu-latest leaves about 14 GB free on /; the
        # devcontainer images this job builds or pulls need more, so drop the
        # preinstalled toolchains no job here uses instead of a self-hosted host.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker image prune --all --force > /dev/null
          df -h /
      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      # CUSTOMIZE (trusted-firmware, #253, the page's open question 6 as
      # proposed): OPTEE_CACHE, the fetched release, its toolchains and the
      # built stack, is cached by the pin in mk/optee.mk (`make -s
      # optee-pin`, the release tag), so a new pin misses and rebuilds.
      - name: The OP-TEE pin
        id: pin
        run: echo "release=$(make -s optee-pin)" >> "$GITHUB_OUTPUT"

      # Host-local OP-TEE cache (ci-template v1.36): a self-hosted runner
      # mounts a persistent per-host directory at $CI_HOST_CACHE (the Infra Department's
      # runner configuration, the pool's env and mounts). A stack lives there under
      # optee/<release>, renamed into place whole, so the directory existing
      # means it is complete. A hit never touches the Actions cache, which
      # sits in Azure blob storage behind the office's internet line; a miss
      # takes it from the Actions cache (or builds it) once per host and pin.
      # GitHub-hosted runners have no CI_HOST_CACHE and keep the Actions cache.
      - name: Look up the OP-TEE stack on this host
        id: host
        run: |
          enabled=false hit=false dir=
          if [ -n "${CI_HOST_CACHE:-}" ] && [ -d "$CI_HOST_CACHE" ] && [ -w "$CI_HOST_CACHE" ]; then
            enabled=true
            dir="$CI_HOST_CACHE/optee/${{ steps.pin.outputs.release }}"
            if [ -d "$dir" ]; then hit=true; fi
          fi
          echo "host cache: enabled=$enabled hit=$hit ${dir:+dir=$dir}"
          { echo "enabled=$enabled"; echo "hit=$hit"; echo "dir=$dir"; } >> "$GITHUB_OUTPUT"

      # lookup-only: a hit downloads nothing, since the optee job restores
      # the stack itself; a miss leaves the post step to save the build. With
      # a host cache that lacks the stack (v1.36) the step restores it, for
      # the keep step below; a host hit skips it.
      - name: Look up the OP-TEE stack
        id: cache
        if: ${{ steps.host.outputs.hit != 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/optee-cache
          key: optee-${{ steps.pin.outputs.release }}
          lookup-only: ${{ steps.host.outputs.enabled != 'true' }}

      - name: Log in to the forge registry
        if: ${{ steps.host.outputs.hit != 'true' && steps.cache.outputs.cache-hit != 'true' }}
        run: scripts/ci-registry-login.sh

      - name: Reuse the optee image
        if: ${{ steps.host.outputs.hit != 'true' && steps.cache.outputs.cache-hit != 'true' }}
        run: |
          # v1.29.4 and v1.29.5: Athens first when the runner sets DEVCACHE_GOPROXY
          # and the cache answers, `|` so any error falls through to the public
          # proxy; "$bp" is one quoted make argument and the Makefile quotes it.
          bp=
          if [ -n "${DEVCACHE_GOPROXY:-}" ] && curl -s -o /dev/null --max-time 5 "$DEVCACHE_GOPROXY/"; then
            bp="GO_BUILD_PROXY=$DEVCACHE_GOPROXY|https://proxy.golang.org"
          fi
          make docker-image-optee ${bp:+"$bp"}
          echo "OPTEE_IMAGE=$(make -s optee-image)" >> "$GITHUB_ENV"

      # On a miss only: one container builds the stack into an empty cache
      # dir, which IN_IMAGE_CACHE_SAVE copies back out (in-toolchain-image.sh)
      # for the post step to save. The network is for the fetch.
      - name: make optee-tools, optee-qemu (optee image)
        if: ${{ steps.host.outputs.hit != 'true' && steps.cache.outputs.cache-hit != 'true' }}
        env:
          IN_IMAGE_NETWORK: bridge
          IN_IMAGE_CACHE: ${{ runner.temp }}/optee-cache:/var/cache/tfw-optee
          IN_IMAGE_CACHE_SAVE: '1'
        run: scripts/in-toolchain-image.sh "$OPTEE_IMAGE" "make optee-tools OPTEE_CACHE=/var/cache/tfw-optee && make optee-qemu OPTEE_CACHE=/var/cache/tfw-optee"

      # Host-local OP-TEE cache (v1.36): a copy renamed into place, so a
      # concurrent job either sees the whole stack or none; the loser of a
      # race removes its copy.
      - name: Keep the OP-TEE stack on this host
        if: ${{ steps.host.outputs.enabled == 'true' && steps.host.outputs.hit != 'true' }}
        env:
          OPTEE_HOST_DIR: ${{ steps.host.outputs.dir }}
        run: |
          tmp="$(dirname "$OPTEE_HOST_DIR")/.tmp-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
          mkdir -p "$tmp"
          cp -a "$RUNNER_TEMP/optee-cache/." "$tmp/"
          if mv -T "$tmp" "$OPTEE_HOST_DIR" 2>/dev/null; then
            echo "kept the stack at $OPTEE_HOST_DIR"
          else
            rm -rf "$tmp"
            echo "another job kept the stack at $OPTEE_HOST_DIR first"
          fi

      - name: Tear down
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/docker-config"

  optee:
    # CUSTOMIZE (trusted-firmware, #253 slice 4): the pinned OP-TEE stack on
    # QEMU virt needs the optee image alone, so it runs beside everything
    # else. It builds or reuses its own image, as the ESP32 job does, and a
    # PR that changes only docs/optee-trustzone/ still runs it. Ruling 250
    # (a): the optee-stack job ahead of it builds and caches the stack; this
    # job only restores it and never builds it cold.
    name: OP-TEE [optee-qemu, integration-test-optee]
    # CUSTOMIZE (trusted-firmware, #253; modelled on the ESP32 job, rulings
    # 218(9), 219(5)): on a PR only when the `preflight` job saw an OP-TEE path
    # change or the PR is labelled ci:full; otherwise a push to main and the
    # nightly tier (schedule, workflow_dispatch) run it. It needs and gates
    # on the image job exactly as the ESP32 job does: a job that needed only
    # the changes job (now preflight) and gated on its result being success
    # (run 69905) or its optee output not empty (run 69954) was skipped
    # unstarted on a PR, while every job that ran there with a needs term in
    # its if also needed the image job and gated on its built output.
    # Ruling 250 (a): it also needs optee-stack, which saves the cache it
    # restores.
    needs: [image, optee-stack, preflight]   # v1.29.3
    if: ${{ !cancelled() && needs.image.outputs.built == 'true' && !github.event.pull_request.draft && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && needs.preflight.outputs.optee == 'true')) && (github.event_name != 'schedule' || needs.preflight.outputs.verdict == 'run') }}   # v1.26
    # CUSTOMIZE (trusted-firmware, run 71052): the stack job saves `optee-4.11.0`
    # and this job restores it. On ubuntu-latest (DS-7400) both jobs share the
    # repository's Actions cache.
    runs-on: ubuntu-latest
    # CUSTOMIZE: run 70765 on a cold cache: setup and image 2 min,
    # integration-test-optee 26. Warm, the restore and the copy into the
    # container add about what the save (over 2) and the copy out (13) took,
    # and optee-qemu rebuilds only the TA: 2 + 2 + 13 + 26 = 43 warm, so
    # about twice that, 90.
    timeout-minutes: 90
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      CI_CACHE_CLASS: ${{ github.event_name == 'push' && 'main' || 'pr' }}
      IMAGE_CLASS: ${{ github.event_name == 'push' && 'main' || 'pr' }}
      IMAGE_TRUSTED_CLASS: ${{ github.event_name != 'push' && 'main' || '' }}
      IMAGE_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # v1.21.1: the image job's masking step, first, as in every job.
      - name: Free hosted runner disk
        if: ${{ runner.environment == 'github-hosted' }}   # v1.48: overflow runs on the Dells
        # Owner ruling 999: ubuntu-latest leaves about 14 GB free on /; the
        # devcontainer images this job builds or pulls need more, so drop the
        # preinstalled toolchains no job here uses instead of a self-hosted host.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker image prune --all --force > /dev/null
          df -h /
      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      # CUSTOMIZE (trusted-firmware, #253, the page's open question 6 as
      # proposed): OPTEE_CACHE is cached by the pin in mk/optee.mk (`make -s
      # optee-pin`, the release tag); the optee-stack job saves it.
      - name: The OP-TEE pin
        id: pin
        run: echo "release=$(make -s optee-pin)" >> "$GITHUB_OUTPUT"

      # Ruling 250 (a): restore only, never save, and never build the stack
      # cold here. A miss means optee-stack did not save the key; the step
      # fails at once and its message names the key.
      # Host-local OP-TEE cache (ci-template v1.36): a self-hosted runner
      # mounts a persistent per-host directory at $CI_HOST_CACHE (the Infra Department's
      # runner configuration, the pool's env and mounts). A stack lives there under
      # optee/<release>, renamed into place whole, so the directory existing
      # means it is complete. A hit never touches the Actions cache, which
      # sits in Azure blob storage behind the office's internet line; a miss
      # takes it from the Actions cache (or builds it) once per host and pin.
      # GitHub-hosted runners have no CI_HOST_CACHE and keep the Actions cache.
      - name: Look up the OP-TEE stack on this host
        id: host
        run: |
          enabled=false hit=false dir=
          if [ -n "${CI_HOST_CACHE:-}" ] && [ -d "$CI_HOST_CACHE" ] && [ -w "$CI_HOST_CACHE" ]; then
            enabled=true
            dir="$CI_HOST_CACHE/optee/${{ steps.pin.outputs.release }}"
            if [ -d "$dir" ]; then hit=true; fi
          fi
          echo "host cache: enabled=$enabled hit=$hit ${dir:+dir=$dir}"
          { echo "enabled=$enabled"; echo "hit=$hit"; echo "dir=$dir"; } >> "$GITHUB_OUTPUT"

      # Fleet Ops 11-13: the 5.18 GiB restore died at 52% after the default
      # 10-minute segment timeout on the shared link (run with ~60 jobs
      # queued), and fail-on-cache-miss turned it red. 45 minutes fits the
      # 90-minute job.
      - name: Restore the OP-TEE stack
        id: cache
        if: ${{ steps.host.outputs.hit != 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '45'
        with:
          path: ${{ runner.temp }}/optee-cache
          key: optee-${{ steps.pin.outputs.release }}
          fail-on-cache-miss: true

      # Host-local OP-TEE cache (v1.36): a copy renamed into place, so a
      # concurrent job either sees the whole stack or none; the loser of a
      # race removes its copy.
      - name: Keep the OP-TEE stack on this host
        if: ${{ steps.host.outputs.enabled == 'true' && steps.host.outputs.hit != 'true' }}
        env:
          OPTEE_HOST_DIR: ${{ steps.host.outputs.dir }}
        run: |
          tmp="$(dirname "$OPTEE_HOST_DIR")/.tmp-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
          mkdir -p "$tmp"
          cp -a "$RUNNER_TEMP/optee-cache/." "$tmp/"
          if mv -T "$tmp" "$OPTEE_HOST_DIR" 2>/dev/null; then
            echo "kept the stack at $OPTEE_HOST_DIR"
          else
            rm -rf "$tmp"
            echo "another job kept the stack at $OPTEE_HOST_DIR first"
          fi

      - name: Log in to the forge registry
        run: scripts/ci-registry-login.sh

      - name: Reuse the optee image
        run: |
          # v1.29.4 and v1.29.5: Athens first when the runner sets DEVCACHE_GOPROXY
          # and the cache answers, `|` so any error falls through to the public
          # proxy; "$bp" is one quoted make argument and the Makefile quotes it.
          bp=
          if [ -n "${DEVCACHE_GOPROXY:-}" ] && curl -s -o /dev/null --max-time 5 "$DEVCACHE_GOPROXY/"; then
            bp="GO_BUILD_PROXY=$DEVCACHE_GOPROXY|https://proxy.golang.org"
          fi
          make docker-image-optee ${bp:+"$bp"}
          echo "OPTEE_IMAGE=$(make -s optee-image)" >> "$GITHUB_ENV"

      # One container, so the cache is copied in once (IN_IMAGE_CACHE in
      # in-toolchain-image.sh) and never back out. optee-qemu runs every time:
      # integration-test-optee builds only when the cache holds no build, and
      # a restored build holds the TA of the commit that saved it, not this
      # one's. The network is kept for any fetch optee-qemu's prerequisites
      # make.
      - name: make optee-qemu, integration-test-optee (optee image)
        env:
          IN_IMAGE_NETWORK: bridge
          # v1.36: the host's copy when this host holds the stack.
          IN_IMAGE_CACHE: ${{ steps.host.outputs.hit == 'true' && steps.host.outputs.dir || format('{0}/optee-cache', runner.temp) }}:/var/cache/tfw-optee
          IN_IMAGE_CACHE_SAVE: '0'
        run: scripts/in-toolchain-image.sh "$OPTEE_IMAGE" "make optee-qemu OPTEE_CACHE=/var/cache/tfw-optee && make integration-test-optee OPTEE_CACHE=/var/cache/tfw-optee"

      - name: Tear down
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/docker-config"

  # v1.27 (Company Agent m1192 (6), item 27; ruling 211): a repository's
  # `make lint-gates` (its own gates beside `make lint`) runs in this job, in
  # parallel with the image job's `make lint`. It runs only when the Makefile
  # or a tracked *.mk defines a lint-gates target; this repository defines
  # none (its `make lint` is the C firmware's lint, and `security` lists it),
  # so the job prints OK, builds no image and passes.
  # CUSTOMIZE (trusted-firmware): the toolchain image comes from
  # `make docker-image-toolchain`, which reuses it by hash, as the image job's
  # docs-only path does; this job never needs the integration image.
  lint-gates:
    name: Lint Gates [toolchain image]
    runs-on: ${{ github.server_url == 'https://github.com' && fromJSON(needs.preflight.outputs.runner_docker) || 'bigdisk' }}   # v1.48
    needs: preflight     # v1.29.3; v1.30; v1.34
    # v1.26: never on a draft. v1.29.3: on a schedule run, only on the
    # schedule guard's `run`.
    if: ${{ !github.event.pull_request.draft && needs.preflight.outputs.verdict == 'run' }}
    timeout-minutes: 45
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      # v1.22: the cache volumes' trust class (as in the image job).
      CI_CACHE_CLASS: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'main' || 'pr' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # v1.21.1: mask the forge credentials before any other step (as above).
      - name: Free hosted runner disk
        if: ${{ runner.environment == 'github-hosted' }}   # v1.48: overflow runs on the Dells
        # Owner ruling 999: ubuntu-latest leaves about 14 GB free on /; the
        # devcontainer images this job builds or pulls need more, so drop the
        # preinstalled toolchains no job here uses instead of a self-hosted host.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker image prune --all --force > /dev/null
          df -h /
      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      # Ruling 887: the LAN addresses this runner's environment names, masked
      # before any step that builds can print one.
      - name: Mask the LAN addresses
        env:
          # v1.53: a registry a later step takes from `vars` is masked here.
          # CUSTOMIZE: one VARS_<NAME> line per vars.<NAME> ending in _REGISTRY
          # that this job reads (testdata/ci-mask-lan-tests.py M1 to M3).
          VARS_CI_IMAGE_REGISTRY: ${{ vars.CI_IMAGE_REGISTRY }}
        run: scripts/ci-mask-lan.sh

      # A source check on the runner's shell: no make recipe runs here.
      - name: Does the Makefile define lint-gates?
        id: probe
        run: |
          mapfile -t mk < <(git ls-files -- Makefile '*.mk')
          if [ "${#mk[@]}" -gt 0 ] && grep -qE '^lint-gates[[:space:]]*:([^=]|$)' "${mk[@]}"; then
            echo "lint-gates target found"
            echo "has_target=true" >> "$GITHUB_OUTPUT"
          else
            echo "OK: no lint-gates target in the Makefile; nothing to run"
            echo "has_target=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reap stale CI stacks
        if: ${{ steps.probe.outputs.has_target == 'true' }}
        run: scripts/reap-stale-ci-stacks.sh "$CI_STACK_PREFIX"

      - name: Build the toolchain image
        if: ${{ steps.probe.outputs.has_target == 'true' }}
        run: |
          # v1.29.4 and v1.29.5: Athens first when the runner sets DEVCACHE_GOPROXY
          # and the cache answers, `|` so any error falls through to the public
          # proxy; "$bp" is one quoted make argument and the Makefile quotes it.
          bp=
          if [ -n "${DEVCACHE_GOPROXY:-}" ] && curl -s -o /dev/null --max-time 5 "$DEVCACHE_GOPROXY/"; then
            bp="GO_BUILD_PROXY=$DEVCACHE_GOPROXY|https://proxy.golang.org"
          fi
          make docker-image-toolchain ${bp:+"$bp"}
          echo "TOOLCHAIN_IMAGE=$(make -s toolchain-image)" >> "$GITHUB_ENV"

      # Ruling 901: the images the job built or pulled carry no private address in their history or
      # config, checked after the build and before any use, on a pool runner.
      - name: Check the images carry no private address
        if: ${{ !cancelled() && steps.probe.outputs.has_target == 'true' && env.TOOLCHAIN_IMAGE != '' && runner.environment != 'github-hosted' }}
        run: scripts/ci-image-history.sh "$TOOLCHAIN_IMAGE"

      # v1.22: bound this repo's cache volumes (as in the image job). It never
      # fails the job and keeps every volume a container mounts.
      - name: Trim the CI caches
        if: ${{ !cancelled() && steps.probe.outputs.has_target == 'true' && env.TOOLCHAIN_IMAGE != '' }}
        run: scripts/trim-ci-caches.sh "$CI_STACK_PREFIX" "$TOOLCHAIN_IMAGE"

      # v1.29.1: no -k; the first failing gate ends the step.
      - name: make lint-gates
        if: ${{ !cancelled() && steps.probe.outputs.has_target == 'true' && env.TOOLCHAIN_IMAGE != '' }}
        env:
          IN_IMAGE_NETWORK: none   # CUSTOMIZE: bridge when a gate needs the module proxy or a network
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make lint-gates GO_BUILD_TAGS='$GO_BUILD_TAGS'"


  # Integration tests run in the integration image (ci-standard.md §2), as a
  # compose stack on the runner host started by `make integration-test`. The
  # stack is named per run under the repo's prefix, the job reaps stale stacks
  # first (v1.18) and keeps its own teardown last under `if: always()`.
  # v1.23: full tier only (CI_FULL_TIER's expression). v1.41: every PR.
  integration:
    name: Integration [integration image]
    # v1.26: never on a draft PR, ci:full or not. v1.29.3: on a schedule run,
    # only on the schedule guard's `run`. v1.30: only on `run` on every event
    # (a refused run skips it).
    needs: preflight   # v1.34
    # v1.41 (ruling 742 (2)): every PR, as main; a docs-only PR skips it, as
    # it skips build and make coverage, and CI Gate reads it as `code`.
    if: ${{ (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ci/deps-bump') && !github.event.pull_request.draft && needs.preflight.outputs.verdict == 'run' && needs.preflight.outputs.docs_only != 'true' }}
    runs-on: ${{ github.server_url == 'https://github.com' && fromJSON(needs.preflight.outputs.runner_docker) || 'bigdisk' }}   # v1.48
    # CUSTOMIZE: trusted-firmware (#293; handbook sdlc.md §5a). The suite is
    # `make integration-test-host`: the real AVR images under simavr, and
    # tfwsim against the Go SDK, the example application and the xkms adapter.
    timeout-minutes: 60       # CUSTOMIZE: ceil(1.5 x this job's 72-hour p95), ci-standard.md §12
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      IT_PROJECT: ${{ github.event.repository.name }}-ci-${{ github.run_id }}-${{ github.run_attempt }}
      # CUSTOMIZE (trusted-firmware, Company Agent m644): the image job's trust
      # classes. This job computes the same hash-tagged toolchain image name
      # from the same commit (mk/docker.mk) and builds the integration image
      # with it as the cache; it never builds the toolchain image itself.
      IMAGE_CLASS: ${{ github.event_name == 'push' && 'main' || 'pr' }}
      IMAGE_TRUSTED_CLASS: ${{ github.event_name != 'push' && 'main' || '' }}
      # #613 (Codex round 4): Integration and Soak share a Docker pool and build
      # this image at once on a schedule or dispatch run; each builds under its
      # own temporary tag, and docker.mk's tag to IT_IMAGE is the one write of
      # the shared name.
      IMAGE_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # v1.21.1 (Tenant Agent m605 item 8): mask the forge credentials before
      # any other step. The runner injects them as plain environment
      # (dependency-resolution.md §6), which the log does not mask by itself,
      # and the token sits inside GIT_CONFIG_KEY_0's URL, so it is masked alone
      # as well.
      - name: Free hosted runner disk
        if: ${{ runner.environment == 'github-hosted' }}   # v1.48: overflow runs on the Dells
        # Owner ruling 999: ubuntu-latest leaves about 14 GB free on /; the
        # devcontainer images this job builds or pulls need more, so drop the
        # preinstalled toolchains no job here uses instead of a self-hosted host.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker image prune --all --force > /dev/null
          df -h /
      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      # Ruling 887: the LAN addresses this runner's environment names, masked
      # before any step that builds can print one.
      - name: Mask the LAN addresses
        env:
          # v1.53: a registry a later step takes from `vars` is masked here.
          # CUSTOMIZE: one VARS_<NAME> line per vars.<NAME> ending in _REGISTRY
          # that this job reads (testdata/ci-mask-lan-tests.py M1 to M3).
          VARS_CI_IMAGE_REGISTRY: ${{ vars.CI_IMAGE_REGISTRY }}
        run: scripts/ci-mask-lan.sh

      - name: Reap stale CI stacks
        run: scripts/reap-stale-ci-stacks.sh "$CI_STACK_PREFIX"

      # v1.23: the content-addressed integration image (as in the image job).
      - name: Name the integration image
        run: echo "IT_IMAGE=$(make -s it-image)" >> "$GITHUB_ENV"

      # CUSTOMIZE (trusted-firmware, Company Agent m644): the registry the
      # integration image's build reads the toolchain image's cache from.
      - name: Log in to the forge registry
        run: scripts/ci-registry-login.sh

      # CUSTOMIZE (trusted-firmware, ruling 901, #613): build (or reuse) the
      # integration image before the lease and the check, so a cold daemon's
      # image is leased and checked like a reused one; the run step then
      # re-tags the checked id and its docker-build-it prerequisite reuses it.
      - name: Build the integration image
        run: |
          # v1.29.4 and v1.29.5: Athens first when the runner sets DEVCACHE_GOPROXY
          # and the cache answers, `|` so any error falls through to the public
          # proxy; "$bp" is one quoted make argument and the Makefile quotes it.
          bp=
          if [ -n "${DEVCACHE_GOPROXY:-}" ] && curl -s -o /dev/null --max-time 5 "$DEVCACHE_GOPROXY/"; then
            bp="GO_BUILD_PROXY=$DEVCACHE_GOPROXY|https://proxy.golang.org"
          fi
          make docker-build-it ${bp:+"$bp"} IT_IMAGE="$IT_IMAGE"

      # v1.23: a lease on the integration image (from a Codex review). A
      # reused image can be older than REAP_IMAGE_MIN_AGE, so its age alone
      # does not keep another run's reap step off it while this job needs it.
      # A created, never-started container that names the image holds it,
      # because `docker image rm` refuses an image a container uses. Tear down
      # removes the lease; one a dead job leaves behind is a stale container,
      # which the reap step removes after the job timeout like any other.
      - name: Lease the integration image
        run: |
          lease="${CI_STACK_PREFIX}lease-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$(od -An -N4 -tx1 /dev/urandom | tr -d ' \n')"
          # v1.25.3: the daemon's image lock, shared with the reaper (v5) and
          # every re-tag. The next steps source these from image-lock.sh.
          image_lock() {
            local lock="${CI_STACK_PREFIX}image-lock" held at t i
            for ((i = 0; i < 660; i++)); do
              docker image inspect "$lock:base" >/dev/null 2>&1 ||
                head -c 1024 /dev/zero | docker import - "$lock:base" >/dev/null 2>&1 || true
              IMAGE_LOCK_ID=$(docker create --pull never --name "$lock" "$lock:base" true 2>/dev/null) && return 0
              IMAGE_LOCK_ID=
              if read -r held at < <(docker inspect -f '{{.Id}} {{.Created}}' "$lock" 2>/dev/null) &&
                t=$(date -d "$at" +%s 2>/dev/null) && [ $(($(date +%s) - t)) -ge 600 ]; then
                echo "removing the stale image lock $lock (created $at)"
                docker rm "$held" >/dev/null 2>&1 || true
                continue
              fi
              sleep 1
            done
            echo "::error::the image lock $lock was not free within 660 s"
            return 1
          }
          image_unlock() {
            [ -z "${IMAGE_LOCK_ID:-}" ] || docker rm "$IMAGE_LOCK_ID" >/dev/null 2>&1 || true
            IMAGE_LOCK_ID=
          }
          declare -f image_lock image_unlock > "$RUNNER_TEMP/image-lock.sh"
          trap image_unlock EXIT
          # v1.25.2: the lease holds the image id; IT_LEASE_ID carries it to the
          # re-tags. #613: the job builds the image in the step before, so a
          # missing image (or a lease create that fails) is an error, never a
          # skipped lease: the check step after checks "$IT_LEASE_ID" always.
          image_lock || exit 1
          if ! id=$(docker image inspect -f '{{.Id}}' "$IT_IMAGE" 2>/dev/null); then
            echo "::error::the integration image $IT_IMAGE is not on the daemon after its build"
            exit 1
          fi
          if ! docker create --pull never --name "$lease" "$id" true >/dev/null; then
            echo "::error::could not lease the integration image $IT_IMAGE ($id)"
            exit 1
          fi
          echo "IT_LEASE=$lease" >> "$GITHUB_ENV"
          echo "IT_LEASE_ID=$id" >> "$GITHUB_ENV"
          image_unlock

      # CUSTOMIZE: host tuning the suite needs goes here, as in the test job.

      # Ruling 901: the integration image the job leased carry no private address in their history or
      # config, checked after the build and before any use, on a pool runner.
      # #613: the job built the image and the lease fails without it, so
      # IT_LEASE_ID is always set here and the check never skips.
      - name: Check the images carry no private address
        if: ${{ !cancelled() && runner.environment != 'github-hosted' }}
        run: scripts/ci-image-history.sh "$IT_LEASE_ID"

      - name: make integration-test (integration image)
        run: |
          if [ -n "${IT_LEASE_ID:-}" ]; then
            . "$RUNNER_TEMP/image-lock.sh"
            trap image_unlock EXIT
            image_lock || exit 1
            docker tag "$IT_LEASE_ID" "$IT_IMAGE"
            image_unlock
          fi
          make integration-test IT_PROJECT="$IT_PROJECT" IT_IMAGE="$IT_IMAGE" GO_BUILD_TAGS="$GO_BUILD_TAGS"

      - name: Tear down
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/docker-config" # CUSTOMIZE (trusted-firmware, m644): the registry login
          # CUSTOMIZE: compose.yaml reads the image as TRUSTED_FIRMWARE_IT_IMAGE.
          TRUSTED_FIRMWARE_IT_IMAGE="$IT_IMAGE" docker compose -f build/docker/devcontainer/compose.yaml -p "$IT_PROJECT" down --volumes || true
          [ -z "${IT_LEASE:-}" ] || docker rm "$IT_LEASE" >/dev/null || true

  # Soak (v1.23, owner item 101): the integration suite looped in the
  # integration image until SOAK_MINUTES have passed, each iteration its own
  # compose stack, torn down before the next; the first red iteration fails
  # the job. v1.24 (owner ruling 2026-10-19, Tenant Agent m751 (e)): nightly
  # and workflow_dispatch only, off main pushes and off ci:full; the Gate marks
  # it `nightly`. It replaces nothing in batch.yml, whose soak stays a dispatch.
  soak:
    name: Soak [integration image]
    # v1.29.3: on a schedule run, only on the schedule guard's `run`.
    needs: preflight   # v1.34
    # v1.30: a dispatch off main is refused, so soak runs only on `run`.
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.preflight.outputs.verdict == 'run' }}
    runs-on: ${{ github.server_url == 'https://github.com' && fromJSON(needs.preflight.outputs.runner_docker) || 'bigdisk' }}   # v1.48
    timeout-minutes: 90       # CUSTOMIZE: SOAK_MINUTES plus one iteration, at least ceil(1.5 x the 72-hour p95)
    env:
      SOAK_MINUTES: 30        # CUSTOMIZE
      SOAK_TARGET: integration-test   # CUSTOMIZE: a make target of the integration image
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      IT_PROJECT: ${{ github.event.repository.name }}-ci-${{ github.run_id }}-${{ github.run_attempt }}-soak
      IMAGE_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}   # #613, as integration
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # v1.21.1: mask the forge credentials before any other step (as above).
      - name: Free hosted runner disk
        if: ${{ runner.environment == 'github-hosted' }}   # v1.48: overflow runs on the Dells
        # Owner ruling 999: ubuntu-latest leaves about 14 GB free on /; the
        # devcontainer images this job builds or pulls need more, so drop the
        # preinstalled toolchains no job here uses instead of a self-hosted host.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker image prune --all --force > /dev/null
          df -h /
      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      # Ruling 887: the LAN addresses this runner's environment names, masked
      # before any step that builds can print one.
      - name: Mask the LAN addresses
        env:
          # v1.53: a registry a later step takes from `vars` is masked here.
          # CUSTOMIZE: one VARS_<NAME> line per vars.<NAME> ending in _REGISTRY
          # that this job reads (testdata/ci-mask-lan-tests.py M1 to M3).
          VARS_CI_IMAGE_REGISTRY: ${{ vars.CI_IMAGE_REGISTRY }}
        run: scripts/ci-mask-lan.sh

      - name: Reap stale CI stacks
        run: scripts/reap-stale-ci-stacks.sh "$CI_STACK_PREFIX"

      # v1.23: the content-addressed integration image (as in the image job).
      - name: Name the integration image
        run: echo "IT_IMAGE=$(make -s it-image)" >> "$GITHUB_ENV"

      # CUSTOMIZE (trusted-firmware, Company Agent m644): the registry the
      # integration image's build reads the toolchain image's cache from.
      - name: Log in to the forge registry
        run: scripts/ci-registry-login.sh

      # CUSTOMIZE (trusted-firmware, ruling 901, #613): build (or reuse) the
      # integration image before the lease and the check, so a cold daemon's
      # image is leased and checked like a reused one; the run step then
      # re-tags the checked id and its docker-build-it prerequisite reuses it.
      - name: Build the integration image
        run: |
          # v1.29.4 and v1.29.5: Athens first when the runner sets DEVCACHE_GOPROXY
          # and the cache answers, `|` so any error falls through to the public
          # proxy; "$bp" is one quoted make argument and the Makefile quotes it.
          bp=
          if [ -n "${DEVCACHE_GOPROXY:-}" ] && curl -s -o /dev/null --max-time 5 "$DEVCACHE_GOPROXY/"; then
            bp="GO_BUILD_PROXY=$DEVCACHE_GOPROXY|https://proxy.golang.org"
          fi
          make docker-build-it ${bp:+"$bp"} IT_IMAGE="$IT_IMAGE"

      # v1.23: a lease on the integration image (from a Codex review). A
      # reused image can be older than REAP_IMAGE_MIN_AGE, so its age alone
      # does not keep another run's reap step off it while this job needs it.
      # A created, never-started container that names the image holds it,
      # because `docker image rm` refuses an image a container uses. Tear down
      # removes the lease; one a dead job leaves behind is a stale container,
      # which the reap step removes after the job timeout like any other.
      - name: Lease the integration image
        run: |
          lease="${CI_STACK_PREFIX}lease-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$(od -An -N4 -tx1 /dev/urandom | tr -d ' \n')"
          # v1.25.3: the daemon's image lock, shared with the reaper (v5) and
          # every re-tag. The next steps source these from image-lock.sh.
          image_lock() {
            local lock="${CI_STACK_PREFIX}image-lock" held at t i
            for ((i = 0; i < 660; i++)); do
              docker image inspect "$lock:base" >/dev/null 2>&1 ||
                head -c 1024 /dev/zero | docker import - "$lock:base" >/dev/null 2>&1 || true
              IMAGE_LOCK_ID=$(docker create --pull never --name "$lock" "$lock:base" true 2>/dev/null) && return 0
              IMAGE_LOCK_ID=
              if read -r held at < <(docker inspect -f '{{.Id}} {{.Created}}' "$lock" 2>/dev/null) &&
                t=$(date -d "$at" +%s 2>/dev/null) && [ $(($(date +%s) - t)) -ge 600 ]; then
                echo "removing the stale image lock $lock (created $at)"
                docker rm "$held" >/dev/null 2>&1 || true
                continue
              fi
              sleep 1
            done
            echo "::error::the image lock $lock was not free within 660 s"
            return 1
          }
          image_unlock() {
            [ -z "${IMAGE_LOCK_ID:-}" ] || docker rm "$IMAGE_LOCK_ID" >/dev/null 2>&1 || true
            IMAGE_LOCK_ID=
          }
          declare -f image_lock image_unlock > "$RUNNER_TEMP/image-lock.sh"
          trap image_unlock EXIT
          # v1.25.2: the lease holds the image id; IT_LEASE_ID carries it to the
          # re-tags. #613: the job builds the image in the step before, so a
          # missing image (or a lease create that fails) is an error, never a
          # skipped lease: the check step after checks "$IT_LEASE_ID" always.
          image_lock || exit 1
          if ! id=$(docker image inspect -f '{{.Id}}' "$IT_IMAGE" 2>/dev/null); then
            echo "::error::the integration image $IT_IMAGE is not on the daemon after its build"
            exit 1
          fi
          if ! docker create --pull never --name "$lease" "$id" true >/dev/null; then
            echo "::error::could not lease the integration image $IT_IMAGE ($id)"
            exit 1
          fi
          echo "IT_LEASE=$lease" >> "$GITHUB_ENV"
          echo "IT_LEASE_ID=$id" >> "$GITHUB_ENV"
          image_unlock

      # CUSTOMIZE: host tuning the suite needs goes here, as in the test job.

      # Ruling 901: the integration image the job leased carry no private address in their history or
      # config, checked after the build and before any use, on a pool runner.
      # #613: the job built the image and the lease fails without it, so
      # IT_LEASE_ID is always set here and the check never skips.
      - name: Check the images carry no private address
        if: ${{ !cancelled() && runner.environment != 'github-hosted' }}
        run: scripts/ci-image-history.sh "$IT_LEASE_ID"

      - name: Soak (integration suite, looped)
        run: |
          if [ -n "${IT_LEASE_ID:-}" ]; then
            . "$RUNNER_TEMP/image-lock.sh"
            trap image_unlock EXIT
          fi
          deadline=$(( $(date +%s) + SOAK_MINUTES * 60 ))
          i=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            i=$((i + 1))
            p="$IT_PROJECT-$i"
            echo "$p" > "$RUNNER_TEMP/soak-project"
            echo "soak iteration $i"
            if [ -n "${IT_LEASE_ID:-}" ]; then
              image_lock || exit 1
              docker tag "$IT_LEASE_ID" "$IT_IMAGE"
              image_unlock
            fi
            rc=0
            make "$SOAK_TARGET" IT_PROJECT="$p" IT_IMAGE="$IT_IMAGE" GO_BUILD_TAGS="$GO_BUILD_TAGS" || rc=$?
            IT_IMAGE="$IT_IMAGE" docker compose -f build/docker/devcontainer/compose.yaml -p "$p" down --volumes || true
            if [ "$rc" -ne 0 ]; then
              echo "::error::soak iteration $i failed (exit $rc)"
              exit "$rc"
            fi
          done
          echo "soak: $i iterations in $SOAK_MINUTES min, all green"

      - name: Tear down
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/soak-project" ]; then
            IT_IMAGE="$IT_IMAGE" docker compose -f build/docker/devcontainer/compose.yaml -p "$(cat "$RUNNER_TEMP/soak-project")" down --volumes || true
          fi
          rm -f "$RUNNER_TEMP/soak-project"
          [ -z "${IT_LEASE:-}" ] || docker rm "$IT_LEASE" >/dev/null || true

  # CUSTOMIZE: further stages run in the image job as steps of the same
  # shape (one `make` target in the toolchain image, `if: !cancelled()`). A
  # suite that needs its own runner or stack (tagged suites, cross-arch,
  # contrib modules) is a job of the integration job's shape and joins CI
  # Gate's needs list and check lines. v1.23: such a suite is full tier (the
  # integration job's `if:`, `full` in CI Gate) unless it is lint, build,
  # unit or race, which stay on the PR tier.

  # v1.35 (Company Agent m2557, owner ruling on commit signing, 2026-11-11):
  # every commit that reaches main is signed by a registered identity. Each
  # agent keeps its own App identity (<repo>-agent[bot]) and its own SSH
  # signing key, and agent work is never attributed to the owner's account.
  # The registry is .github/allowed_signers (ssh allowed_signers format: the
  # principal is the exact committer email, then the public key), synced from
  # the handbook's software/templates/signing/<repo>.allowed_signers. The job
  # reads it from the BASE commit, so a pull request cannot add the key that
  # signs it; only the first adoption, with no registry at the base, reads it
  # from the head, with a warning. It checks every commit in the range: base..head
  # on a pull request, before..after on a push to main, the one commit on a
  # schedule or dispatch run or a new branch. A commit passes when
  # `git verify-commit` (gpg.format=ssh, gpg.ssh.allowedSignersFile) accepts it
  # AND the key's registered principal is the committer email; a commit GitHub
  # made (committer noreply@github.com: a squash merge, an update-branch merge)
  # passes when the API reports it verified with committer web-flow. It fails
  # closed on an unsigned commit, an unknown key, a principal mismatch and an
  # unreadable API, printing the commit and why; an email outside the registry
  # and GitHub's noreply forms is never printed. Nothing but git and the API
  # runs: no repository code, no token beyond github.token (contents: read).
  signatures:
    name: Signatures
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify commit signatures against .github/allowed_signers
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE: ${{ github.event.before }}
          REPO: ${{ github.repository }}
          API: ${{ github.api_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          zero() { [ -z "$1" ] || printf '%s' "$1" | grep -qE '^0+$'; }
          isrev() { ! zero "$1" && git cat-file -e "$1^{commit}" 2>/dev/null; }
          ASF="${RUNNER_TEMP:-/tmp}/allowed_signers"
          # The registry is read from the base, so a pull request cannot add the key
          # that signs it. Only the first adoption, with no registry at the base,
          # reads it from the head.
          REG=""
          if [ "$EVENT" = pull_request ]; then REG="$BASE_SHA"; elif [ "$EVENT" = push ]; then REG="$BEFORE"; fi
          # v1.35.1: a named base that is not in the clone (a push after a force
          # push, a base the checkout did not bring) is fetched; if it still cannot
          # be read the job fails, never falling back to the head's registry or to
          # the head commit alone.
          if [ "$EVENT" = pull_request ] && [ -z "$REG" ]; then
            echo "FAIL a pull_request run with no base SHA"; exit 1
          fi
          if ! zero "$REG" && ! isrev "$REG"; then
            git fetch -q --no-tags origin "$REG" 2>/dev/null || true
            isrev "$REG" || { echo "FAIL the base ${REG:0:12} cannot be read, so neither the registry nor the range can be checked"; exit 1; }
          fi
          if isrev "$REG" && git cat-file -e "$REG:.github/allowed_signers" 2>/dev/null; then
            git show "$REG:.github/allowed_signers" > "$ASF"
            echo "registry: .github/allowed_signers at ${REG:0:12}"
          elif git cat-file -e "$HEAD_SHA:.github/allowed_signers" 2>/dev/null; then
            git show "$HEAD_SHA:.github/allowed_signers" > "$ASF"
            echo "::warning::no registry at the base: .github/allowed_signers read from the head (first adoption only)"
          else
            echo "FAIL no .github/allowed_signers in this repository"; exit 1
          fi
          # The range: base..head on a pull request, before..after on a push to main,
          # and the one commit otherwise (a new branch, a schedule or dispatch run).
          if [ "$EVENT" = pull_request ] && isrev "$BASE_SHA"; then RANGE="$BASE_SHA..$HEAD_SHA"
          elif [ "$EVENT" = push ] && isrev "$BEFORE"; then RANGE="$BEFORE..$HEAD_SHA"
          else RANGE="$HEAD_SHA -1"; fi
          # shellcheck disable=SC2086 # RANGE is one or two words on purpose
          COMMITS=$(git rev-list --reverse $RANGE) || { echo "FAIL cannot list the range $RANGE"; exit 1; }
          N=$(printf '%s\n' "$COMMITS" | grep -c . || true)
          echo "checking $N commit(s) in $RANGE"
          reg_principals=$(awk '!/^[[:space:]]*(#|$)/ {print $1}' "$ASF")
          shown() { # print an email only when it is public: a registry principal or a GitHub noreply
            if printf '%s\n' "$reg_principals" | grep -qxF -- "$1" || printf '%s' "$1" | grep -qE '@users\.noreply\.github\.com$|^noreply@github\.com$'; then
              printf '%s' "$1"; else printf 'an address not in the registry'; fi
          }
          BAD=0
          for c in $COMMITS; do
            ce=$(git log -1 --format=%ce "$c")
            s=$(git log -1 --format=%s "$c" | cut -c1-60)
            if [ "$ce" = noreply@github.com ]; then
              # GitHub made it (a squash merge, an update-branch merge): accept it only
              # when the API says GitHub signed and verified it as web-flow.
              v=$(curl -fsS --retry 3 -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
                  "${API}/repos/${REPO}/commits/${c}" | jq -r '[(.commit.verification.verified|tostring), .commit.verification.reason, (.committer.login // "none")] | @tsv') \
                || { echo "FAIL ${c:0:12} committed by GitHub, and the API could not be read: $s"; BAD=1; continue; }
              IFS=$'\t' read -r ok reason login <<<"$v"
              if [ "$ok" = true ] && [ "$login" = web-flow ]; then
                echo "OK   ${c:0:12} GitHub web-flow, verified: $s"
              else
                echo "FAIL ${c:0:12} committed as GitHub but not verified (verified=$ok reason=$reason committer=$login): $s"; BAD=1
              fi
              continue
            fi
            # v1.35.1: grep reads the whole object (no -q), so under pipefail a
            # long commit message never ends the pipeline with SIGPIPE.
            if ! git cat-file commit "$c" | grep '^gpgsig' >/dev/null; then
              echo "FAIL ${c:0:12} unsigned, committer $(shown "$ce"): $s"; BAD=1; continue
            fi
            g() { git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile="$ASF" "$@"; }
            if ! g verify-commit "$c" >/dev/null 2>&1; then
              echo "FAIL ${c:0:12} signed by a key not in the registry (or a bad signature), committer $(shown "$ce"): $s"; BAD=1; continue
            fi
            signer=$(g log -1 --format=%GS "$c")
            if [ "$signer" != "$ce" ]; then
              echo "FAIL ${c:0:12} principal mismatch: the key is registered to $signer, the committer is $(shown "$ce"): $s"; BAD=1; continue
            fi
            echo "OK   ${c:0:12} signed by $signer: $s"
          done
          exit $BAD

  # The single required check (devops.md §1). Every job above must appear in
  # BOTH the needs list and the results check — a gate that can pass vacuously
  # is worse than no gate. Do not use join(needs.*.result); it evaluates empty
  # on Gitea and reports success while jobs fail.
  # v1.21: on the ci-gate runners (Tenant Agent m386: only CI Gate runs there;
  # a 1-CPU gate runner cannot hold a stage). trivy and fips are in nightly.yml
  # (v1.9, devops.md §8a: the alpha regime).
  ci-gate:
    timeout-minutes: 10
    name: CI Gate
    runs-on: ${{ github.server_url == 'https://github.com' && fromJSON(needs.preflight.outputs.runner || '"ubuntu-latest"') || 'ci-gate' }}   # v1.48
    # v1.29.3: on a schedule run the schedule guard decides. `busy` skips the
    # gate, so `CI / CI Gate (schedule)` posts `skipped` (Gitea 1.27.1 posts a
    # skipped job as `skipped`, not `success`), never a green nightly. Every
    # other verdict, an empty one included, runs it.
    # v1.53 (Tenant Agent on trusted-firmware #821): with main-{event} a newer
    # push cancels the older main run, and an always() gate then read the
    # cancelled needs and failed, so every superseded main commit showed a red
    # gate. Off pull_request the gate runs on !cancelled(): a cancelled run
    # posts no gate result (skipped), and a run that is not cancelled still
    # fails closed on any need that failed. A pull request keeps always(): a
    # skipped required check counts as passed, so a cancelled PR run must post
    # a failing gate, never a skip; only an older head of the PR is cancelled
    # by its group, and the head that merges has its own run.
    if: ${{ (startsWith(github.event_name, 'pull_request') && always() || !cancelled()) && (github.event_name != 'schedule' || needs.preflight.outputs.verdict != 'busy') }}
    # CUSTOMIZE: the repo's job list. Add every CUSTOMIZE job here AND as a
    # check line below; remove none of the template's jobs. CUSTOMIZE
    # (trusted-firmware): no lint job (make lint is in the image job) and no
    # publish-images; signatures stays here (v1.35).
    needs: [preflight, image, lint-gates, unit, security, esp32-build, esp32-qemu-test, optee-stack, optee, integration, soak, signatures]   # v1.34; v1.35 signatures
    steps:
      - name: Fail closed on any non-success
        env:
          # The full tier is CI_FULL_TIER (v1.23); v1.41: every event, a PR
          # included, but a refused dispatch. A job marked `full` may be skipped below only
          # when it is not selected; a `pr` job may never be skipped.
          FULL_TIER: ${{ env.CI_FULL_TIER }}
          # v1.24: a `nightly` job runs on schedule and workflow_dispatch only.
          NIGHTLY: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          # v1.26: a draft PR runs no CI, so its gate fails rather than pass on skips.
          DRAFT: ${{ github.event.pull_request.draft == true }}
          # v1.29.3: the schedule guard's verdict; #613: read on every event.
          SCHEDULE: ${{ github.event_name == 'schedule' }}
          SCHEDULE_GUARD: ${{ needs.preflight.outputs.verdict }}
          # CUSTOMIZE (trusted-firmware): a `docs` job builds or tests code, so
          # a docs-only PR (v1.24, the `preflight` job) may skip it; any other
          # event or PR may not. A failed `preflight` job reads as not docs-only.
          DOCS_ONLY: ${{ needs.preflight.outputs.docs_only }} # CUSTOMIZE
          # CUSTOMIZE (trusted-firmware, ruling 218(9), 219(5)): the
          # `esp32-build` job may skip only on a PR that changed no ESP32 path
          # (the `preflight` job's esp32 output). Ruling 220(j): the
          # `esp32-qemu-test` job may skip only on a PR, any PR. On a push,
          # schedule or workflow_dispatch both must run, and a skipped or
          # failed one fails the gate.
          ESP32_CHANGED: ${{ needs.preflight.outputs.esp32 }} # CUSTOMIZE
          ESP32_PR: ${{ github.event_name == 'pull_request' }} # CUSTOMIZE: ruling 219(5)
          # CUSTOMIZE (trusted-firmware, #253, as for esp32): an `optee` job
          # (optee-stack and optee, under one if since ruling 250 (a)) may skip only on a PR that changed no OP-TEE path and is not
          # labelled ci:full (the `preflight` job's optee output). On a push,
          # schedule or workflow_dispatch it must run, and a skipped or
          # failed one fails the gate.
          OPTEE_CHANGED: ${{ needs.preflight.outputs.optee }} # CUSTOMIZE
        run: |
          if [ "${DRAFT}" = true ]; then
            echo "FAIL draft pull request: no CI runs on a draft. Mark it ready, then push an empty commit to start its run."
            exit 1
          fi
          BAD=0
          echo "full tier selected: ${FULL_TIER}; nightly selected: ${NIGHTLY}"
          check() { # <job> <result> <pr|full|nightly>
            case "$2" in
              success) echo "OK   $1";;
              skipped)
                if [ "$3" = full ] && [ "${FULL_TIER}" != true ]; then
                  echo "SKIP $1 (full tier not selected)"
                elif [ "$3" = nightly ] && [ "${NIGHTLY}" != true ]; then
                  echo "SKIP $1 (nightly and dispatch only)"
                elif [ "$3" = docs ] && [ "${DOCS_ONLY}" = true ]; then # CUSTOMIZE
                  echo "SKIP $1 (docs-only PR)" # CUSTOMIZE
                elif [ "$3" = esp32 ] && [ "${ESP32_PR}" = true ] && [ "${ESP32_CHANGED}" != true ]; then # CUSTOMIZE: ruling 218(9), 219(5)
                  echo "SKIP $1 (PR changed no ESP32 path; push and nightly run it)" # CUSTOMIZE
                elif [ "$3" = esp32-qemu ] && [ "${ESP32_PR}" = true ]; then # CUSTOMIZE: ruling 220(j)
                  echo "SKIP $1 (off the PR tier; push and nightly run it)" # CUSTOMIZE
                elif [ "$3" = optee ] && [ "${ESP32_PR}" = true ] && [ "${OPTEE_CHANGED}" != true ]; then # CUSTOMIZE: #253
                  echo "SKIP $1 (PR changed no OP-TEE path; push, nightly and ci:full run it)" # CUSTOMIZE
                else
                  echo "FAIL $1 (skipped)"; BAD=1
                fi;;
              *) echo "FAIL $1 ($2)"; BAD=1;;
            esac
          }
          # v1.29.3: a schedule run reaches this step on any verdict but
          # `busy`. Any verdict but `run` means its bigdisk jobs skipped
          # because the guard had no count: fail closed.
          if [ "${SCHEDULE}" = true ] && [ "${SCHEDULE_GUARD}" != run ]; then
            echo "FAIL schedule-guard (verdict '${SCHEDULE_GUARD:-none}': the bigdisk jobs skipped because the guard could not read the API; see its log)"; BAD=1
          fi
          # #613: a refused run (a dispatch off main and ci/deps-bump, or a PR
          # from a lane-ckpt/* branch) fails on every event, a docs-only PR
          # included: its image, lint-gates and integration jobs skip.
          if [ "${SCHEDULE_GUARD}" = refused ]; then
            echo "FAIL preflight (verdict 'refused': see the preflight log)"; BAD=1
          fi
          # CUSTOMIZE: one line per job in needs above. A job gated to the
          # full tier by its `if:` is marked full, one gated to schedule and
          # workflow_dispatch is nightly; every other job is pr. A leg that
          # builds or tests code is docs: a docs-only PR runs lint and the arch
          # gates alone (v1.24), and any other PR fails if the leg skips.
          check preflight   "${{ needs.preflight.result }}" pr
          check image       "${{ needs.image.result }}" pr
          check lint-gates  "${{ needs.lint-gates.result }}" pr
          check unit        "${{ needs.unit.result }}" docs
          check security    "${{ needs.security.result }}" docs
          check esp32-build "${{ needs.esp32-build.result }}" esp32 # CUSTOMIZE: ruling 218(9), 220(j)
          check esp32-qemu-test "${{ needs.esp32-qemu-test.result }}" esp32-qemu # CUSTOMIZE: ruling 220(j)
          check optee-stack "${{ needs.optee-stack.result }}" optee # CUSTOMIZE: #253, ruling 250 (a)
          check optee       "${{ needs.optee.result }}" optee # CUSTOMIZE: #253
          check integration "${{ needs.integration.result }}" docs # CUSTOMIZE: v1.41 skips it only on a docs-only PR
          check soak        "${{ needs.soak.result }}" nightly
          check signatures  "${{ needs.signatures.result }}" pr   # v1.35
          exit $BAD
