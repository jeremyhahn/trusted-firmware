# v1.44 (2026-11-18, Tenant Agent ruling 887; the owner's rule that internal
# addresses stay out of public repositories, and their CI logs count): every
# job that builds runs scripts/ci-mask-lan.sh right after the credential
# mask. A pool runner's environment names LAN addresses (the DEVCACHE_*
# package caches, GOPROXY's module proxy, the LAN CI registry); a BuildKit
