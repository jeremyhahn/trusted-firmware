# off main exempts refs/heads/ci/deps-bump, which runs the PR tier: a PR that
# GITHUB_TOKEN opens starts no pull_request run, so deps-bump.yml dispatches
# this workflow there. The repository's deps-check is the shared
# depscheck v1.0.0 (templates/deps/depscheck) with `-vuln`, and the daily
# deps-bump.yml (deps-bump v1.0.0) opens the one PR on ci/deps-bump that
# carries the bumps. A repository adopts v1.39 in one CI-file PR with
# scripts/depscheck, its Makefile's deps-check and deps-bump targets, and
# .github/workflows/deps-bump.yml. Every other job, gate and tier is v1.38's.
# v1.38 (2026-11-14, owner ruling 633, decision 219(d)): release and publish
# jobs run only on `[self-hosted, linux, x64, release]`, and no pull request
# job ever does. A pull request's test code reached the Docker daemon that
# main's image builds and the Trivy gate also used, so it could re-tag a base
