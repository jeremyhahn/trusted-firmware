      - name: make security-novuln
        env:
          IN_IMAGE_NETWORK: bridge
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make security-novuln GO_BUILD_TAGS='$GO_BUILD_TAGS'"

      - name: Tear down
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/docker-config"

