# v1.43 (2026-11-17, Tenant Agent ruling 833; the owner's 11-07 ruling that
# GitHub-hosted runners are the default, ruling 834's hosted-first phase 1):
# a job runs on a standard GitHub-hosted image unless it cannot fit one. The
# P1 repositories routed nearly every job to self-hosted pools for a push to
# main and a same-repository PR (go-qrdb 46 self-hosted references and no
# hosted runs-on), and about 250 jobs queued on the fleet while the 40
# hosted slots of a public repository's free standard runners sat idle. The
# preflight step `Runner labels (ruling 633)` gains two findings on
# github.com, for every job that does not name `release`: (c) its runs-on
# resolves, on some event, to anything but a standard GitHub-hosted image
# (ubuntu-latest, ubuntu-24.04, ubuntu-22.04, their -arm forms, ubuntu-slim),
# unless the runs-on line carries `# self-hosted: <reason>` (CUSTOMIZE: the
# jobs that cannot fit a standard runner, 4 vCPU, 16 GB, about 14 GB of disk
# and about 45 GB after `Free runner disk`: very large images or memory,
# privileged devices, hardware); (d) it names a larger runner (cores, large,
# xlarge, gpu), refused even with a reason, since a larger runner bills on a
# public repository. Every template job already passes; a repository adopts
# v1.43 by moving each job that fits to `ubuntu-latest` (keeping `Free runner
# disk` before an image build) and giving each job that stays a reason.
# v1.42 (2026-11-16, owner ruling 742 (1)): the CI Gate is hermetic. Its
# outcome depends only on the tree under test, on every event. The checks
# that fail on the state of the world rather than on a change leave ci.yml
# on every event: `make deps-check` (newer upstream releases and
# govulncheck's vulnerable requirements, both read from the network), the
# advisory half of `make security` (govulncheck and trivy fs against a fresh
# database) and `trivy image` of the integration image. Before it they turned
# mains red on their own, when an advisory or an upstream release appeared,
# and every PR cut from that main inherited the failure; v1.41's parity put
# them on every PR as well. They run only in scans.yml (scans v1.0.0, which
# replaces deps-bump.yml), on a schedule and on workflow_dispatch on main,
# never on a pull_request or a push. That workflow opens or updates ONE fix
# PR on ci/deps-bump with the bumps, and ONE issue for a finding the bump
# cannot clear. It is not the CI workflow, so a finding never reads as a red
# main and never starts revert-red-main.yml. gosec reads only the tree and
# stays on every event: the lint job runs `make gosec` again (v1.41 dropped
# the step and ran gosec inside `make security`). The lint job drops the
# deps-check steps and the image job drops `make security` and `trivy image`;
# the jobs, the needs list and CI Gate's check lines are unchanged.
# publish-images, on the release runner and never a PR gate, scans the
# toolchain image before it pushes it (ci-image-cache.sh v3). A repository
# adopts v1.42 in one CI-file PR that also takes ci-image-cache.sh v3,
# deletes .github/workflows/deps-bump.yml and adds scans.yml v1.0.0.
# Every other job, gate and tier is v1.41's.
# v1.41 (2026-11-16, owner ruling 742 (2)): PR/main parity. Every job and
# step that runs on a push to main also runs on a pull_request to main, with
# the same steps, so a PR never merges a change that main then fails on.
# CI_FULL_TIER is true on every event but a workflow_dispatch off main and
# off ci/deps-bump (which the preflight refuses), so a PR runs integration,
# make security and trivy image as main does; the integration job's `if:`
# no longer skips a PR. The `make gosec (PR tier)` step goes: make security
# runs gosec on every event. The squash merge of a PR runs the full tier on
# main again (#613 removed the unwired v1.30 fix 2 tree reuse). `ci:full` no longer selects a tier;
# it only turns off the two PR path scopes below. The exceptions, each a job
# that cannot run on a PR by nature or a scope whose inputs a PR does not
# change: publish-images (pushes images to the registry from the release
# runner, ruling 633: no PR job may reach that runner); soak (schedule and
# workflow_dispatch only, never on a push either, so no parity gap); the
# docs-only scope (a PR whose every file matches DOCS_ONLY_PATTERN skips build
# and make coverage, whose inputs it does not touch) and the lint-gates path
# scope (LINT_GATES_PATTERN); a docs-only PR skips the image job (make security,
# trivy image) as before and now integration too, so CI Gate checks integration
# as `code`, not `full`. A repository adopts v1.41 in one CI-file PR and
# sizes its PR runner capacity for the integration job on every PR.
# Every other job, gate and tier is v1.40's.
# v1.40 (2026-11-16, owner ruling 732): a library behind a newer upstream
# release never fails CI. The deps-check step passes DEPS_CHECK_LAG=report on
# every event, so depscheck v1.1.0 (`-lag report`) reports every lag and fails
# only a vulnerable go.mod requirement, a lookup failure, and a fork replace or
# pseudo-version with no reason comment on a line the change adds or bumps
# (ruling 640). Before it, deps-check turned 11+ PRs red across three
# repositories for upstream releases the PRs never touched. The daily
# deps-bump.yml (deps-bump v1.1.0) keeps the full gate and carries every lag
# as ONE PR on ci/deps-bump. A repository adopts v1.40 in one CI-file PR with
# scripts/depscheck v1.1.0, the Makefile's `-lag $(DEPS_CHECK_LAG)` argument
# and deps-bump.yml v1.1.0. Every other job, gate and tier is v1.39's.
# v1.39 (2026-11-14, ruling 640, owner decision 222 (a)): deps-check fails a
# library behind its latest release only when the change adds that go.mod
# requirement or changes its version, or when govulncheck reports a version of
# a go.mod requirement vulnerable (stdlib, toolchain and indirect-only findings
