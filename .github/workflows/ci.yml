# (no Actions cache, the LAN mask, the image history check): they run on
# bigdisk on the forge today. No fallback hides a failure, and the choice on
# error is hosted with a visible warning: when the counts cannot be read (a
# reply that is not 200, a list short of its total_count, a missing field,
# a threshold that is not a number), the step picks the hosted default and
# prints a ::warning that names why; it never sends a run to the Dells on
# an unread count. Off github.com it makes no call and each job keeps its
# forge label (bigdisk, ci-gate), as in v1.47. The preflight step `Runner
# labels (ruling 633)` accepts, in ci.yml only, a runs-on that reads exactly
