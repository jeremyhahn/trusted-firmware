    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # v1.21.1: the image job's masking step, first, as in every job.
      - name: Free hosted runner disk
        if: ${{ runner.environment == 'github-hosted' }}   # v1.48: overflow runs on the Dells
        # Owner ruling 999: ubuntu-latest leaves about 14 GB free on /; the
        # devcontainer images this job builds or pulls need more, so drop the
        # preinstalled toolchains no job here uses instead of a self-hosted host.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker image prune --all --force > /dev/null
          df -h /
      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: Log in to the forge registry
        run: scripts/ci-registry-login.sh

      - name: Reuse the toolchain image
        run: |
          # v1.29.4 and v1.29.5: Athens first when the runner sets DEVCACHE_GOPROXY
          # and the cache answers, `|` so any error falls through to the public
          # proxy; "$bp" is one quoted make argument and the Makefile quotes it.
          bp=
          if [ -n "${DEVCACHE_GOPROXY:-}" ] && curl -s -o /dev/null --max-time 5 "$DEVCACHE_GOPROXY/"; then
