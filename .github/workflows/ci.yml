# ci-template: v1.15 (adapted -- this repository is C firmware plus a Go SDK)
#
# The Go gates in the shared template have no meaning for AVR C, so each one is
# substituted by its C equivalent rather than dropped: gofmt becomes
# clang-format, go vet becomes cppcheck, golangci-lint becomes clang-tidy plus
# -Werror -Wconversion, and govulncheck -- which has no analogue without a
# package manager -- becomes a vendored-dependency manifest verified by hash.
# sdk/go is a real Go module and carries the full, unmodified Go gate set.
# xkms/ is a second Go module, above it, that depends on a private module; see
# the `xkms` job for why it is the one job that runs outside the image.
#
# Two gates here exist in no other repository in the fleet, because nothing
# else in it ships to a part with 2 KB of RAM or signs its own image:
#   size-check          fails the build when an image exceeds its board budget
#   reproducible-check  fails when the same source produces different bytes
#
# `make bench-check` measures the cycle budget and is NOT run here. Five of the
# six targets are missed by 3x to 11x and two are unreachable as stated, so a
# gate over them would either be red permanently or pinned at today's cost and
# green while the firmware is that far over. Run deliberately; numbers in
# docs/development/performance.md; debt in #11, #12 and #13.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The image tags are computed at RUNTIME, in the build step, and exported
# through $GITHUB_ENV. They are deliberately not expressions here.
#
# They were `tfw-ci-${{ github.run_id }}-${{ github.job }}`, which is correct on
# github.com and wrong on Gitea: `github.job` does not evaluate per job there,
# so every job in the run computed the SAME tag. Two jobs then exported two
# different images to one name at the same time and buildkit failed one of them
# -- which is the collision the comment in that step was written to prevent,
# reintroduced by the expression meant to prevent it. The log gives it away by
# naming `tfw-ci-<run>-lint` inside the unit-test job.

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: toolchain image with the source baked in
        # NOT a bind mount. The runner executes this job inside a container but
        # `docker run` reaches the HOST daemon, so -v "$PWD" resolves a path
        # that means something different to each -- Docker then mounts an empty
        # directory and every target fails with "no rule to make target".
        # `docker build` streams its context from the CLIENT filesystem, so
        # baking the source into an image sidesteps the translation entirely.
        #
        # And the image is not optional. The runner's own avr-gcc is 7.3.0,
        # which predates -ffile-prefix-map and generates different code; using
        # it would silently break the reproducible-build check and move every
        # size-budget number. The toolchain has to be pinned, not borrowed.
        run: |
          # A tag nothing else can be using. Several jobs share a runner and
          # build concurrently, and buildkit refuses to export two images to one
          # tag at once -- "already exists", which reads like a caching quirk
          # and is a race between siblings. Deriving the tag from the PID and
          # the nanosecond clock cannot collide, where an expression evaluated
          # by the CI server can and did.
          tag="tfw-$$-$(date +%s%N)"
          echo "IMG_BASE=$tag-base" >> "$GITHUB_ENV"
          echo "IMG=$tag" >> "$GITHUB_ENV"
          docker build -f docker/Dockerfile.ci -t "$tag-base" .
          # The commit is recorded IN the image: /src has no .git, and
          # `make provenance` refuses to write a manifest that cannot name the
          # source it came from. Same reason /etc/ci-toolchain.txt exists.
          printf 'FROM %s\nCOPY . /src\nRUN echo %s > /etc/ci-source-commit\n' \
            "$tag-base" "${{ github.sha }}" | docker build -t "$tag" -f - .
          docker run --rm "$tag" cat /etc/ci-toolchain.txt
      - name: cppcheck, the whitelist grep and the timestamp grep
        # `make lint`, not a second copy of the flags here. The two greps used
        # to be steps of their own, written out in this file -- so they were
        # gates a developer could not run, and one of them sat failing on main
        # for two commits. They are inside `make lint` now.
        #
        # The four places a preprocessor conditional is permitted are config.h,
        # a board profile, commands.def and src/hal/<arch>/. Everywhere else a
        # feature is gated by including or excluding a whole file. A gate whose
        # local and CI invocations differ is one a developer cannot
        # reproduce, and therefore one that gets argued with rather than
        # fixed. CI caught two findings my local run could not, for exactly
        # that reason.
        run: docker run --rm "$IMG" make lint
      - name: vendored dependencies match their recorded hashes
        run: docker run --rm "$IMG" make verify-vendor
      - name: the C and Go wire vectors agree
        run: docker run --rm "$IMG" make verify-vectors
      - name: the firmware matrix below is the one the Makefile builds
        # The matrix is a hand list; this is what keeps it honest. It is in
        # `make ci` too -- see the comment on the matrix.
        run: docker run --rm "$IMG" make ci-matrix-check

  unit:
    name: Host unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: toolchain image with the source baked in
        # NOT a bind mount. The runner executes this job inside a container but
        # `docker run` reaches the HOST daemon, so -v "$PWD" resolves a path
        # that means something different to each -- Docker then mounts an empty
        # directory and every target fails with "no rule to make target".
        # `docker build` streams its context from the CLIENT filesystem, so
        # baking the source into an image sidesteps the translation entirely.
        #
        # And the image is not optional. The runner's own avr-gcc is 7.3.0,
        # which predates -ffile-prefix-map and generates different code; using
        # it would silently break the reproducible-build check and move every
        # size-budget number. The toolchain has to be pinned, not borrowed.
        run: |
          # A tag nothing else can be using. Several jobs share a runner and
          # build concurrently, and buildkit refuses to export two images to one
          # tag at once -- "already exists", which reads like a caching quirk
          # and is a race between siblings. Deriving the tag from the PID and
          # the nanosecond clock cannot collide, where an expression evaluated
          # by the CI server can and did.
          tag="tfw-$$-$(date +%s%N)"
          echo "IMG_BASE=$tag-base" >> "$GITHUB_ENV"
          echo "IMG=$tag" >> "$GITHUB_ENV"
          docker build -f docker/Dockerfile.ci -t "$tag-base" .
          # The commit is recorded IN the image: /src has no .git, and
          # `make provenance` refuses to write a manifest that cannot name the
          # source it came from. Same reason /etc/ci-toolchain.txt exists.
          printf 'FROM %s\nCOPY . /src\nRUN echo %s > /etc/ci-source-commit\n' \
            "$tag-base" "${{ github.sha }}" | docker build -t "$tag" -f - .
          docker run --rm "$tag" cat /etc/ci-toolchain.txt
      - name: make test
        run: docker run --rm "$IMG" make test
      - name: every board's descriptor, against its own profile
        # `make test` configures the host build for ONE board, so on its own it
        # says nothing about the others. A board whose table is never compiled
        # is a rung that checks nothing, which is the failure that looks most
        # like success.
        run: docker run --rm "$IMG" make board-sweep
      - name: coverage
        run: docker run --rm "$IMG" make coverage

  sanitizers:
    name: ASan and UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: toolchain image with the source baked in
        # NOT a bind mount. The runner executes this job inside a container but
        # `docker run` reaches the HOST daemon, so -v "$PWD" resolves a path
        # that means something different to each -- Docker then mounts an empty
        # directory and every target fails with "no rule to make target".
        # `docker build` streams its context from the CLIENT filesystem, so
        # baking the source into an image sidesteps the translation entirely.
        #
        # And the image is not optional. The runner's own avr-gcc is 7.3.0,
        # which predates -ffile-prefix-map and generates different code; using
        # it would silently break the reproducible-build check and move every
        # size-budget number. The toolchain has to be pinned, not borrowed.
        run: |
          # A tag nothing else can be using. Several jobs share a runner and
          # build concurrently, and buildkit refuses to export two images to one
          # tag at once -- "already exists", which reads like a caching quirk
          # and is a race between siblings. Deriving the tag from the PID and
          # the nanosecond clock cannot collide, where an expression evaluated
          # by the CI server can and did.
          tag="tfw-$$-$(date +%s%N)"
          echo "IMG_BASE=$tag-base" >> "$GITHUB_ENV"
          echo "IMG=$tag" >> "$GITHUB_ENV"
          docker build -f docker/Dockerfile.ci -t "$tag-base" .
          # The commit is recorded IN the image: /src has no .git, and
          # `make provenance` refuses to write a manifest that cannot name the
          # source it came from. Same reason /etc/ci-toolchain.txt exists.
          printf 'FROM %s\nCOPY . /src\nRUN echo %s > /etc/ci-source-commit\n' \
            "$tag-base" "${{ github.sha }}" | docker build -t "$tag" -f - .
          docker run --rm "$tag" cat /etc/ci-toolchain.txt
      - name: make test-asan
        # The codec is pointer-heavy parser code reached from untrusted bytes,
        # so this is where a memory bug will be. It has already caught one
        # defect the ordinary build had constant-folded away.
        run: docker run --rm "$IMG" make test-asan

  firmware:
    name: Firmware (${{ matrix.board }}, ${{ matrix.crypto }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One line per image, and the list is HAND-WRITTEN on purpose: the
        # workflow engine wants a matrix it can read without running anything,
        # and a matrix computed by a prior job needs the toolchain image built
        # twice. What stops a hand list drifting is `make ci-matrix-check`
        # (in `make ci`, and the lint job below), which compares these lines with
        # `make firmware-matrix-list` -- the board x tier pairs `make
        # firmware-matrix` builds, read from each board's BOARD_TIERS -- and
        # fails in both directions. Add a board or a tier, and that gate names
        # the line to add here.
        #
        # Every board gets every tier it HAS, not a cross product: the element
        # tier is a different image -- different provider, different size -- and
        # building only the default would leave the attested build unverified on
        # the part it is tightest on, which is the 328P. The ATtiny85 has neither
        # soft nor atecc608a (the element is an I2C device on a part with no I2C;
        # the software tier's key store is a boot section it does not have), and
        # its only tier is `none` -- TFW_CRYPTO_NONE, the unattested one.
        include:
          - {board: atmega328p, crypto: soft}
          - {board: atmega328p, crypto: atecc608a}
          - {board: atmega2560, crypto: soft}
          - {board: atmega2560, crypto: atecc608a}
          - {board: atmega32u4, crypto: soft}
          - {board: atmega32u4, crypto: atecc608a}
          - {board: attiny85, crypto: none}
    steps:
      - uses: actions/checkout@v6
      - name: toolchain image with the source baked in
        # NOT a bind mount. The runner executes this job inside a container but
        # `docker run` reaches the HOST daemon, so -v "$PWD" resolves a path
        # that means something different to each -- Docker then mounts an empty
        # directory and every target fails with "no rule to make target".
        # `docker build` streams its context from the CLIENT filesystem, so
        # baking the source into an image sidesteps the translation entirely.
        #
        # And the image is not optional. The runner's own avr-gcc is 7.3.0,
        # which predates -ffile-prefix-map and generates different code; using
        # it would silently break the reproducible-build check and move every
        # size-budget number. The toolchain has to be pinned, not borrowed.
        run: |
          # A tag nothing else can be using. Several jobs share a runner and
          # build concurrently, and buildkit refuses to export two images to one
          # tag at once -- "already exists", which reads like a caching quirk
          # and is a race between siblings. Deriving the tag from the PID and
          # the nanosecond clock cannot collide, where an expression evaluated
          # by the CI server can and did.
          tag="tfw-$$-$(date +%s%N)"
          echo "IMG_BASE=$tag-base" >> "$GITHUB_ENV"
          echo "IMG=$tag" >> "$GITHUB_ENV"
          docker build -f docker/Dockerfile.ci -t "$tag-base" .
          # The commit is recorded IN the image: /src has no .git, and
          # `make provenance` refuses to write a manifest that cannot name the
          # source it came from. Same reason /etc/ci-toolchain.txt exists.
          printf 'FROM %s\nCOPY . /src\nRUN echo %s > /etc/ci-source-commit\n' \
            "$tag-base" "${{ github.sha }}" | docker build -t "$tag" -f - .
          docker run --rm "$tag" cat /etc/ci-toolchain.txt
      - name: build and enforce the size budget
        # The matrix here is for PARALLELISM, not for coverage: `make ci` runs
        # firmware-matrix, which builds every board and tier in one go. They
        # used to differ -- ci built one board while this built six -- and a
        # change that overflowed the 32U4 passed locally and went red here.
        run: docker run --rm "$IMG" make firmware BOARD=${{ matrix.board }} CRYPTO=${{ matrix.crypto }}
      - name: reproducible build
        run: docker run --rm "$IMG" make reproducible-check BOARD=${{ matrix.board }} CRYPTO=${{ matrix.crypto }}
      - name: extract the built image
        run: |
          id=$(docker create "$IMG")
          docker cp "$id:/src/build" ./build || true
          docker rm "$id" >/dev/null
      - name: upload the image
        # `ubuntu-latest` names OUR runner image on Gitea and GitHub's hosted
        # image on github.com. upload-artifact@v4 refuses a non-github.com
        # server, so it is guarded rather than left to fail the job.
        if: github.server_url == 'https://github.com'
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board }}-${{ matrix.crypto }}
          path: build/${{ matrix.board }}/${{ matrix.crypto }}/*.hex

  integration:
    name: Emulated firmware (simavr)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: toolchain image with the source baked in
        # NOT a bind mount. The runner executes this job inside a container but
        # `docker run` reaches the HOST daemon, so -v "$PWD" resolves a path
        # that means something different to each -- Docker then mounts an empty
        # directory and every target fails with "no rule to make target".
        # `docker build` streams its context from the CLIENT filesystem, so
        # baking the source into an image sidesteps the translation entirely.
        #
        # And the image is not optional. The runner's own avr-gcc is 7.3.0,
        # which predates -ffile-prefix-map and generates different code; using
        # it would silently break the reproducible-build check and move every
        # size-budget number. The toolchain has to be pinned, not borrowed.
        run: |
          # A tag nothing else can be using. Several jobs share a runner and
          # build concurrently, and buildkit refuses to export two images to one
          # tag at once -- "already exists", which reads like a caching quirk
          # and is a race between siblings. Deriving the tag from the PID and
          # the nanosecond clock cannot collide, where an expression evaluated
          # by the CI server can and did.
          tag="tfw-$$-$(date +%s%N)"
          echo "IMG_BASE=$tag-base" >> "$GITHUB_ENV"
          echo "IMG=$tag" >> "$GITHUB_ENV"
          docker build -f docker/Dockerfile.ci -t "$tag-base" .
          # The commit is recorded IN the image: /src has no .git, and
          # `make provenance` refuses to write a manifest that cannot name the
          # source it came from. Same reason /etc/ci-toolchain.txt exists.
          printf 'FROM %s\nCOPY . /src\nRUN echo %s > /etc/ci-source-commit\n' \
            "$tag-base" "${{ github.sha }}" | docker build -t "$tag" -f - .
          docker run --rm "$tag" cat /etc/ci-toolchain.txt
      - name: run the real image under simavr
        # Tier 2. The unit tests prove the LOGIC is right on x86 against a mock
        # HAL; this runs the .elf that actually gets flashed, so it covers what
        # no host build can reach -- the baud divisor, the interrupt vectors,
        # the order peripherals are brought up in, and the tick ISR's real rate.
        run: docker run --rm "$IMG" make integration-test
      - name: run tfw-boot under simavr
        # The same tier for the bootloader, with an ATECC608A modelled as a TWI
        # slave on the emulated bus -- so the element protocol goes through the
        # real TWI driver rather than through the tfw_hal_i2c_xfer seam the host
        # model sits above. It is in `make ci` too; a gate that runs in only one
        # of the two is a gate a developer cannot reproduce, and this repository
        # has gone red over that three times.
        run: docker run --rm "$IMG" make integration-test-boot

  sdk:
    name: Go SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: toolchain image with the source baked in
        # NOT a bind mount. The runner executes this job inside a container but
        # `docker run` reaches the HOST daemon, so -v "$PWD" resolves a path
        # that means something different to each -- Docker then mounts an empty
        # directory and every target fails with "no rule to make target".
        # `docker build` streams its context from the CLIENT filesystem, so
        # baking the source into an image sidesteps the translation entirely.
        #
        # And the image is not optional. The runner's own avr-gcc is 7.3.0,
        # which predates -ffile-prefix-map and generates different code; using
        # it would silently break the reproducible-build check and move every
        # size-budget number. The toolchain has to be pinned, not borrowed.
        run: |
          # A tag nothing else can be using. Several jobs share a runner and
          # build concurrently, and buildkit refuses to export two images to one
          # tag at once -- "already exists", which reads like a caching quirk
          # and is a race between siblings. Deriving the tag from the PID and
          # the nanosecond clock cannot collide, where an expression evaluated
          # by the CI server can and did.
          tag="tfw-$$-$(date +%s%N)"
          echo "IMG_BASE=$tag-base" >> "$GITHUB_ENV"
          echo "IMG=$tag" >> "$GITHUB_ENV"
          docker build -f docker/Dockerfile.ci -t "$tag-base" .
          # The commit is recorded IN the image: /src has no .git, and
          # `make provenance` refuses to write a manifest that cannot name the
          # source it came from. Same reason /etc/ci-toolchain.txt exists.
          printf 'FROM %s\nCOPY . /src\nRUN echo %s > /etc/ci-source-commit\n' \
            "$tag-base" "${{ github.sha }}" | docker build -t "$tag" -f - .
          docker run --rm "$tag" cat /etc/ci-toolchain.txt
      - name: gofmt and vet
        run: docker run --rm "$IMG" make sdk-lint
      - name: the Layer 0 invariant
        # sdk/go is imported by go-xkms at Layer 3 and go-trusted-platform at
        # Layer 5. An in-house dependency here would invert the graph and make
        # it unimportable by the projects it exists for.
        run: docker run --rm "$IMG" make sdk-verify
      - name: cross-implementation tests against the firmware
        # These talk to tfwsim: the real firmware compiled for the host. Not a
        # fake, which would drift from the firmware the moment either changed.
        run: docker run --rm "$IMG" make sdk-test

  xkms:
    name: xkms adapter
    runs-on: ubuntu-latest
    # The one job that does NOT run in the toolchain image, and the reason is
    # access. xkms/ imports github.com/jeremyhahn/go-xkms, a private module on
    # our Gitea. The fleet runner injects GOPRIVATE and a tokenised git rewrite
    # for github.com/jeremyhahn/* into the JOB's environment; `docker build`
    # bakes the source into an image and inherits none of it, so a
    # `go mod download` inside the build cannot reach Gitea. Handing the image a
    # token as a build argument would put a credential in an image layer and in
    # this file's history, so the job runs on the runner instead and takes the
    # access the runner already provides. No credential belongs in this
    # workflow, and none is here.
    #
    # What it needs from the runner is what the image otherwise supplies: a Go
    # toolchain (set up below, at the version the image pins), and a host C
    # compiler and make for tfwsim, which the end-to-end test enrols. avr-gcc is
    # not needed -- the simulators are host builds -- so the 7.3.0 problem the
    # other jobs avoid by using the image does not arise here.
    env:
      # Same as the image: the toolchain is pinned, never fetched on demand.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          # Keep in step with GO_VERSION in docker/Dockerfile.ci. go-xkms
          # requires Go >= 1.27.1; the exact version is pinned so this job and
          # `make ci` in the image compile with the same compiler.
          go-version: '1.27.2'
          # The module cache is keyed on a go.sum at the repository root, and
          # there is none; xkms/go.sum is not where the action looks.
          cache: false
      - name: host toolchain for tfwsim
        run: |
          go version
          for tool in gcc make; do
            command -v "$tool" >/dev/null || { echo "the runner has no $tool; tfwsim cannot be built"; exit 1; }
          done
      - name: private module access
        # Fail HERE, naming the cause, rather than as a compile error forty
        # lines into the test run. If this step fails the runner did not inject
        # GOPRIVATE and the git rewrite for github.com/jeremyhahn/*.
        run: cd xkms && go mod download github.com/jeremyhahn/go-xkms
      - name: xkms adapter tests and coverage
        # The same two targets `make ci` runs. Both depend on tfwsim and
        # tfwsim-atecc608a, so the end-to-end test enrols the real firmware
        # compiled for the host and never a binary somebody downloaded.
        run: make xkms-test xkms-coverage

  gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [lint, unit, sanitizers, firmware, integration, sdk, xkms]
    if: always()
    steps:
      - name: results
        # Every job is named explicitly rather than collapsed with
        # join(needs.*.result), which is a GitHub extension and evaluates to
        # empty on Gitea -- a gate that passes vacuously is worse than no gate.
        run: |
          echo "lint        ${{ needs.lint.result }}"
          echo "unit        ${{ needs.unit.result }}"
          echo "sanitizers  ${{ needs.sanitizers.result }}"
          echo "firmware    ${{ needs.firmware.result }}"
          echo "integration ${{ needs.integration.result }}"
          echo "sdk         ${{ needs.sdk.result }}"
          echo "xkms        ${{ needs.xkms.result }}"
      - name: fail unless every job succeeded
        if: >-
          needs.lint.result != 'success' ||
          needs.unit.result != 'success' ||
          needs.sanitizers.result != 'success' ||
          needs.firmware.result != 'success' ||
          needs.integration.result != 'success' ||
          needs.sdk.result != 'success' ||
          needs.xkms.result != 'success'
        run: exit 1
