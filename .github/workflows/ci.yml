          # by the CI server can and did.
          tag="ag-$$-$(date +%s%N)"
          echo "IMG_BASE=$tag-base" >> "$GITHUB_ENV"
          echo "IMG=$tag" >> "$GITHUB_ENV"
          docker build -f docker/Dockerfile.ci -t "$tag-base" .
          # The commit is recorded IN the image: /src has no .git, and
          # `make provenance` refuses to write a manifest that cannot name the
          # source it came from. Same reason /etc/ci-toolchain.txt exists.
          printf 'FROM %s\nCOPY . /src\nRUN echo %s > /etc/ci-source-commit\n' \
            "$tag-base" "${{ github.sha }}" | docker build -t "$tag" -f - .
          docker run --rm "$tag" cat /etc/ci-toolchain.txt
      - name: make test-asan
        # The codec is pointer-heavy parser code reached from untrusted bytes,
        # so this is where a memory bug will be. It has already caught one
        # defect the ordinary build had constant-folded away.
        run: docker run --rm "$IMG" make test-asan

  firmware:
    name: Firmware (${{ matrix.board }}, ${{ matrix.crypto }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [atmega328p, atmega2560, atmega32u4]
        # Both crypto tiers, every board. The element tier is a different image
        # -- different provider, different size -- and building only the default
        # would leave the attested build unverified on the part it is tightest
        # on, which is the 328P.
        crypto: [soft, atecc608a]
        # The ATtiny85 is NOT part of that cross product, and `include` rather
        # than another entry in `board` is what says so. Neither of those tiers
        # exists on that part: the element is an I2C device on a part with no
        # I2C, and the software tier's key store is a boot section it does not
        # have. Its only tier is `none` -- AG_CRYPTO_NONE, the unattested one --
        # and adding it to the list above would queue four jobs of which two
        # could only ever fail. `make firmware-matrix` reads the same fact from
        # BOARD_TIERS in the board's profile, so the two agree by construction.
        include:
          - board: attiny85
            crypto: none
    steps:
      - uses: actions/checkout@v6
      - name: toolchain image with the source baked in
        # NOT a bind mount. The runner executes this job inside a container but
        # `docker run` reaches the HOST daemon, so -v "$PWD" resolves a path
        # that means something different to each -- Docker then mounts an empty
        # directory and every target fails with "no rule to make target".
        # `docker build` streams its context from the CLIENT filesystem, so
        # baking the source into an image sidesteps the translation entirely.
        #
        # And the image is not optional. The runner's own avr-gcc is 7.3.0,
        # which predates -ffile-prefix-map and generates different code; using
        # it would silently break the reproducible-build check and move every
        # size-budget number. The toolchain has to be pinned, not borrowed.
        run: |
          # A tag nothing else can be using. Several jobs share a runner and
          # build concurrently, and buildkit refuses to export two images to one
          # tag at once -- "already exists", which reads like a caching quirk
          # and is a race between siblings. Deriving the tag from the PID and
          # the nanosecond clock cannot collide, where an expression evaluated
          # by the CI server can and did.
          tag="ag-$$-$(date +%s%N)"
          echo "IMG_BASE=$tag-base" >> "$GITHUB_ENV"
          echo "IMG=$tag" >> "$GITHUB_ENV"
          docker build -f docker/Dockerfile.ci -t "$tag-base" .
          # The commit is recorded IN the image: /src has no .git, and
          # `make provenance` refuses to write a manifest that cannot name the
          # source it came from. Same reason /etc/ci-toolchain.txt exists.
          printf 'FROM %s\nCOPY . /src\nRUN echo %s > /etc/ci-source-commit\n' \
            "$tag-base" "${{ github.sha }}" | docker build -t "$tag" -f - .
          docker run --rm "$tag" cat /etc/ci-toolchain.txt
      - name: build and enforce the size budget
        # The matrix here is for PARALLELISM, not for coverage: `make ci` runs
        # firmware-matrix, which builds every board and tier in one go. They
        # used to differ -- ci built one board while this built six -- and a
        # change that overflowed the 32U4 passed locally and went red here.
        run: docker run --rm "$IMG" make firmware BOARD=${{ matrix.board }} CRYPTO=${{ matrix.crypto }}
      - name: reproducible build
        run: docker run --rm "$IMG" make reproducible-check BOARD=${{ matrix.board }} CRYPTO=${{ matrix.crypto }}
      - name: extract the built image
        run: |
          id=$(docker create "$IMG")
          docker cp "$id:/src/build" ./build || true
          docker rm "$id" >/dev/null
      - name: upload the image
        # `ubuntu-latest` names OUR runner image on Gitea and GitHub's hosted
        # image on github.com. upload-artifact@v4 refuses a non-github.com
        # server, so it is guarded rather than left to fail the job.
        if: github.server_url == 'https://github.com'
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board }}-${{ matrix.crypto }}
          path: build/${{ matrix.board }}/${{ matrix.crypto }}/*.hex

  integration:
    name: Emulated firmware (simavr)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: toolchain image with the source baked in
        # NOT a bind mount. The runner executes this job inside a container but
        # `docker run` reaches the HOST daemon, so -v "$PWD" resolves a path
        # that means something different to each -- Docker then mounts an empty
        # directory and every target fails with "no rule to make target".
        # `docker build` streams its context from the CLIENT filesystem, so
        # baking the source into an image sidesteps the translation entirely.
        #
        # And the image is not optional. The runner's own avr-gcc is 7.3.0,
        # which predates -ffile-prefix-map and generates different code; using
        # it would silently break the reproducible-build check and move every
        # size-budget number. The toolchain has to be pinned, not borrowed.
        run: |
          # A tag nothing else can be using. Several jobs share a runner and
          # build concurrently, and buildkit refuses to export two images to one
          # tag at once -- "already exists", which reads like a caching quirk
          # and is a race between siblings. Deriving the tag from the PID and
          # the nanosecond clock cannot collide, where an expression evaluated
          # by the CI server can and did.
          tag="ag-$$-$(date +%s%N)"
          echo "IMG_BASE=$tag-base" >> "$GITHUB_ENV"
          echo "IMG=$tag" >> "$GITHUB_ENV"
          docker build -f docker/Dockerfile.ci -t "$tag-base" .
          # The commit is recorded IN the image: /src has no .git, and
          # `make provenance` refuses to write a manifest that cannot name the
          # source it came from. Same reason /etc/ci-toolchain.txt exists.
          printf 'FROM %s\nCOPY . /src\nRUN echo %s > /etc/ci-source-commit\n' \
            "$tag-base" "${{ github.sha }}" | docker build -t "$tag" -f - .
          docker run --rm "$tag" cat /etc/ci-toolchain.txt
      - name: run the real image under simavr
        # Tier 2. The unit tests prove the LOGIC is right on x86 against a mock
        # HAL; this runs the .elf that actually gets flashed, so it covers what
        # no host build can reach -- the baud divisor, the interrupt vectors,
        # the order peripherals are brought up in, and the tick ISR's real rate.
        run: docker run --rm "$IMG" make integration-test
      - name: run ag-boot under simavr
        # The same tier for the bootloader, with an ATECC608A modelled as a TWI
        # slave on the emulated bus -- so the element protocol goes through the
        # real TWI driver rather than through the ag_hal_i2c_xfer seam the host
        # model sits above. It is in `make ci` too; a gate that runs in only one
        # of the two is a gate a developer cannot reproduce, and this repository
        # has gone red over that three times.
        run: docker run --rm "$IMG" make integration-test-boot

  sdk:
    name: Go SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: toolchain image with the source baked in
        # NOT a bind mount. The runner executes this job inside a container but
        # `docker run` reaches the HOST daemon, so -v "$PWD" resolves a path
        # that means something different to each -- Docker then mounts an empty
        # directory and every target fails with "no rule to make target".
        # `docker build` streams its context from the CLIENT filesystem, so
        # baking the source into an image sidesteps the translation entirely.
        #
        # And the image is not optional. The runner's own avr-gcc is 7.3.0,
        # which predates -ffile-prefix-map and generates different code; using
        # it would silently break the reproducible-build check and move every
        # size-budget number. The toolchain has to be pinned, not borrowed.
        run: |
          # A tag nothing else can be using. Several jobs share a runner and
          # build concurrently, and buildkit refuses to export two images to one
          # tag at once -- "already exists", which reads like a caching quirk
          # and is a race between siblings. Deriving the tag from the PID and
          # the nanosecond clock cannot collide, where an expression evaluated
          # by the CI server can and did.
          tag="ag-$$-$(date +%s%N)"
          echo "IMG_BASE=$tag-base" >> "$GITHUB_ENV"
          echo "IMG=$tag" >> "$GITHUB_ENV"
          docker build -f docker/Dockerfile.ci -t "$tag-base" .
          # The commit is recorded IN the image: /src has no .git, and
          # `make provenance` refuses to write a manifest that cannot name the
          # source it came from. Same reason /etc/ci-toolchain.txt exists.
          printf 'FROM %s\nCOPY . /src\nRUN echo %s > /etc/ci-source-commit\n' \
            "$tag-base" "${{ github.sha }}" | docker build -t "$tag" -f - .
          docker run --rm "$tag" cat /etc/ci-toolchain.txt
      - name: gofmt and vet
        run: docker run --rm "$IMG" make sdk-lint
      - name: the Layer 0 invariant
        # sdk/go is imported by go-xkms at Layer 3 and go-trusted-platform at
        # Layer 5. An in-house dependency here would invert the graph and make
        # it unimportable by the projects it exists for.
        run: docker run --rm "$IMG" make sdk-verify
      - name: cross-implementation tests against the firmware
        # These talk to agsim: the real firmware compiled for the host. Not a
        # fake, which would drift from the firmware the moment either changed.
        run: docker run --rm "$IMG" make sdk-test

  gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [lint, unit, sanitizers, firmware, integration, sdk]
    if: always()
    steps:
      - name: results
        # Every job is named explicitly rather than collapsed with
        # join(needs.*.result), which is a GitHub extension and evaluates to
        # empty on Gitea -- a gate that passes vacuously is worse than no gate.
        run: |
          echo "lint        ${{ needs.lint.result }}"
          echo "unit        ${{ needs.unit.result }}"
          echo "sanitizers  ${{ needs.sanitizers.result }}"
          echo "firmware    ${{ needs.firmware.result }}"
          echo "integration ${{ needs.integration.result }}"
          echo "sdk         ${{ needs.sdk.result }}"
      - name: fail unless every job succeeded
        if: >-
          needs.lint.result != 'success' ||
          needs.unit.result != 'success' ||
          needs.sanitizers.result != 'success' ||
          needs.firmware.result != 'success' ||
          needs.integration.result != 'success' ||
          needs.sdk.result != 'success'
        run: exit 1
