  optee-stack:
    # CUSTOMIZE (trusted-firmware, #253, ruling 250 (a); modelled on the
    # esp32-build job ahead of esp32-qemu-test): the OP-TEE stack (the
    # fetched release, its toolchains and the built stack) is built and
    # cached here, ahead of the optee job, so the test job always starts
    # from a warm cache. On a hit this job only looks the key up and passes
    # in minutes; on a miss it builds the stack cold and actions/cache's post
    # step saves it. It runs under the optee job's own needs and if.
    name: OP-TEE stack [optee-tools, optee-qemu]
    needs: [changes, image, schedule-guard]   # v1.29.3
    if: ${{ !cancelled() && needs.image.outputs.built == 'true' && !github.event.pull_request.draft && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && needs.changes.outputs.optee == 'true')) && (github.event_name != 'schedule' || needs.schedule-guard.outputs.verdict == 'run') }}   # v1.26
    # CUSTOMIZE (trusted-firmware, run 71052): the stack job saved `optee-4.11.0`
    # on a runner labelled `go-warm`, and the optee job, on a `bigdisk` runner
    # without it, failed `Failed to restore cache entry`. Each runner has its
    # own cache server, so both jobs run on `go-warm`.
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'go-warm' }}
    # CUSTOMIZE: run 70765, the one job built cold: setup, image and restore
    # miss 2 min, optee-tools 5, optee-qemu 133, the copy out of the
    # container 13 and the actions/cache save over 2: 2 + 5 + 133 + 13 + 2 =
    # 155. Its tests (26 more) now run in the optee job, so the cold build
    # fits under 180, the runner's own 3-hour job limit (ruling 250 (a)).
    timeout-minutes: 180
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      CI_CACHE_CLASS: ${{ github.event_name == 'push' && 'main' || 'pr' }}
      IMAGE_CLASS: ${{ github.event_name == 'push' && 'main' || 'pr' }}
      IMAGE_TRUSTED_CLASS: ${{ github.event_name != 'push' && 'main' || '' }}
      IMAGE_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # v1.21.1: the image job's masking step, first, as in every job.
      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      # CUSTOMIZE (trusted-firmware, #253, the page's open question 6 as
      # proposed): OPTEE_CACHE, the fetched release, its toolchains and the
      # built stack, is cached by the pin in mk/optee.mk (`make -s
      # optee-pin`, the release tag), so a new pin misses and rebuilds.
      - name: The OP-TEE pin
        id: pin
        run: echo "release=$(make -s optee-pin)" >> "$GITHUB_OUTPUT"

      # lookup-only: a hit downloads nothing, since the optee job restores
      # the stack itself; a miss leaves the post step to save the build.
      - name: Look up the OP-TEE stack
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/optee-cache
          key: optee-${{ steps.pin.outputs.release }}
          lookup-only: true

      - name: Log in to the forge registry
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: scripts/ci-registry-login.sh

      - name: Reuse the optee image
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: |
          ( umask 077; : > "$RUNNER_TEMP/gomodauth.env"
            for v in GOPRIVATE GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
              if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
            done )
          # v1.29.4 and v1.29.5: Athens first when the runner sets DEVCACHE_GOPROXY
          # and the cache answers, `|` so any error falls through to the public
          # proxy; "$bp" is one quoted make argument and the Makefile quotes it.
          bp=
          if [ -n "${DEVCACHE_GOPROXY:-}" ] && curl -s -o /dev/null --max-time 5 "$DEVCACHE_GOPROXY/"; then
            bp="GO_BUILD_PROXY=$DEVCACHE_GOPROXY|https://proxy.golang.org|direct"
          fi
          make docker-image-optee ${bp:+"$bp"} MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env"
          rm -f "$RUNNER_TEMP/gomodauth.env"
          echo "OPTEE_IMAGE=$(make -s optee-image)" >> "$GITHUB_ENV"

      # On a miss only: one container builds the stack into an empty cache
      # dir, which IN_IMAGE_CACHE_SAVE copies back out (in-toolchain-image.sh)
      # for the post step to save. The network is for the fetch.
      - name: make optee-tools, optee-qemu (optee image)
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        env:
          IN_IMAGE_NETWORK: bridge
          IN_IMAGE_CACHE: ${{ runner.temp }}/optee-cache:/var/cache/tfw-optee
          IN_IMAGE_CACHE_SAVE: '1'
        run: scripts/in-toolchain-image.sh "$OPTEE_IMAGE" "make optee-tools OPTEE_CACHE=/var/cache/tfw-optee && make optee-qemu OPTEE_CACHE=/var/cache/tfw-optee"

      - name: Tear down
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/gomodauth.env"
          rm -rf "$RUNNER_TEMP/docker-config"

  optee:
    # CUSTOMIZE (trusted-firmware, #253 slice 4): the pinned OP-TEE stack on
    # QEMU virt needs the optee image alone, so it runs beside everything
    # else. It builds or reuses its own image, as the ESP32 job does, and a
    # PR that changes only docs/optee-trustzone/ still runs it. Ruling 250
    # (a): the optee-stack job ahead of it builds and caches the stack; this
    # job only restores it and never builds it cold.
    name: OP-TEE [optee-qemu, integration-test-optee]
    # CUSTOMIZE (trusted-firmware, #253; modelled on the ESP32 job, rulings
    # 218(9), 219(5)): on a PR only when the changes job saw an OP-TEE path
    # change or the PR is labelled ci:full; otherwise a push to main and the
    # nightly tier (schedule, workflow_dispatch) run it. It needs and gates
    # on the image job exactly as the ESP32 job does: a job that needed only
    # the changes job and gated on needs.changes.result == 'success' (run
    # 69905) or needs.changes.outputs.optee != '' (run 69954) was skipped
    # unstarted on a PR, while every job that ran there with a needs term in
    # its if also needed the image job and gated on its built output.
    # Ruling 250 (a): it also needs optee-stack, which saves the cache it
    # restores.
    needs: [changes, image, optee-stack, schedule-guard]   # v1.29.3
    if: ${{ !cancelled() && needs.image.outputs.built == 'true' && !github.event.pull_request.draft && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && needs.changes.outputs.optee == 'true')) && (github.event_name != 'schedule' || needs.schedule-guard.outputs.verdict == 'run') }}   # v1.26
    # CUSTOMIZE (trusted-firmware, run 71052): the stack job saved `optee-4.11.0`
    # on a runner labelled `go-warm`, and this job, on a `bigdisk` runner
    # without it, failed `Failed to restore cache entry`. Each runner has its
    # own cache server, so both jobs run on `go-warm`.
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'go-warm' }}
    # CUSTOMIZE: run 70765 on a cold cache: setup and image 2 min,
    # integration-test-optee 26. Warm, the restore and the copy into the
    # container add about what the save (over 2) and the copy out (13) took,
    # and optee-qemu rebuilds only the TA: 2 + 2 + 13 + 26 = 43 warm, so
    # about twice that, 90.
    timeout-minutes: 90
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      CI_CACHE_CLASS: ${{ github.event_name == 'push' && 'main' || 'pr' }}
      IMAGE_CLASS: ${{ github.event_name == 'push' && 'main' || 'pr' }}
      IMAGE_TRUSTED_CLASS: ${{ github.event_name != 'push' && 'main' || '' }}
      IMAGE_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # v1.21.1: the image job's masking step, first, as in every job.
      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      # CUSTOMIZE (trusted-firmware, #253, the page's open question 6 as
      # proposed): OPTEE_CACHE is cached by the pin in mk/optee.mk (`make -s
      # optee-pin`, the release tag); the optee-stack job saves it.
      - name: The OP-TEE pin
        id: pin
        run: echo "release=$(make -s optee-pin)" >> "$GITHUB_OUTPUT"

      # Ruling 250 (a): restore only, never save, and never build the stack
      # cold here. A miss means optee-stack did not save the key; the step
      # fails at once and its message names the key.
      - name: Restore the OP-TEE stack
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/optee-cache
          key: optee-${{ steps.pin.outputs.release }}
          fail-on-cache-miss: true

      - name: Log in to the forge registry
        run: scripts/ci-registry-login.sh

      - name: Reuse the optee image
        run: |
          ( umask 077; : > "$RUNNER_TEMP/gomodauth.env"
            for v in GOPRIVATE GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
              if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
            done )
          # v1.29.4 and v1.29.5: Athens first when the runner sets DEVCACHE_GOPROXY
          # and the cache answers, `|` so any error falls through to the public
          # proxy; "$bp" is one quoted make argument and the Makefile quotes it.
          bp=
          if [ -n "${DEVCACHE_GOPROXY:-}" ] && curl -s -o /dev/null --max-time 5 "$DEVCACHE_GOPROXY/"; then
            bp="GO_BUILD_PROXY=$DEVCACHE_GOPROXY|https://proxy.golang.org|direct"
          fi
          make docker-image-optee ${bp:+"$bp"} MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env"
          rm -f "$RUNNER_TEMP/gomodauth.env"
          echo "OPTEE_IMAGE=$(make -s optee-image)" >> "$GITHUB_ENV"

      # One container, so the cache is copied in once (IN_IMAGE_CACHE in
      # in-toolchain-image.sh) and never back out. optee-qemu runs every time:
      # integration-test-optee builds only when the cache holds no build, and
      # a restored build holds the TA of the commit that saved it, not this
      # one's. The network is kept for any fetch optee-qemu's prerequisites
      # make.
      - name: make optee-qemu, integration-test-optee (optee image)
        env:
          IN_IMAGE_NETWORK: bridge
          IN_IMAGE_CACHE: ${{ runner.temp }}/optee-cache:/var/cache/tfw-optee
          IN_IMAGE_CACHE_SAVE: '0'
        run: scripts/in-toolchain-image.sh "$OPTEE_IMAGE" "make optee-qemu OPTEE_CACHE=/var/cache/tfw-optee && make integration-test-optee OPTEE_CACHE=/var/cache/tfw-optee"

      - name: Tear down
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/gomodauth.env"
          rm -rf "$RUNNER_TEMP/docker-config"

  # v1.27 (Company Agent m1192 (6), item 27; ruling 211): a repository's
  # `make lint-gates` (its own gates beside `make lint`) runs in this job, in
  # parallel with the image job's `make lint`. It runs only when the Makefile
  # or a tracked *.mk defines a lint-gates target; this repository defines
  # none (its `make lint` is the C firmware's lint, and `security` lists it),
  # so the job prints OK, builds no image and passes.
  # CUSTOMIZE (trusted-firmware): the toolchain image comes from
  # `make docker-image-toolchain`, which reuses it by hash, as the image job's
  # docs-only path does; this job never needs the integration image.
  lint-gates:
    name: Lint Gates [toolchain image]
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'bigdisk' }}
    needs: schedule-guard     # v1.29.3
    # v1.26: never on a draft. v1.29.3: on a schedule run, only on the
    # schedule guard's `run`.
    if: ${{ !github.event.pull_request.draft && (github.event_name != 'schedule' || needs.schedule-guard.outputs.verdict == 'run') }}
    timeout-minutes: 45
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      # v1.22: the cache volumes' trust class (as in the image job).
      CI_CACHE_CLASS: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'main' || 'pr' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # v1.21.1: mask the forge credentials before any other step (as above).
      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      # A source check on the runner's shell: no make recipe runs here.
      - name: Does the Makefile define lint-gates?
        id: probe
        run: |
          mapfile -t mk < <(git ls-files -- Makefile '*.mk')
          if [ "${#mk[@]}" -gt 0 ] && grep -qE '^lint-gates[[:space:]]*:([^=]|$)' "${mk[@]}"; then
            echo "lint-gates target found"
            echo "has_target=true" >> "$GITHUB_OUTPUT"
          else
            echo "OK: no lint-gates target in the Makefile; nothing to run"
            echo "has_target=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reap stale CI stacks
        if: ${{ steps.probe.outputs.has_target == 'true' }}
        run: scripts/reap-stale-ci-stacks.sh "$CI_STACK_PREFIX"

      - name: Build the toolchain image
        if: ${{ steps.probe.outputs.has_target == 'true' }}
        run: |
          ( umask 077; : > "$RUNNER_TEMP/gomodauth.env"
            for v in GOPRIVATE GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
              if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
            done )
          # v1.29.4 and v1.29.5: Athens first when the runner sets DEVCACHE_GOPROXY
          # and the cache answers, `|` so any error falls through to the public
          # proxy; "$bp" is one quoted make argument and the Makefile quotes it.
          bp=
          if [ -n "${DEVCACHE_GOPROXY:-}" ] && curl -s -o /dev/null --max-time 5 "$DEVCACHE_GOPROXY/"; then
            bp="GO_BUILD_PROXY=$DEVCACHE_GOPROXY|https://proxy.golang.org|direct"
          fi
          make docker-image-toolchain ${bp:+"$bp"} MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env"
          rm -f "$RUNNER_TEMP/gomodauth.env"
          echo "TOOLCHAIN_IMAGE=$(make -s toolchain-image)" >> "$GITHUB_ENV"

      # v1.22: bound this repo's cache volumes (as in the image job).
      - name: Trim the CI caches
        if: ${{ !cancelled() && steps.probe.outputs.has_target == 'true' && env.TOOLCHAIN_IMAGE != '' }}
        run: scripts/trim-ci-caches.sh "$CI_STACK_PREFIX" "$TOOLCHAIN_IMAGE"

      # v1.29.1: no -k; the first failing gate ends the step.
      - name: make lint-gates
        if: ${{ !cancelled() && steps.probe.outputs.has_target == 'true' && env.TOOLCHAIN_IMAGE != '' }}
        env:
          IN_IMAGE_NETWORK: none   # CUSTOMIZE: bridge when a gate needs the module proxy or a network
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make lint-gates GO_BUILD_TAGS='$GO_BUILD_TAGS'"

      - name: Tear down
        if: always()
        run: rm -f "$RUNNER_TEMP/gomodauth.env"

  # Integration tests run in the integration image (ci-standard.md §2), as a
  # compose stack on the runner host started by `make integration-test`. The
  # stack is named per run under the repo's prefix, the job reaps stale stacks
  # first (v1.18) and keeps its own teardown last under `if: always()`.
  # v1.23: full tier only (CI_FULL_TIER's expression); never on a plain PR.
  integration:
    name: Integration [integration image]
    # v1.26: never on a draft PR, ci:full or not. v1.29.3: on a schedule run,
    # only on the schedule guard's `run`.
    needs: schedule-guard
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')) && !github.event.pull_request.draft && (github.event_name != 'schedule' || needs.schedule-guard.outputs.verdict == 'run') }}
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'bigdisk' }}
    # CUSTOMIZE: trusted-firmware: full tier (#293; handbook sdlc.md §5a). The suite is
    # `make integration-test-host`: the real AVR images under simavr, and
    # tfwsim against the Go SDK, the example application and the xkms adapter.
    timeout-minutes: 60       # CUSTOMIZE
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      IT_PROJECT: ${{ github.event.repository.name }}-ci-${{ github.run_id }}-${{ github.run_attempt }}
      # CUSTOMIZE (trusted-firmware, Company Agent m644): the image job's trust
      # classes. This job computes the same hash-tagged toolchain image name
      # from the same commit (mk/docker.mk) and builds the integration image
      # with it as the cache; it never builds the toolchain image itself.
      IMAGE_CLASS: ${{ github.event_name == 'push' && 'main' || 'pr' }}
      IMAGE_TRUSTED_CLASS: ${{ github.event_name != 'push' && 'main' || '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # v1.21.1 (Company Agent m605 item 8): mask the forge credentials before
      # any other step. The runner injects them as plain environment
      # (dependency-resolution.md §6), which the log does not mask by itself,
      # and the token sits inside GIT_CONFIG_KEY_0's URL, so it is masked alone
      # as well.
      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: Reap stale CI stacks
        run: scripts/reap-stale-ci-stacks.sh "$CI_STACK_PREFIX"

      # v1.23: the content-addressed integration image (as in the image job).
      - name: Name the integration image
        run: echo "IT_IMAGE=$(make -s it-image)" >> "$GITHUB_ENV"

      # v1.23: a lease on the integration image (from a Codex review). A
      # reused image can be older than REAP_IMAGE_MIN_AGE, so its age alone
      # does not keep another run's reap step off it while this job needs it.
      # A created, never-started container that names the image holds it,
      # because `docker image rm` refuses an image a container uses. Tear down
      # removes the lease; one a dead job leaves behind is a stale container,
      # which the reap step removes after the job timeout like any other.
      - name: Lease the integration image
        run: |
          lease="${CI_STACK_PREFIX}lease-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$(od -An -N4 -tx1 /dev/urandom | tr -d ' \n')"
          # v1.25.3: the daemon's image lock, shared with the reaper (v5) and
          # every re-tag. The next steps source these from image-lock.sh.
          image_lock() {
            local lock="${CI_STACK_PREFIX}image-lock" held at t i
            for ((i = 0; i < 660; i++)); do
              docker image inspect "$lock:base" >/dev/null 2>&1 ||
                head -c 1024 /dev/zero | docker import - "$lock:base" >/dev/null 2>&1 || true
              IMAGE_LOCK_ID=$(docker create --pull never --name "$lock" "$lock:base" true 2>/dev/null) && return 0
              IMAGE_LOCK_ID=
              if read -r held at < <(docker inspect -f '{{.Id}} {{.Created}}' "$lock" 2>/dev/null) &&
                t=$(date -d "$at" +%s 2>/dev/null) && [ $(($(date +%s) - t)) -ge 600 ]; then
                echo "removing the stale image lock $lock (created $at)"
                docker rm "$held" >/dev/null 2>&1 || true
                continue
              fi
              sleep 1
            done
            echo "::error::the image lock $lock was not free within 660 s"
            return 1
          }
          image_unlock() {
            [ -z "${IMAGE_LOCK_ID:-}" ] || docker rm "$IMAGE_LOCK_ID" >/dev/null 2>&1 || true
            IMAGE_LOCK_ID=
          }
          declare -f image_lock image_unlock > "$RUNNER_TEMP/image-lock.sh"
          trap image_unlock EXIT
          # v1.25.2: the lease holds the image id; IT_LEASE_ID carries it to the
          # re-tags. This file has no v1.25.1 rebuild, so a missing image still
          # takes no lease (and the re-tags then do nothing).
          image_lock || exit 1
          if id=$(docker image inspect -f '{{.Id}}' "$IT_IMAGE" 2>/dev/null) &&
            docker create --pull never --name "$lease" "$id" true >/dev/null; then
            echo "IT_LEASE=$lease" >> "$GITHUB_ENV"
            echo "IT_LEASE_ID=$id" >> "$GITHUB_ENV"
          fi
          image_unlock

      # CUSTOMIZE: host tuning the suite needs goes here, as in the test job.

      # CUSTOMIZE (trusted-firmware, Company Agent m644): the registry the
      # integration image's build reads the toolchain image's cache from.
      - name: Log in to the forge registry
        run: scripts/ci-registry-login.sh

      - name: Write the module credential file
        run: |
          umask 077
          : > "$RUNNER_TEMP/gomodauth.env"
          for v in GOPRIVATE GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
          done

      - name: make integration-test (integration image)
        run: |
          if [ -n "${IT_LEASE_ID:-}" ]; then
            . "$RUNNER_TEMP/image-lock.sh"
            trap image_unlock EXIT
            image_lock || exit 1
            docker tag "$IT_LEASE_ID" "$IT_IMAGE"
            image_unlock
          fi
          make integration-test MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env" IT_PROJECT="$IT_PROJECT" IT_IMAGE="$IT_IMAGE" GO_BUILD_TAGS="$GO_BUILD_TAGS"

      - name: Tear down
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/gomodauth.env"
          rm -rf "$RUNNER_TEMP/docker-config" # CUSTOMIZE (trusted-firmware, m644): the registry login
          # CUSTOMIZE: compose.yaml reads the image as TRUSTED_FIRMWARE_IT_IMAGE.
          TRUSTED_FIRMWARE_IT_IMAGE="$IT_IMAGE" docker compose -f build/docker/devcontainer/compose.yaml -p "$IT_PROJECT" down --volumes || true
          [ -z "${IT_LEASE:-}" ] || docker rm "$IT_LEASE" >/dev/null || true

  # Soak (v1.23, owner item 101): the integration suite looped in the
  # integration image until SOAK_MINUTES have passed, each iteration its own
  # compose stack, torn down before the next; the first red iteration fails
  # the job. v1.24 (owner ruling 2026-10-19, Company Agent m751 (e)): nightly
  # and workflow_dispatch only, off main pushes and off ci:full; the Gate marks
  # it `nightly`. It replaces nothing in batch.yml, whose soak stays a dispatch.
  soak:
    name: Soak [integration image]
    # v1.29.3: on a schedule run, only on the schedule guard's `run`.
    needs: schedule-guard
    if: ${{ ((github.event_name == 'schedule' && needs.schedule-guard.outputs.verdict == 'run') || github.event_name == 'workflow_dispatch') && !github.event.pull_request.draft }}   # v1.26
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'bigdisk' }}
    timeout-minutes: 90       # CUSTOMIZE: SOAK_MINUTES plus one iteration
    env:
      SOAK_MINUTES: 30        # CUSTOMIZE
      SOAK_TARGET: integration-test   # CUSTOMIZE: a make target of the integration image
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      IT_PROJECT: ${{ github.event.repository.name }}-ci-${{ github.run_id }}-${{ github.run_attempt }}-soak
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # v1.21.1: mask the forge credentials before any other step (as above).
      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: Reap stale CI stacks
        run: scripts/reap-stale-ci-stacks.sh "$CI_STACK_PREFIX"

      # v1.23: the content-addressed integration image (as in the image job).
      - name: Name the integration image
        run: echo "IT_IMAGE=$(make -s it-image)" >> "$GITHUB_ENV"

      # v1.23: a lease on the integration image (from a Codex review). A
      # reused image can be older than REAP_IMAGE_MIN_AGE, so its age alone
      # does not keep another run's reap step off it while this job needs it.
      # A created, never-started container that names the image holds it,
      # because `docker image rm` refuses an image a container uses. Tear down
      # removes the lease; one a dead job leaves behind is a stale container,
      # which the reap step removes after the job timeout like any other.
      - name: Lease the integration image
        run: |
          lease="${CI_STACK_PREFIX}lease-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$(od -An -N4 -tx1 /dev/urandom | tr -d ' \n')"
          # v1.25.3: the daemon's image lock, shared with the reaper (v5) and
          # every re-tag. The next steps source these from image-lock.sh.
          image_lock() {
            local lock="${CI_STACK_PREFIX}image-lock" held at t i
            for ((i = 0; i < 660; i++)); do
              docker image inspect "$lock:base" >/dev/null 2>&1 ||
                head -c 1024 /dev/zero | docker import - "$lock:base" >/dev/null 2>&1 || true
              IMAGE_LOCK_ID=$(docker create --pull never --name "$lock" "$lock:base" true 2>/dev/null) && return 0
              IMAGE_LOCK_ID=
              if read -r held at < <(docker inspect -f '{{.Id}} {{.Created}}' "$lock" 2>/dev/null) &&
                t=$(date -d "$at" +%s 2>/dev/null) && [ $(($(date +%s) - t)) -ge 600 ]; then
                echo "removing the stale image lock $lock (created $at)"
                docker rm "$held" >/dev/null 2>&1 || true
                continue
              fi
              sleep 1
            done
            echo "::error::the image lock $lock was not free within 660 s"
            return 1
          }
          image_unlock() {
            [ -z "${IMAGE_LOCK_ID:-}" ] || docker rm "$IMAGE_LOCK_ID" >/dev/null 2>&1 || true
            IMAGE_LOCK_ID=
          }
          declare -f image_lock image_unlock > "$RUNNER_TEMP/image-lock.sh"
          trap image_unlock EXIT
          # v1.25.2: the lease holds the image id; IT_LEASE_ID carries it to the
          # re-tags. This file has no v1.25.1 rebuild, so a missing image still
          # takes no lease (and the re-tags then do nothing).
          image_lock || exit 1
          if id=$(docker image inspect -f '{{.Id}}' "$IT_IMAGE" 2>/dev/null) &&
            docker create --pull never --name "$lease" "$id" true >/dev/null; then
            echo "IT_LEASE=$lease" >> "$GITHUB_ENV"
            echo "IT_LEASE_ID=$id" >> "$GITHUB_ENV"
          fi
          image_unlock

      # CUSTOMIZE: host tuning the suite needs goes here, as in the test job.

      - name: Write the module credential file
        run: |
          umask 077
          : > "$RUNNER_TEMP/gomodauth.env"
          for v in GOPRIVATE GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
          done

      - name: Soak (integration suite, looped)
        run: |
          if [ -n "${IT_LEASE_ID:-}" ]; then
            . "$RUNNER_TEMP/image-lock.sh"
            trap image_unlock EXIT
          fi
          deadline=$(( $(date +%s) + SOAK_MINUTES * 60 ))
          i=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            i=$((i + 1))
            p="$IT_PROJECT-$i"
            echo "$p" > "$RUNNER_TEMP/soak-project"
            echo "soak iteration $i"
            if [ -n "${IT_LEASE_ID:-}" ]; then
              image_lock || exit 1
              docker tag "$IT_LEASE_ID" "$IT_IMAGE"
              image_unlock
            fi
            rc=0
            make "$SOAK_TARGET" MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env" IT_PROJECT="$p" IT_IMAGE="$IT_IMAGE" GO_BUILD_TAGS="$GO_BUILD_TAGS" || rc=$?
            IT_IMAGE="$IT_IMAGE" docker compose -f build/docker/devcontainer/compose.yaml -p "$p" down --volumes || true
            if [ "$rc" -ne 0 ]; then
              echo "::error::soak iteration $i failed (exit $rc)"
              exit "$rc"
            fi
          done
          echo "soak: $i iterations in $SOAK_MINUTES min, all green"

      - name: Tear down
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/gomodauth.env"
          if [ -s "$RUNNER_TEMP/soak-project" ]; then
            IT_IMAGE="$IT_IMAGE" docker compose -f build/docker/devcontainer/compose.yaml -p "$(cat "$RUNNER_TEMP/soak-project")" down --volumes || true
          fi
          rm -f "$RUNNER_TEMP/soak-project"
          [ -z "${IT_LEASE:-}" ] || docker rm "$IT_LEASE" >/dev/null || true

  # CUSTOMIZE: further stages run in the image job as steps of the same
  # shape (one `make` target in the toolchain image, `if: !cancelled()`). A
  # suite that needs its own runner or stack (tagged suites, cross-arch,
  # contrib modules) is a job of the integration job's shape and joins CI
  # Gate's needs list and check lines. v1.23: such a suite is full tier (the
  # integration job's `if:`, `full` in CI Gate) unless it is lint, build,
  # unit or race, which stay on the PR tier.

  # Architecture gate (v1.20, Company Agent m270 item 9; go-xkms arch-gates).
  # go-objstore owns every blob backend (docs/00), and a repo reaches it only
  # through the packages that are its storage seam. Test files are exempt, and
  # go-objstore itself passes. CUSTOMIZE: OBJSTORE_SEAMS, an extended regex of
  # the paths that may import go-objstore (go-xkms: 'pkg/ca/|pkg/storage/');
  # empty means none may. CUSTOMIZE: the repo's own layering rules (go-xkms:
  # xkmsctl and xkey depend only on sdk/go) are further steps in this job.
  # A source check with grep, not a stage: it runs on the runner's shell.
  # v1.23: a lint-class check, so it stays on the PR tier.
  arch-gates:
    name: Architecture Gates
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}   # v1.26
    env:
      OBJSTORE_SEAMS: ''      # CUSTOMIZE
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: No direct go-objstore import outside the storage seam
        run: |
          if [ "$(sed -n 's/^module //p' go.mod)" = github.com/jeremyhahn/go-objstore ]; then
            echo "OK: this is go-objstore"; exit 0
          fi
          hits=$(grep -rln --include='*.go' '"github.com/jeremyhahn/go-objstore' . \
                 | grep -v '_test\.go$' \
                 | { if [ -n "$OBJSTORE_SEAMS" ]; then grep -vE "$OBJSTORE_SEAMS"; else cat; fi; } || true)
          if [ -n "$hits" ]; then
            echo "go-objstore may be imported only in the storage seam (OBJSTORE_SEAMS='$OBJSTORE_SEAMS'):"
            echo "$hits"; exit 1
          fi
          echo "OK: no go-objstore import outside the storage seam"

  # The single required check (devops.md §1). Every job above must appear in
  # BOTH the needs list and the results check — a gate that can pass vacuously
  # is worse than no gate. Do not use join(needs.*.result); it evaluates empty
  # on Gitea and reports success while jobs fail.
  # v1.21: on the ci-gate runners (Company Agent m386: only CI Gate runs there;
  # a 1-CPU gate runner cannot hold a stage). trivy and fips are in nightly.yml
  # (v1.9, devops.md §8a: the alpha regime).
  ci-gate:
    name: CI Gate
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'ci-gate' }}
    # v1.29.3: on a schedule run the schedule guard decides. `busy` skips the
    # gate, so `CI / CI Gate (schedule)` posts `skipped` (Gitea 1.27.1 posts a
    # skipped job as `skipped`, not `success`), never a green nightly. Every
    # other verdict, an empty one included, runs it.
    if: ${{ always() && (github.event_name != 'schedule' || needs.schedule-guard.outputs.verdict != 'busy') }}
    # CUSTOMIZE: the repo's job list. Add every CUSTOMIZE job here AND as a
    # check line below; remove none of the template's jobs.
    needs: [changes, schedule-guard, image, lint-gates, unit-shard-1, unit-shard-2, unit-shard-3, sdk-race, security, esp32-build, esp32-qemu-test, optee-stack, optee, integration, soak, arch-gates]
    steps:
      - name: Fail closed on any non-success
        env:
          # The full tier is CI_FULL_TIER (v1.23): every event but a PR, and a
          # PR labelled ci:full. A job marked `full` may be skipped below only
          # when it is not selected; a `pr` job may never be skipped.
          FULL_TIER: ${{ env.CI_FULL_TIER }}
          # v1.24: a `nightly` job runs on schedule and workflow_dispatch only.
          NIGHTLY: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          # v1.26: a draft PR runs no CI, so its gate fails rather than pass on skips.
          DRAFT: ${{ github.event.pull_request.draft == true }}
          # v1.29.3: the schedule guard's verdict on a schedule run.
          SCHEDULE: ${{ github.event_name == 'schedule' }}
          SCHEDULE_GUARD: ${{ needs.schedule-guard.outputs.verdict }}
          # CUSTOMIZE (trusted-firmware): a `docs` job builds or tests code, so
          # a docs-only PR (v1.24, the `changes` job) may skip it; any other
          # event or PR may not. A failed `changes` job reads as not docs-only.
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }} # CUSTOMIZE
          # CUSTOMIZE (trusted-firmware, ruling 218(9), 219(5)): the
          # `esp32-build` job may skip only on a PR that changed no ESP32 path
          # (the `changes` job's esp32 output). Ruling 220(j): the
          # `esp32-qemu-test` job may skip only on a PR, any PR. On a push,
          # schedule or workflow_dispatch both must run, and a skipped or
          # failed one fails the gate.
          ESP32_CHANGED: ${{ needs.changes.outputs.esp32 }} # CUSTOMIZE
          ESP32_PR: ${{ github.event_name == 'pull_request' }} # CUSTOMIZE: ruling 219(5)
          # CUSTOMIZE (trusted-firmware, #253, as for esp32): an `optee` job
          # (optee-stack and optee, under one if since ruling 250 (a)) may skip only on a PR that changed no OP-TEE path and is not
          # labelled ci:full (the `changes` job's optee output). On a push,
          # schedule or workflow_dispatch it must run, and a skipped or
          # failed one fails the gate.
          OPTEE_CHANGED: ${{ needs.changes.outputs.optee }} # CUSTOMIZE
        run: |
          if [ "${DRAFT}" = true ]; then
            echo "FAIL draft pull request: no CI runs on a draft. Mark it ready, then push an empty commit to start its run."
            exit 1
          fi
          BAD=0
          echo "full tier selected: ${FULL_TIER}; nightly selected: ${NIGHTLY}"
          check() { # <job> <result> <pr|full|nightly>
            case "$2" in
              success) echo "OK   $1";;
              skipped)
                if [ "$3" = full ] && [ "${FULL_TIER}" != true ]; then
                  echo "SKIP $1 (full tier not selected)"
                elif [ "$3" = nightly ] && [ "${NIGHTLY}" != true ]; then
                  echo "SKIP $1 (nightly and dispatch only)"
                elif [ "$3" = docs ] && [ "${DOCS_ONLY}" = true ]; then # CUSTOMIZE
                  echo "SKIP $1 (docs-only PR)" # CUSTOMIZE
                elif [ "$3" = esp32 ] && [ "${ESP32_PR}" = true ] && [ "${ESP32_CHANGED}" != true ]; then # CUSTOMIZE: ruling 218(9), 219(5)
                  echo "SKIP $1 (PR changed no ESP32 path; push and nightly run it)" # CUSTOMIZE
                elif [ "$3" = esp32-qemu ] && [ "${ESP32_PR}" = true ]; then # CUSTOMIZE: ruling 220(j)
                  echo "SKIP $1 (off the PR tier; push and nightly run it)" # CUSTOMIZE
                elif [ "$3" = optee ] && [ "${ESP32_PR}" = true ] && [ "${OPTEE_CHANGED}" != true ]; then # CUSTOMIZE: #253
                  echo "SKIP $1 (PR changed no OP-TEE path; push, nightly and ci:full run it)" # CUSTOMIZE
                else
                  echo "FAIL $1 (skipped)"; BAD=1
                fi;;
              *) echo "FAIL $1 ($2)"; BAD=1;;
            esac
          }
          # v1.29.3: a schedule run reaches this step on any verdict but
          # `busy`. Any verdict but `run` means its bigdisk jobs skipped
          # because the guard had no count: fail closed.
          if [ "${SCHEDULE}" = true ] && [ "${SCHEDULE_GUARD}" != run ]; then
            echo "FAIL schedule-guard (verdict '${SCHEDULE_GUARD:-none}': the bigdisk jobs skipped because the guard could not read the API; see its log)"; BAD=1
          fi
          # CUSTOMIZE: one line per job in needs above. A job gated to the
          # full tier by its `if:` is marked full, one gated to schedule and
          # workflow_dispatch is nightly; every other job is pr. A leg that
          # builds or tests code is docs: a docs-only PR runs lint and the arch
          # gates alone (v1.24), and any other PR fails if the leg skips.
          check changes     "${{ needs.changes.result }}" pr
          check schedule-guard "${{ needs.schedule-guard.result }}" pr
          check image       "${{ needs.image.result }}" pr
          check lint-gates  "${{ needs.lint-gates.result }}" pr
          check unit-shard-1 "${{ needs.unit-shard-1.result }}" docs
          check unit-shard-2 "${{ needs.unit-shard-2.result }}" docs
          check unit-shard-3 "${{ needs.unit-shard-3.result }}" docs
          check sdk-race    "${{ needs.sdk-race.result }}" docs
          check security    "${{ needs.security.result }}" docs
          check esp32-build "${{ needs.esp32-build.result }}" esp32 # CUSTOMIZE: ruling 218(9), 220(j)
          check esp32-qemu-test "${{ needs.esp32-qemu-test.result }}" esp32-qemu # CUSTOMIZE: ruling 220(j)
          check optee-stack "${{ needs.optee-stack.result }}" optee # CUSTOMIZE: #253, ruling 250 (a)
          check optee       "${{ needs.optee.result }}" optee # CUSTOMIZE: #253
          check integration "${{ needs.integration.result }}" full
          check soak        "${{ needs.soak.result }}" nightly
          check arch-gates  "${{ needs.arch-gates.result }}" pr
          exit $BAD
