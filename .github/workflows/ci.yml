# (i), on go-qrdb main since m772), not the ref alone, so a workflow_dispatch
# or schedule run on main never cancels a push run. This reverses v1.22.1 and
# v1.23 (m636, m695): an older main commit no longer keeps its own run, and
# the newest run validates every merge under it. cancel-in-progress stays a
# literal `true`. A PR ref is one group, as before. Only the group changes.
# v1.24.1 (2026-10-20): the changelog and comments cite no internal
# repository and no internal issue number, so a repository that publishes its
# workflows passes its releasability scan. One job change: the `changes`
# job's diff takes --no-renames, so a file moved from code into docs/ lists
# its old path too and the PR is not docs-only.
# v1.24 (owner ruling 2026-10-19, Tenant Agent m749 and m751 (a), (e)):
# a PR whose every changed file is markdown or under docs/ (DOCS_ONLY_PATTERN,
# the new `changes` job) runs lint alone: build, the build-tag assertion and
# make coverage skip. Soak moves off main pushes and ci:full to the nightly
# schedule and workflow_dispatch, a `nightly` job in the Gate (ci-standard.md
# §8, §10).
# v1.23.1 (2026-10-19): ships reap-stale-ci-stacks.sh v3, which
# ages an integration image from the later of its creation and its last tag,
# so a parallel job's reaper no longer removes an image just rebuilt from
# cache (go-quicraft main runs 57389 and 57484). No job changes.
# v1.23 (owner item 101 as approved, Tenant Agent m650 item 3, 2026-10-18):
# two tiers. A pull request runs the PR tier only: lint (with
# assert-build-tags and arch-gates), build, and the unit suite under -race
# (`make coverage`, so unit test and race are one step). Integration, Soak,
# security, deps-check and trivy image do not run on a PR (v1.28 puts
# deps-check on the PR tier). The full tier runs
# on main after every merge (push), nightly (a new `schedule:` trigger), on
# workflow_dispatch, and on a PR labelled ci:full (kept as the opt-in). A new
# `soak` job loops the integration suite in the integration image for
# SOAK_MINUTES. CI Gate stays the one required check; integration and soak are
# `full` in it. A red full tier on main is reverted through a PR by the new
# revert-red-main.yml (ships beside this file; ci-standard.md §8). A repo's
# CUSTOMIZE race job joins the PR tier (`pr` in CI Gate, no tier `if:`); its
# other CUSTOMIZE suites take CI_FULL_TIER's expression and are `full`.
# v1.23 also (Company Agent m674 item 3, 2026-10-18: per-run image tags filled
# a CI runner host at 100G per 17 minutes): one image tag per family, keyed by
# content. The integration image is <repo>-ci-it:<hash> (`make -s it-image`,
# the go-qrdb #814 pattern), built once per runner and reused by every job and
# run with that tree; no job removes it, and reap-stale-ci-stacks.sh v2
# removes one older than REAP_IMAGE_MIN_AGE that no container uses
# (ci-standard.md §9).
# v1.23 also (Tenant Agent m695, 2026-10-18): the concurrency block keeps
# cancel-in-progress a literal `true` and gives main one group per event and
# commit, so main runs never cancel or queue behind each other; v1.22.1's
# expression left go-qrdb main run 57063 waiting with no task. (v1.25 replaced
# this group with `main-{event}`; v1.26.2, ruling 145, keys main per sha again.)
# v1.22.2 (Tenant Agent m641 item 2 and m646 item 3, 2026-10-18): each stage
# runs at the job slot's CPU bound. in-toolchain-image.sh v3 reads the job
# container's cgroup cpu.max and gives the stage container that --cpus, with
# GOMAXPROCS and GOFLAGS=-p from it; golangci-lint follows the quota. No
# number is hardcoded: a 4-CPU Dell slot gives 4. No job changes.
# v1.22.1 (Tenant Agent m636 item 2, 2026-10-18, after go-quicbaas main
# fe167500f was left with no completed run): the concurrency block is
# canonical. A newer push to a PR ref still cancels that ref's older run, but
# a push to main never cancels an in-flight main run: each main commit keeps
# its run, so every merge is validated. Every repository carried the block as
# a CUSTOMIZE copy with `cancel-in-progress: true` on every ref, main included
# (devops.md §9); the copy goes and the canonical block replaces it. Adopted
# with the v1.22 rollout.
# v1.22 (Tenant Agent m616 item 2, 2026-10-18, after CI job layers filled the
# runner disks): the image job's stages keep the Go build, golangci-lint and
# module caches in named volumes on the runner's Docker host, kept across jobs
# and split by trust class (CI_CACHE_CLASS: `main` for a push to main, `pr`
# otherwise), never in a job container's writable layer or its /tmp
# (ci-standard.md §6; in-toolchain-image.sh v2). A new step,
# trim-ci-caches.sh, bounds the repo's cache volumes on the host
# (CI_CACHE_MAX_GIB, default 32).
# v1.21.1 (Tenant Agent m605 item 8, 2026-10-18, after a forge token printed
# in a go-xkms run): the image and integration jobs mask the forge
# credentials first, and no step or make target prints an env file, the job
# environment or a matched line; lint steps and `make check-public-literals`
# report path and line only, and `make stage-gomodauth` runs silent
# (ci-standard.md §5). Every v1.21 rollout PR adopts v1.21.1 before it merges.
# v1.21 (Tenant Agent m598 items 1 and 2, 2026-10-18): every stage runs in
# the project's own devcontainer image (ci-standard.md §2, devcontainer.md §7).
# Through v1.20 lint, security, build and test installed Go with setup-go on
# the runner and ran their own flag sets, which §2 ("not the runner image, ...
# not a tool installed on the runner") and devops.md §4 and §8 rule out; a repo
# that also ran the stages in its image (go-quicraft a141c3c) ran each twice.
# Now one image job (m601 (a), go-quicraft's shape) builds the images once
# (`make docker-build`) and runs each stage's make target in the toolchain
# image as a step, through scripts/in-toolchain-image.sh (from go-quicraft,
# ships beside this file): lint, build, test (`make coverage` with
# COVERAGE_THRESHOLD, m601 (c)), security, deps-check (new, ci-standard.md
# §1) and trivy image on the integration image (it leaves the CUSTOMIZE note).
# The integration stage stays its own job, `make integration-test` in the
# integration image. Both run on ubuntu-latest (DS-7400).
# setup-go, the runner tool installs and the SARIF upload (m601 (d): CI runs
# on Gitea) are gone, and with them GO_VERSION: the image pins Go. The tag
# assertion moves to scripts/assert-build-tags.sh (ships beside this file).
# CI Gate runs on ci-gate (m386) with go-quicraft's pr/full tier, and its
# needs list and check lines are a CUSTOMIZE block (m598 item 2). The make
# variables the jobs pass are in devcontainer.md §6 (m601 (b)).
#
# v1.20 (Tenant Agent m270 items 1 and 9, 2026-10-16): the CUSTOMIZE image
# job's `trivy image` also takes `--skip-dirs /opt/go/mod`, so a secret match
# in a third-party module's source inside the image's Go module cache no
# longer fails the scan; a secret in the repo's own layers still does, and no
# repo carries its own trivy secret config. A new `arch-gates` job (from
# go-xkms) fails a direct go-objstore import outside the repo's storage seam,
# and CI Gate needs it.
# v1.19 (Tenant Agent m262 items 3 and 4, 2026-10-16): the CUSTOMIZE image
# job takes `trivy image --ignore-unfixed` (devops.md §8): a fixed CVE still
# blocks, an advisory with no fixed package does not, and no repo adds a
# .trivyignore for it. The github.com gosec install builds the latest gosec
# tag against the latest x/tools in the one form of devcontainer.md §2.
#
# v1.18 (2026-10-12): a CUSTOMIZE integration job that starts
# containers on the runner host runs scripts/reap-stale-ci-stacks.sh first
# (ships beside this file). Its `if: always()` teardown dies with the job when
# the host or the Docker daemon goes down, and nothing removed the stack after:
# 11 exited stacks, with their networks and volumes, stayed on the two CI
# runner hosts after the 2026-10-11/12 restarts. See the CUSTOMIZE note above
# ci-gate.
#
# v1.17: third-party actions pinned by commit, the tag in a
# trailing comment (devops.md §9 "Actions are pinned by commit").
#
# v1.16: gosec, govulncheck and actionlint
# install only on github.com; Gitea jobs use the runner image's baked, pinned
# tools.
#
# v1.15 (2026-10-05): push runs on main
# only again. automerge.yml v7 opens each merge train as a PR from
# merge-train/* into main, so the train gets its CI from the pull_request
# trigger like any PR, and block_on_outdated_branch stays on (owner,
# 2026-10-04: "leave the block_on_outdated_branch turned on, we want to make
# sure we are requiring the latest from main in all branches before they get
# merged in"). The parallel stages of v1.14 stay.
#
# v1.14 (2026-10-04): every job starts
# at once, so a run takes as long as its slowest job. security, test and any
# CUSTOMIZE integration job no longer wait on lint + build; CI Gate, the one
# required check, still needs every job and fails closed on any result but
# success. (v1.14 also ran push on 'merge-train/**' for automerge.yml v6's
# trains; v1.15 drops that.) Owner, 2026-10-04: "yes
# lets batch the merges. make sure we are doing things efficiently!" and "use
# merge trains where possible if that helps!". Supersedes v1.9's staged
# ordering: a broken push now spends the heavy tier too, in exchange for the
# shortest wall-clock to a green gate, which is what a train waits on.
#
# v1.13 (2026-09-27): GO_VERSION 1.26.7 -> 1.27.1, in
# lockstep with nightly-template v1.6.
#
# v1.12 (2026-08-28, go-blockstore #22 round 2): refresh install-shellcheck.sh to
# the hardened version — the idempotency fast path that trusted an existing
# binary on its `--version` string alone is removed, so the extracted binary's
# SHA-256 is verified every run (an attacker who pre-seeds a matching --version
# no longer bypasses the checksum). The v1.11 copy shipped the pre-round-2
# script carrying that hole; this replaces it byte-for-byte with merged main.
#
# v1.11 (2026-08-28, go-blockstore #22): the lint job installs a PINNED,
# checksum-verified shellcheck (install-shellcheck.sh, ships beside this file)
# so actionlint's SC* rules actually run — without shellcheck on PATH actionlint
# silently disables them and exits 0, and a real SC2046 reached main that way.
# SHIPS-WITH gains install-shellcheck.sh (chmod +x, copy to scripts/).
#
# v1.10 (2026-08-27, go-blockstore #7 Codex review):
#   - actionlint runs in the lint job. devops.md §4 lists actionlint in
#     `make lint`, but through v1.9 the canonical CI never ran it — so the
#     workflow files were the one thing in every repo no CI check read, and a
#     misspelled runner label or invalid Actions YAML reached main having
#     passed a green required gate. Ships with .github/actionlint.yaml (same
#     template directory), which is what keeps self-hosted labels from
#     reading as unknown runners.
#   - the gosec SARIF upload is guarded on the PR head not being a fork.
#     GitHub downgrades the token to read-only for a pull_request from a fork
#     REGARDLESS of the `permissions:` block below, so the step failed the PR
#     for something an external contributor could not fix.
#
# v1.9 (2026-08-20, owner ruling — FAIL-FAST STAGED PIPELINE): iterate fast.
# Gitea cannot cancel in-flight jobs (no cancel route — task #90), so
# fail-fast comes from ORDERING: a fast tier (lint + build, ~minutes) gates
# the expensive tier (security, test, integration where present). A broken
# push reports in minutes and burns nothing downstream; a green push pays
# one fast-tier of extra latency. trivy and fips move to nightly.yml
# (schedule + workflow_dispatch): both were known-red on every push (fips:
# tracked per-repo fips140=only issues; trivy: undiagnosed install failure),
# and a known-red job burning 60-90 runner-minutes per push verifies
# nothing. The gate now distinguishes SKIP (upstream stage failed) from
# FAIL, both failing closed — this supersedes v1.8.1's lint-decoupling,
# whose silent-skip hazard is closed at the source (pinned linter) and in
# the gate (named skips).
#
# v1.9.1 (2026-09-01, owner ruling — devops.md 8a): the trivy move above is
# ALPHA-ONLY, and the note that it "gates nothing" is a phase, not a property.
# Every repo here is private and unreleased; from the first release published to
# the github.com mirror, that repo moves `trivy fs` BACK into ci.yml and into
# the ci-gate `needs`, blocking on CRITICAL/HIGH. Two consequences for adopters:
#   - the exposure window is real and accepted: in alpha a dependency CVE
#     surfaces at the next nightly, not at the push that introduces it;
#   - a repo where trivy is GREEN may keep it in ci.yml today and that is NOT a
#     deviation. The "undiagnosed install failure" premise above is repo-
#     specific and was measurably false in go-trusted-platform, where trivy fs
#     caught two live HIGH x/mod CVEs on 2026-08-19. Nightly is the floor.
# See conventions/devops.md 8a for the trigger and the reasoning.
#
# v1.8 (2026-08-19): gosec and govulncheck triage their own exit codes. A shell
# reports a signal death as 128+N, so an OOM kill leaves 137 — indistinguishable
# from a real finding in the job summary, which is all the Gitea API exposes
# (task #97). Found on go-quicbaas: gosec reported `Issues : 0`, govulncheck was
# SIGKILLed while four sibling repos ran heavy jobs on the same host, and the
# Makefile reported it as "reachable vulnerabilities" — a phantom CVE hunt
# waiting to happen. Both steps still exit non-zero; they only say WHICH it was.
# The same conflation exists in every repo's Makefile vuln target — fix it there
# too when adopting this version.
#
# v1.7 (2026-08-18): gosec -concurrency 4. The v1.6 GOMEMLIMIT/GOMAXPROCS
# bound was PROVEN INSUFFICIENT: gosec sizes its pool from runtime.NumCPU()
# (the host's 24 cores, GOMAXPROCS notwithstanding), so live SSA for ~24
# packages exceeded the 16 GB container cap with all three observed scans
# carrying GOMEMLIMIT=10GiB while pinned at 16/16 GiB. Live heap cannot be
# GC'd away; only lower analysis concurrency shrinks it.
#
# v1.6 (2026-08-18): GOMEMLIMIT + GOMAXPROCS on the security job. The Go
# toolchain does not see cgroup limits — inside a 16 GB container it read the
# HOST's 24 cores and 94 GB, ran 24 gosec workers, and grew the heap until the
# cgroup had to swap 10.9 GB of anonymous memory. It never OOMed (swap absorbed
# it), so instead of failing it thrashed: memory PSI 98, 43% of the host's CPU
# in iowait, every other job on the box starved. Full evidence in the job's
# comment block below. This is a TUNING fix, not a capacity one: the host had
# 56 GB free throughout.
#
# v1.5 (2026-08-18): triggers narrowed to `[main]`. The template shipped
# `[master, main, develop]` with a "CUSTOMIZE" note, so 15 of 20 repos still
# name branches that DO NOT EXIST — the template contradicted the ratified
# trunk-based standard (company CLAUDE.md: "no branches, and the trunk is
# main"), and a template that disagrees with the standard loses every time it
# is copied. Inert today, because no event can fire for a branch that is
# absent; the cost is latent, not current. Recreate `develop` in any of those
# repos and its every commit runs CI twice — one push run and one
# pull_request run for the same sha — with nothing to cancel the second
# (only a ref-keyed concurrency group would cancel it: devops.md §9b).
# Do NOT re-add a branch list "for safety": a repo that needs a second trunk
# is a decision for the owner, not a default.
#
# v1.4 (2026-08-17): `fips` job added (owner mandate, security-review.md §6)
# — build + unit tests under GOFIPS140=latest with GODEBUG=fips140=only, wired
# into ci-gate. Rolls out per repo through each project agent's own issue
# (NOT a blind template sweep): FIPS mode surfaces real incompatibilities
# (non-approved primitives) that each agent must resolve or escalate as an
# owner decision before its repo adopts v1.4.
#
# v1.3 (2026-08-14): `workflow_dispatch:` trigger added, so a phantom failure
# (runner crash, host overload; see infra lessons.md) can be retried without
# pushing an empty commit.
#
#   CORRECTION (2026-08-19): this entry originally claimed "Gitea's build
#   exposes no rerun API, so without it the only way to retry a phantom
#   failure is an empty commit." That premise is FALSE and it propagated to
#   five repos. `swagger.v1.json` on 1.27.1 publishes three re-run routes:
#     /repos/{owner}/{repo}/actions/runs/{run}/rerun
#     /repos/{owner}/{repo}/actions/runs/{run}/rerun-failed-jobs
#     /repos/{owner}/{repo}/actions/runs/{run}/jobs/{job_id}/rerun
#   `rerun-failed-jobs` re-runs only a run's failed jobs. Note the job-level
#   route is NESTED under the run — the flat `jobs/{id}/rerun` shape does not
#   exist, and probing that shape is how two of us concluded the API was
#   missing. A 404 does not distinguish a missing route from a missing
#   resource; swagger is the authority.
#
#   Stated precisely, because the mistake is easy to make in reverse: these
#   routes are PUBLISHED IN THE SPEC — verified. They have NOT yet been
#   executed here, so do not upgrade this to "rerun works" until someone has
#   actually run one. What IS measured: there is no `cancel` route at any
#   path, and DELETE returns 400 "this workflow run is not done" on anything
#   unfinished, so no REST call can shed a queued run (task #90).
#
#   `workflow_dispatch` KEEPS its place regardless, on an independent
#   justification: re-run acts on an existing run, so it cannot help when a
#   run was never created — the lazy-creation case where a fresh head shows
#   no jobs for minutes. Removing the trigger because re-run exists would be
#   an overcorrection.
#
# v1.2 (2026-08-14): actions/checkout and actions/setup-go moved to @v6 —
# §9 already named checkout@v6 the standard and repos were shipping green on
# v6/v6 while this file still said v4/v5 (same defect class as promising a
# gate the template doesn't implement: the standard and the template must
# never disagree).
#
# v1.1 (2026-08-14): gosec findings now also print to the job log (the SARIF
# upload only exists on github.com, so on Gitea the findings were invisible).
# Also NEVER add `GOPROXY: direct` / `GOSUMDB: off` to a repo's env block:
# GOPRIVATE (injected by the runners, dependency-resolution.md §6) already
# exempts first-party modules from proxy and sumdb; the blanket override
# disables checksum-database verification for every third-party dependency
# and breaks the build when an upstream re-points a tag (go-tpm-tools v0.4.8,
# 2026-08-14). `ghcr.io` likewise does not exist on Gitea — use the Gitea
# registry (lessons.md).
# Source of truth: software/templates/github-actions/ci.yml in the
# handbook. Copied into each repo (never workflow_call: the
# template lives inside the security boundary and cannot be referenced from
# github.com). Blocks marked CUSTOMIZE are the only expected divergence;
# everything else drifting from the template is a defect (devops.md §8).
#
# Runs identically on Gitea Actions (dev) and GitHub Actions (public mirror);
# host-specific steps are guarded on github.server_url (devops.md §1).

name: CI

on:
  push:
    # trunk-based: main is the ONLY trunk. automerge.yml's merge trains are
    # PRs from merge-train/* and get CI from pull_request (v1.15).
    branches: [main]
  pull_request:
    branches: [main]
    # v1.25.4: no `labeled`. Gitea 1.27.1 sends every
    # label add AND remove as `label_updated`, and its matcher maps that to
    # `labeled` whichever label moved, with no `github.event.label` in the
    # payload. Each `task:*` or `code-review` change then started a run that
    # the `concurrency` block let cancel the PR's run in progress, and a run
    # whose jobs an `if:` skips would post `skipped` over the real run's
    # `CI / *` contexts, CI Gate included. An action outside `types` matches
    # nothing: no run, no status. The cost: adding `ci:full` waits for the
    # PR's next push or update-branch, or takes effect through
    # `workflow_dispatch`.
    # v1.35.3: `ready_for_review`, so a draft marked ready gets its run.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:                    # re-fire a whole workflow; also the
                                        # only retry when a run was never
                                        # created (see v1.3 correction above)
  # v1.23: main's full tier nightly as well as after every merge. Scheduled
  # runs are on the default branch. CUSTOMIZE: the hour, off nightly.yml's.
  # v1.29.3: one schedule run per repository (the concurrency group below),
  # and its bigdisk jobs skip while a main push run is in flight (the
  # preflight job's schedule guard step).
  schedule:
    - cron: '0 4 * * 2'

# v1.53 (ruling 1087): on main the group is the workflow and the event,
# `main-{event}`, so a newer main run cancels the older one. Before v1.53:
# v1.26.2: on main the group is the workflow, the event and the commit sha,
# so each main run is its own group and a merge never cancels the main run in
# progress; a schedule or workflow_dispatch run is in its own event's group
# and never shares one with a push run (Tenant Agent m1167 (5), ruling 145,
# superseding v1.25's `main-{event}` group, m857 and m774 option (i)). Every
# other ref is one group, so a PR's newer run cancels the older. No
# expression reaches cancel-in-progress: Gitea 1.27.1 never released go-qrdb
# main run 57063, the first run after v1.22.1 set it to an expression
# (Tenant Agent m695).
# v1.29.3 (ruling 255(10)/(11)(c)): a schedule run's group is
# `schedule-{repository}`, with no sha, so a repository has one schedule run
# at a time. It is tested first, so a schedule run never takes a main group.
# The push, pull_request and workflow_dispatch groups do not change.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && format('schedule-{0}', github.repository) || github.ref == 'refs/heads/main' && format('main-{0}', github.event_name) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # CUSTOMIZE: sdk/go's measured floor, below the template's 90. The total is
  # 59.7% under the image job's sdk/go -race step (unit tests and the tfwsim
  # cross-implementation suite); raising it to 90 is tracked debt, not a
  # waiver. The C firmware's floor is `make coverage`'s, and sdk/go's and
  # xkms/'s 90 are sdk-coverage's and xkms-coverage's, all in `make test`.
  COVERAGE_THRESHOLD: 59
  # CUSTOMIZE (v1.9.2): the repo's full build-tag set, SPACE separated — the go
  # tool's own form. Leave EMPTY if no package is tag-gated. Every analysis step
  # below derives its own form from this ONE value; never write the tag list
  # twice. A tag-gated package that is not named here is analysed by NOTHING
  # while the gate still reports green (one repository had eight
  # such packages, including its whole WebAuthn implementation).
  # CUSTOMIZE (trusted-firmware): codec_json is xkms/'s tag (XKMS_TAGS in
  # mk/go.mk) and selects nothing in sdk/go or test/integration/esp32. There is
  # no root module: the Makefile's module targets carry the tag themselves, so
  # the make steps receive this value and do not read it; the tag assertion
  # runs in xkms/.
  GO_BUILD_TAGS: "codec_json"
  # v1.23: the full tier (ci-standard.md §8). v1.41 (ruling 742 (2)): every
  # event, a pull_request included, so a PR runs every stage main runs.
  # v1.30 (fix 5): a workflow_dispatch off main is not the full tier (the
  # schedule guard refuses it and CI Gate fails); v1.41: ci/deps-bump, which
  # deps-bump.yml (v1.42: scans.yml) dispatches because its PR starts no
  # pull_request run, is.
  # Steps read it as env.CI_FULL_TIER; a job-level `if:` cannot read env, so
  # the integration job repeats this expression. Keep them equal.
  CI_FULL_TIER: ${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ci/deps-bump' }}
  # v1.41: `ci:full` on a PR turns off the docs-only and lint-gates path
  # scopes; it selects no tier.
  CI_FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
  # v1.24 (Tenant Agent m749, m751 (a)): the files a docs-only PR may touch. CUSTOMIZE: narrow it
  # in a repo that embeds or generates from docs/ (go:embed, OpenAPI, protos).
  DOCS_ONLY_PATTERN: '(\.md$|^docs/)'
  # v1.30 (fix 3): a PR runs the lint-gates job only when a changed file
  # matches this extended regex. CUSTOMIZE: narrow it to what the repository's
  # lint-gates read (scripts, workflows, generated code, go.mod). The default
  # matches every file, so lint-gates runs on every PR.
  LINT_GATES_PATTERN: '.'
  # v1.26.1 (Tenant Agent m1128 (9)): the repository's releasability test, which
  # a docs-only PR still runs because make coverage skips on it. CUSTOMIZE: the
  # `go test` arguments, package and -run pattern (for example
  # `./pkg/labstrings -run '^TestTheTrackedTreeIsPubliclyReleasable$'`).
  # Empty means the repository has none. v1.31: this test names no internal
  # host, device, address or account; the internal names are checked by the
  # `Releasability (private patterns)` step from the private pattern file.
  RELEASABILITY_TEST: ""
  # v1.54 (ruling 1137): HOSTED_JOBS_PER_REPO and HOSTED_QUEUE_GRACE_SECONDS
  # (v1.48) are removed; the limits of `Balanced runner pool (ruling 1137)`
  # are the repository variables CI_HOSTED_SHARE, CI_SELF_HOSTED_BIGDISK and
  # CI_SELF_HOSTED_BIGDISK_DOCKER.

jobs:
  # v1.34 (Tenant Agent m2211 item 2(b)): one preflight job instead of three.
  # `Changed files`, `Schedule guard` and `Architecture Gates` were three jobs,
  # each a hosted runner of its own on every run, in a saturated hosted queue.
  # They are steps of this one job now, in this order: the schedule guard
  # first, before anything is checked out, so AGENT_TOKEN (a schedule run and
  # a push to main only) still reaches a step beside no repository code; then
  # one checkout with persist-credentials false; then the changed-files step;
  # then the architecture gates. The four outputs are the same, read as
  # needs.preflight.outputs.*. A repository adopts v1.34 in one CI-file PR:
  # its CUSTOMIZE jobs read needs.preflight where they read needs.changes or
  # needs.schedule-guard, its own architecture steps move into this job, and
  # CI Gate checks `preflight` in place of the three. The comments of the
  # three former jobs follow.
  # v1.24 (Tenant Agent m749, m751 (a)): a PR whose every changed file matches DOCS_ONLY_PATTERN
  # runs lint only; build and make coverage are skipped. Off pull_request, or
  # on a ci:full PR, docs_only is always false. Any doubt (a failed diff, an
  # empty list) reads as false, so the tier fails toward running the tests.
  # v1.29.3 (ruling 255(10)/(11)(c)): one nightly per
  # repository, and none while main is busy. On a schedule run only, this job
  # asks the API whether this workflow has a push run on main in progress or
  # waiting, and sets `verdict`: `run` (none, or not a schedule run), `busy`
  # (one is) or `unreadable` (no count came back). On a schedule run every
  # bigdisk job runs only on `run`; CI Gate skips on `busy` and fails on
  # `unreadable`. The job runs on every event, not on schedule alone, so no
  # bigdisk job's `needs` meets a skipped job off schedule; off schedule it
  # makes no call. It checks nothing out, so no repository code runs beside
  # the tokens.
  # v1.30 (fixes 2, 3 and 5): two more verdicts. `refused`: a
  # workflow_dispatch off main (no full tier on a PR branch, ever) or a pull
  # request from a checkpoint branch (lane-ckpt/*); every job but the gate
  # skips and CI Gate fails, on every event (#613). (The v1.30 `proven`
  # verdict, tree reuse on a main push, was never wired up and is removed,
  # #613: every main push runs the full tier.)
  # Architecture gate (v1.20, Tenant Agent m270 item 9; go-xkms arch-gates).
  # go-objstore owns every blob backend (docs/00), and a repo reaches it only
  # through the packages that are its storage seam. Test files are exempt, and
  # go-objstore itself passes. CUSTOMIZE: OBJSTORE_SEAMS, an extended regex of
  # the paths that may import go-objstore (go-xkms: 'pkg/ca/|pkg/storage/');
  # empty means none may. CUSTOMIZE: the repo's own layering rules (go-xkms:
  # xkmsctl and xkey depend only on sdk/go) are further steps in this job.
  # A source check with grep, not a stage: it runs on the runner's shell.
  # v1.23: a lint-class check, so it stays on the PR tier.
  preflight:
    name: Preflight
    # v1.49 (Tenant Agent ruling 1047 (3), (2)): on github.com the Dells'
    # bigdisk pool, so no run waits in the hosted queue for its first ten
    # seconds of work; the repository variable CI_PREFLIGHT_RUNS_ON, runs-on
    # JSON, overrides it (Fleet Ops sets `"ubuntu-latest"`, quotes included,
    # while the Dells are down). Off github.com the forge label, as before.
    # v1.52 (Tenant Agent order): a pull request from a fork (its head
    # repository is not this one) takes ubuntu-latest whatever the variable
    # holds; a fork never reaches a self-hosted runner.
    runs-on: ${{ github.server_url == 'https://github.com' && (!startsWith(github.event_name, 'pull_request') || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.CI_PREFLIGHT_RUNS_ON || '["self-hosted","linux","x64","bigdisk"]') || 'ubuntu-latest' }}   # v1.52
    # v1.34: one job for the three that had 5 minutes each.
    timeout-minutes: 10
    # v1.26: a draft PR runs no CI; the image job needs this one and skips with it.
    if: ${{ !github.event.pull_request.draft }}
    # The schedule guard's (v1.29.3): the Actions API read, and the checkout.
    permissions:
      actions: read
      contents: read
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
      esp32: ${{ steps.esp32.outputs.esp32 }}   # CUSTOMIZE: ruling 218(9), below
      optee: ${{ steps.optee.outputs.optee }}   # CUSTOMIZE: #253, below
      lint_gates: ${{ steps.diff.outputs.lint_gates }}   # v1.30
      verdict: ${{ steps.guard.outputs.verdict }}
      # v1.48 (ruling 1024): runs-on JSON for the two hosted-capable classes,
      # read as fromJSON(needs.preflight.outputs.runner_docker) by every job
      # that builds or runs images and fromJSON(needs.preflight.outputs.runner)
      # by CI Gate. `"ubuntu-latest"`, or the Dells' self-hosted label list
      # (v1.54: whichever pool `Balanced runner pool (ruling 1137)` picks).
      runner: ${{ steps.runner.outputs.runner }}
      runner_docker: ${{ steps.runner.outputs.runner_docker }}
    steps:
      # v1.34: the guard is the first step; nothing is checked out before it.
      # v1.29.3 (ruling 255(10)/(11)(c)): one nightly per
      # repository, and none while main is busy. On a schedule run only, this
      # step asks the API whether this workflow has a push run on main in
      # progress or waiting, and sets `verdict`: `run` (none, or not a schedule
      # run), `busy` (one is) or `unreadable` (no count came back). On a
      # schedule run every bigdisk job runs only on `run`; CI Gate skips on
      # `busy` and fails on `unreadable`. The step runs on every event, not on
      # schedule alone, so no bigdisk job's `needs` meets a skipped job off
      # schedule; off schedule it makes no call. On a schedule run nothing is
      # checked out before it, and AGENT_TOKEN reaches this step alone, so no
      # repository code runs beside the tokens.
      - name: Is a main push run of this workflow in flight?
        id: guard
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          HEAD_REF: ${{ github.head_ref }}
          SERVER: ${{ github.server_url }}
          # This workflow's own file: the route counts its runs only.
          RUNS_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}/actions/workflows/ci.yml/runs
          JOB_TOKEN: ${{ github.token }}
          # v1.49: off github.com only. On github.com the guard never reads it
          # (no schedule check, no tree proof there), so the secret no longer
          # reaches the step on the Dells' runner.
          BOT: ${{ github.server_url != 'https://github.com' && github.event_name == 'schedule' && secrets.AGENT_TOKEN || '' }}
        run: |
          set -uo pipefail
          # runs <token>: sets N to the number of this workflow's push runs
          # on main in progress or waiting. It returns 1, with the answer in
          # CODE, when a reply is not 200 with a count. The token reaches
          # curl as a header from a file descriptor, never on its command line.
          # waiting is read before in_progress: a run only moves waiting, then
          # in_progress, then done, so one waiting at the first query is
          # still waiting, in progress or done at the second, and counted or
          # finished. The other order lets a run start between the two
          # queries and be counted by neither.
          runs() {
            local st n
            N=0
            for st in waiting in_progress; do
              CODE=$(curl -sS --max-time 30 -o "$RUNNER_TEMP/runs.json" -w '%{http_code}' \
                -H @<(printf 'Authorization: token %s\n' "$1") \
                "$RUNS_API?event=push&branch=main&status=$st&limit=1") || CODE="curl exit $?"
              [ "$CODE" = 200 ] || return 1
              n=$(jq -er '.total_count | numbers' "$RUNNER_TEMP/runs.json") || { CODE="200 with no count"; return 1; }
              echo "$st: $n"
              N=$((N + n))
            done
          }
          verdict=run N=0
          # v1.30 (fixes 3 and 5): the refusals come first.
          # v1.39 (ruling 640): deps-bump.yml dispatches this workflow on
          # ci/deps-bump, because the PR it opens with GITHUB_TOKEN starts no
          # pull_request run. That dispatch is the full tier (v1.41,
          # CI_FULL_TIER), so it is not refused. v1.42: scans.yml (which
          # replaces deps-bump.yml, ruling 742 (1)) dispatches it the same way.
          # #613: the step's env always sets REF (github.ref, never empty on a
          # dispatch) and HEAD_REF; run without them (scripts/
          # test_schedule_guard.py), the ref checks do not apply and `set -u`
          # does not trip.
          if [ "$EVENT" = workflow_dispatch ] && [ -n "${REF:-}" ] && [ "$REF" != refs/heads/main ] && [ "$REF" != refs/heads/ci/deps-bump ]; then
            verdict=refused
            echo "::error::workflow_dispatch on $REF: a dispatch runs on main and ci/deps-bump only (ci-template v1.30, v1.41); every job skips and CI Gate fails"
          elif [ "$EVENT" = pull_request ] && [[ ${HEAD_REF:-} == lane-ckpt/* ]]; then
            verdict=refused
            echo "::error::a pull request from checkpoint branch $HEAD_REF: a checkpoint branch never opens a PR (ci-template v1.30); every job skips and CI Gate fails"
          fi
          if [ "$verdict" != run ]; then
            :
          elif [ "$EVENT" != schedule ]; then
            echo "not a schedule run: no check"
          elif [ "$SERVER" = https://github.com ]; then
            echo "the github.com mirror has no bigdisk runner: no check"
          elif [ -n "$JOB_TOKEN" ] && runs "$JOB_TOKEN"; then
            echo "read with the job token"
          elif job="${CODE:-no job token}"; [ -n "$BOT" ] && runs "$BOT"; then
            echo "read with AGENT_TOKEN; the job token got: $job"
          else
            bot="not set"; [ -z "$BOT" ] || bot="$CODE"
            verdict=unreadable
            echo "::error::the Actions API gave no count (job token: $job; AGENT_TOKEN: $bot), so every bigdisk job skips and CI Gate fails"
          fi
          if [ "$verdict" = run ] && [ "$N" -gt 0 ]; then
            verdict=busy
            echo "::notice::$N push run(s) of this workflow on main in flight: this schedule run skips its bigdisk jobs, and CI Gate posts skipped"
          fi
          echo "verdict: $verdict"
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

      # v1.54 (Tenant Agent ruling 1137, owner order; it replaces the hosted
      # first rule of rulings 999 and 1024, v1.48 to v1.53): the run goes to
      # whichever of the two pools, GitHub-hosted or the Dells' self-hosted
      # bigdisk pools, this repository uses less, so both run full. On
      # github.com this step lists every queued and in-progress run of every
      # workflow of this repository and their latest jobs, through the
      # Actions API with the job token (actions: read), and counts, from that
      # one listing, each in progress plus queued, H: hosted jobs (labels
      # naming an ubuntu-* image and not self-hosted), S1: self-hosted jobs on
      # bigdisk and not bigdisk-docker, and S2: jobs on bigdisk-docker. Jobs
      # of this run are not counted: they wait on this decision. The limits
      # are repository variables set by the Infra Department, plain decimal
      # integers: HS = vars.CI_HOSTED_SHARE (this repository's share of the
      # account's 40 hosted runners; unset, 0 or not a whole number gives a
      # ::warning and HS=12, the v1.48 limit), C1 =
      # vars.CI_SELF_HOSTED_BIGDISK and C2 = vars.CI_SELF_HOSTED_BIGDISK_DOCKER
      # (the units of each label; either unset, 0 or not a whole number: the
      # hosted default with a ::warning). Hosted use is H/HS; self-hosted use
      # is the larger of S1/C1 and S2/C2. Then:
      #   - both below their limit: the lower use wins, compared by
      #     cross-multiplication (self-hosted wins only when S1*HS < H*C1 and
      #     S2*HS < H*C2); a tie goes hosted;
      #   - one pool full (H >= HS; or S1 >= C1 or S2 >= C2): the other pool;
      #   - both full: the pool with fewer queued jobs (bigdisk and
      #     bigdisk-docker together for the Dells); a tie goes hosted.
      # The units are shared across repositories, so C1 and C2 can overstate
      # this repository's free room: when they are busy elsewhere its jobs
      # queue, S1 or S2 rises, and its runs go hosted.
      # It outputs `runner` and `runner_docker` as runs-on JSON:
      # `"ubuntu-latest"`, or `["self-hosted","linux","x64","bigdisk"]` and
      # `["self-hosted","linux","x64","bigdisk-docker"]`. A count it cannot
      # read (a reply that is not 200, a list short of its total_count, a
      # field missing) picks nothing silently: a ::warning names why and the
      # run takes the hosted default. One decision per run: every job of the
      # run takes it, in every workflow that reads these outputs. Off
      # github.com it makes no call, and each job's runs-on keeps its forge
      # label (bigdisk, ci-gate). It runs before the checkout, beside no
      # repository code.
      # v1.52 (Tenant Agent order, kept): on a pull request whose head
      # repository is not this repository (a fork, or a fork since deleted),
      # it makes no call and outputs the hosted default with a ::notice: a
      # fork never reaches a self-hosted runner. Its tests:
      # testdata/runner-select-tests.py.
      - name: Balanced runner pool (ruling 1137)
        id: runner
        env:
          SERVER: ${{ github.server_url }}
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}/actions
          RUN_ID: ${{ github.run_id }}
          JOB_TOKEN: ${{ github.token }}
          HS: ${{ vars.CI_HOSTED_SHARE }}
          C1: ${{ vars.CI_SELF_HOSTED_BIGDISK }}
          C2: ${{ vars.CI_SELF_HOSTED_BIGDISK_DOCKER }}
        run: |
          set -uo pipefail
          HOSTED='"ubuntu-latest"'
          selfhosted() { printf '["self-hosted","linux","x64","%s"]' "$1"; }
          emit() {
            echo "runner: $1; runner_docker: $2"
            { echo "runner=$1"; echo "runner_docker=$2"; } >> "$GITHUB_OUTPUT"
          }
          # hosted <why>: no count, so the default, with the reason shown.
          hosted() {
            echo "::warning::runner selection: $1; every job of this run takes the GitHub-hosted default, ubuntu-latest, and none runs on the Dells (ci-template v1.54, ruling 1137)"
            emit "$HOSTED" "$HOSTED"
            exit 0
          }
          if [ "$SERVER" != https://github.com ]; then
            echo "not github.com: each job keeps its forge label (bigdisk, ci-gate); no selection"
            emit "$HOSTED" "$HOSTED"
            exit 0
          fi
          # v1.52: a fork's pull request runs every job on GitHub-hosted runners.
          case "$EVENT" in
            pull_request|pull_request_target)
              if [ "$HEAD_REPO" != "$REPO" ]; then
                echo "::notice::runner selection: this pull request's head repository is not this repository (a fork); every job of this run takes the GitHub-hosted default, ubuntu-latest, and none reaches a self-hosted runner (ci-template v1.52)"
                emit "$HOSTED" "$HOSTED"
                exit 0
              fi ;;
          esac
          # whole <value>: a whole number above 0, at most 6 digits.
          whole() { [[ "$1" =~ ^[0-9]{1,6}$ ]] && [ "$((10#$1))" -gt 0 ]; }
          whole "$C1" || hosted "CI_SELF_HOSTED_BIGDISK='$C1' is unset, 0 or not a whole number, so no bigdisk job can be placed (the Infra Department sets it)"
          whole "$C2" || hosted "CI_SELF_HOSTED_BIGDISK_DOCKER='$C2' is unset, 0 or not a whole number, so no bigdisk-docker job can be placed (the Infra Department sets it)"
          C1=$((10#$C1)) C2=$((10#$C2))
          if whole "$HS"; then
            HS=$((10#$HS))
          else
            echo "::warning::runner selection: CI_HOSTED_SHARE='$HS' is unset, 0 or not a whole number; HS=12 until the Infra Department sets it (ci-template v1.54, ruling 1137)"
            HS=12
          fi
          # get <url> <file>: 0 on a 200 reply, saved in <file>; the answer in
          # CODE. The token reaches curl as a header from a file descriptor.
          get() {
            CODE=$(curl -sS --max-time 30 -o "$2" -w '%{http_code}' \
              -H @<(printf 'Authorization: Bearer %s\n' "$JOB_TOKEN") \
              -H 'Accept: application/vnd.github+json' "$1") || CODE="curl exit $?"
            [ "$CODE" = 200 ]
          }
          # pages <url> <key> <out>: every page of a listing, its <key> items
          # one JSON object per line in <out>. 1, with WHY set, when a reply is
          # not 200 or the items fall short of total_count.
          pages() {
            local p=1 got=0 total n
            : > "$3"
            while :; do
              get "$1&per_page=100&page=$p" "$RUNNER_TEMP/sel-page.json" || { WHY="$1: $CODE"; return 1; }
              total=$(jq -er '.total_count | numbers' "$RUNNER_TEMP/sel-page.json") || { WHY="$1: 200 with no total_count"; return 1; }
              n=$(jq -er --arg k "$2" '.[$k] | arrays | length' "$RUNNER_TEMP/sel-page.json") || { WHY="$1: 200 with no $2 list"; return 1; }
              jq -c --arg k "$2" '.[$k][]' "$RUNNER_TEMP/sel-page.json" >> "$3"
              got=$((got + n))
              { [ "$got" -lt "$total" ] && [ "$n" -gt 0 ]; } || break
              [ "$p" -lt 10 ] || { WHY="$1: more than 1000 entries"; return 1; }
              p=$((p + 1))
            done
            [ "$got" -ge "$total" ] || { WHY="$1: $got of $total entries"; return 1; }
          }
          : > "$RUNNER_TEMP/sel-runs.jsonl"
          for st in queued in_progress; do
            pages "$API/runs?status=$st" workflow_runs "$RUNNER_TEMP/sel-r.jsonl" || hosted "the Actions API gave no complete run list ($WHY)"
            cat "$RUNNER_TEMP/sel-r.jsonl" >> "$RUNNER_TEMP/sel-runs.jsonl"
          done
          : > "$RUNNER_TEMP/sel-jobs.jsonl"
          for id in $(jq -r '.id' "$RUNNER_TEMP/sel-runs.jsonl" | sort -u); do
            [ "$id" != "$RUN_ID" ] || continue
            pages "$API/runs/$id/jobs?filter=latest" jobs "$RUNNER_TEMP/sel-j.jsonl" || hosted "the Actions API gave no complete job list ($WHY)"
            cat "$RUNNER_TEMP/sel-j.jsonl" >> "$RUNNER_TEMP/sel-jobs.jsonl"
          done
          # H, S1, S2: hosted, bigdisk (not bigdisk-docker) and bigdisk-docker
          # jobs in progress plus queued; HQ, SQ: the queued hosted and
          # self-hosted (both kinds) ones. A job of this run is not counted.
          read -r H S1 S2 HQ SQ < <(jq -rs --argjson run "$RUN_ID" '
              [.[] | select(.run_id != $run and (.status == "queued" or .status == "in_progress"))
                   | (.labels // []) as $l
                   | {q: (.status == "queued"),
                      p: (if ($l | any(. == "self-hosted")) then
                            (if ($l | any(. == "bigdisk-docker")) then "s2"
                             elif ($l | any(. == "bigdisk")) then "s1" else "x" end)
                          elif ($l | any(startswith("ubuntu-"))) then "h"
                          else "x" end)}] as $j
              | def n(f): $j | map(select(f)) | length;
              [n(.p == "h"), n(.p == "s1"), n(.p == "s2"), n(.p == "h" and .q),
               n((.p == "s1" or .p == "s2") and .q)]
              | map(tostring) | join(" ")' "$RUNNER_TEMP/sel-jobs.jsonl") || hosted "the job list could not be counted"
          [ -n "${SQ:-}" ] || hosted "the job list could not be counted"
          echo "this repository: hosted $H of CI_HOSTED_SHARE=$HS ($HQ queued); bigdisk $S1 of CI_SELF_HOSTED_BIGDISK=$C1, bigdisk-docker $S2 of CI_SELF_HOSTED_BIGDISK_DOCKER=$C2 ($SQ self-hosted queued)"
          pick=hosted hfull=0 sfull=0
          [ "$H" -lt "$HS" ] || hfull=1
          { [ "$S1" -lt "$C1" ] && [ "$S2" -lt "$C2" ]; } || sfull=1
          if [ "$hfull" = 1 ] && [ "$sfull" = 1 ]; then
            [ "$SQ" -lt "$HQ" ] && pick=self
            why="both pools full: hosted $HQ queued, self-hosted $SQ queued"
          elif [ "$hfull" = 1 ]; then
            pick=self; why="the hosted pool is full ($H of $HS)"
          elif [ "$sfull" = 1 ]; then
            why="the self-hosted pool is full (bigdisk $S1 of $C1, bigdisk-docker $S2 of $C2)"
          else
            # self-hosted use, max(S1/C1, S2/C2), below hosted use H/HS.
            [ $((S1 * HS)) -lt $((H * C1)) ] && [ $((S2 * HS)) -lt $((H * C2)) ] && pick=self
            why="use hosted $H/$HS, bigdisk $S1/$C1, bigdisk-docker $S2/$C2"
          fi
          if [ "$pick" = self ]; then
            echo "::notice::runner selection: $why; this run's jobs run on the Dells (bigdisk, bigdisk-docker) (ci-template v1.54, ruling 1137)"
            emit "$(selfhosted bigdisk)" "$(selfhosted bigdisk-docker)"
          else
            echo "::notice::runner selection: $why; this run's jobs take the GitHub-hosted default, ubuntu-latest (ci-template v1.54, ruling 1137)"
            emit "$HOSTED" "$HOSTED"
          fi

      # v1.34: the full history on a PR run for the changed-files diff, one
      # commit otherwise. v1.41: every PR run, ci:full or not. No credential is left in the checkout.
      # CUSTOMIZE (trusted-firmware, ruling 218(9)): every PR, a ci:full one
      # too, fetches the full history: the ESP32, OP-TEE and xkms steps diff it.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          persist-credentials: false

      # v1.38 (owner ruling 633, decision 219(d)): a job that names the
      # `release` label runs only on a push to refs/heads/main or a tag, or a
      # workflow_dispatch on main, and never for a pull request. This step
      # reads every .github/workflows/*.yml and *.yaml of the repository as
      # text, takes each job whose runs-on names `release` (plain, in a list,
      # or as a quoted string inside an expression), and evaluates its `if:`
      # under every other event: a pull_request or pull_request_target event
      # in a workflow that has that trigger (a), and the push of another
      # branch, a dispatch off main or on a tag, schedule, workflow_run,
      # merge_group, release, create, issue_comment and repository_dispatch
      # (b). A value it cannot know (vars, needs, secrets, the server) may
      # hold anything, so the `if:` must be false whatever it holds; an `if:`
      # it cannot read fails. It prints each file:job and the reason. A lint,
      # not the gate: the runner side refuses such a job as well.
      # v1.43 (ruling 833): on github.com every other job runs on a standard
      # GitHub-hosted image on every event (c), or its runs-on line says why
      # it cannot, `# self-hosted: <reason>`; a larger runner is refused (d).
      # v1.46 (ruling 999): the reason names its category, hardware: or
      # oversize: (credential: for the one Codex review job); a reason with
      # no category is (e).
      # v1.47 (ruling 1007): label and category are checked together. The
      # review-only labels codex and qwen run only in code-review.yml, codex
      # with credential: and qwen with hardware:, and credential: is only for
      # codex; a waiver does not lift it (f).
      # v1.48 (ruling 1024): in ci.yml, a runs-on that reads
      # needs.preflight.outputs.runner or runner_docker is checked with the
      # output at its default ("ubuntu-latest", which must give a standard
      # image) and at its overflow, where exactly
      # [self-hosted, linux, x64, bigdisk] or [..., bigdisk-docker] passes too.
      # v1.49 (#613): `x || y` with x unknown is unknown, never y alone, so a
      # `vars.CI_RUNNER || 'ubuntu-latest'` runs-on is not hosted (c); with a
      # waiver it may still be `release`, and its `if:` is checked as such.
      # v1.49 (ruling 1047 (3)): the preflight job's own runs-on, which reads
      # vars.CI_PREFLIGHT_RUNS_ON, is checked with the variable unset, where
      # exactly [self-hosted, linux, x64, bigdisk] passes too, and set to
      # `"ubuntu-latest"`, where it must give a standard image.
      # v1.52 (Tenant Agent order): a fork's head under pull_request, as under
      # pull_request_target (v1.51), gets no unset-variable exemption, and the
      # selection outputs read for it are the hosted default the step emits.
      # Its tests: scripts/test_ci_runner_expr.py.
      - name: Runner labels (ruling 633)
        run: |
          python3 -I - <<'PY'
          import glob, json, re, sys

          # Reads .github/workflows/*.yml|yaml as text (no YAML library): the
          # top-level `on:` keys, and each job's `runs-on` and `if`. A job names
          # `release` when that label appears in its runs-on, plain, in a list or as a
          # quoted string in an expression. Its `if` is evaluated under every event
          # outside the release allow-list, with every value this step cannot know
          # (vars, needs, secrets, server_url, ...) unknown; the job passes only when
          # the `if` is false in each of them whatever the unknowns hold.
          U = object()  # unknown value
          OPEN = "$" "{{"  # split, so the runner does not read it as an expression
          ALLOWED = "push to refs/heads/main or refs/tags/*, or workflow_dispatch on main"
          PR = {"pull_request", "pull_request_target"}
          CTX = [  # (event, ref) pairs a release job must never run on
              ("pull_request", "refs/pull/1/merge"), ("pull_request_target", "refs/heads/main"),
              ("schedule", "refs/heads/main"),
              ("workflow_run", "refs/heads/main"), ("merge_group", "refs/heads/gh-readonly-queue/main/pr-1"),
              ("release", "refs/tags/v1.0.0"), ("create", "refs/tags/v1.0.0"),
              ("issue_comment", "refs/heads/main"), ("repository_dispatch", "refs/heads/main"),
          ]

          # v1.49 (#613 round 5): on push and workflow_dispatch the ref is any branch
          # but main (on dispatch, any tag too), so the `if` is tried under each ref
          # it names and under one fresh ref standing for every other. There
          # github.ref, github.event.ref and github.ref_name are a Ref. A fresh Ref
          # reaches only == and != against a string, which record the ref the
          # string names, and a ref prefix in startsWith/contains; any other use
          # (ordering, a number, a substring, another function, an index) is
          # unknown. Repeated until no new ref is named, every branch b gets the
          # result of the named ref equal to b (comparisons ignore case), or else
          # of the fresh one: each test that reads b compares it with a recorded
          # string, and gives the same answer under both.
          REFS = [("push", "refs/heads/"), ("workflow_dispatch", "refs/heads/"), ("workflow_dispatch", "refs/tags/")]
          FRESH = {"refs/heads/": "feature", "refs/tags/": "v1.0.0"}
          MAIN = "main"  # push and dispatch on main are allowed
          SEEN = set()  # (prefix, name) of each ref a comparison names


          class Ref(str):
              def __new__(cls, s, pre, full, fresh):
                  r = str.__new__(cls, s)
                  r.pre, r.full, r.fresh = pre, full, fresh
                  return r


          def is_fresh(v):
              return isinstance(v, Ref) and v.fresh


          def named(r, y):
              """The branch or tag a string compared with Ref r names, if any."""
              y = y.lower()
              if r.full:
                  return y[len(r.pre):] if y.startswith(r.pre) and len(y) > len(r.pre) else None
              return y or None


          def ctx_get(ev, ref, path, fresh=None):
              p = path.lower()
              name = ref.split("/", 2)[-1]
              known = {"github.event_name": ev, "github.ref": ref, "github.event.ref": ref,
                       "github.ref_name": name,
                       "github.ref_type": "tag" if ref.startswith("refs/tags/") else "branch",
                       "github.head_ref": "feature" if ev in PR else "",
                       "github.base_ref": "main" if ev in PR else ""}
              if p in known:
                  if fresh is not None and p in ("github.ref", "github.event.ref", "github.ref_name"):
                      pre = "refs/tags/" if ref.startswith("refs/tags/") else "refs/heads/"
                      return Ref(known[p], pre, p != "github.ref_name", fresh)
                  return known[p]
              if ev not in PR and (p == "github.event.pull_request" or p.startswith("github.event.pull_request.")):
                  return None
              return U


          TOK = re.compile(r"\s*(?:(?P<s>'(?:[^']|'')*')|(?P<n>-?\d+(?:\.\d+)?)|(?P<op>&&|\|\||==|!=|<=|>=|[!<>()\[\],.])|(?P<id>[A-Za-z_][\w-]*|\*))")


          def lex(s):
              out, i = [], 0
              while i < len(s):
                  if s[i:].strip() == "":
                      break
                  m = TOK.match(s, i)
                  if not m:
                      raise ValueError(f"cannot read the expression at {s[i:i+20]!r}")
                  i = m.end()
                  if m.group("s"):
                      out.append(("s", m.group("s")[1:-1].replace("''", "'")))
                  elif m.group("n"):
                      out.append(("v", float(m.group("n"))))
                  elif m.group("op"):
                      out.append(("op", m.group("op")))
                  else:
                      out.append(("id", m.group("id")))
              return out


          def truthy(v):
              if v is U:
                  return U
              if isinstance(v, float) and v != v:
                  return False
              return v not in (None, False, 0, "", 0.0)


          def num(v):
              if v is None or v is False:
                  return 0.0
              if v is True:
                  return 1.0
              if isinstance(v, (int, float)):
                  return float(v)
              if isinstance(v, str):
                  try:
                      return float(v.strip() or 0)
                  except ValueError:
                      return float("nan")
              return float("nan")


          def eq(a, b):
              if a is U or b is U:
                  return U
              if isinstance(a, Ref) != isinstance(b, Ref):
                  r, y = (a, b) if isinstance(a, Ref) else (b, a)
                  if isinstance(y, str):
                      n = named(r, y)
                      if n:
                          SEEN.add((r.pre, n))
                  elif r.fresh:
                      return U  # num() reads a branch named 0 or 1e3 as a number
              if isinstance(a, str) and isinstance(b, str):
                  return a.lower() == b.lower()
              if type(a) is type(b) and not isinstance(a, (int, float)):
                  return a == b
              return num(a) == num(b)


          class P:
              def __init__(self, toks, get):
                  self.t, self.i, self.get = toks, 0, get

              def peek(self):
                  return self.t[self.i] if self.i < len(self.t) else (None, None)

              def take(self, want=None):
                  k, v = self.peek()
                  if want is not None and v != want:
                      raise ValueError(f"expected {want!r}, found {v!r}")
                  self.i += 1
                  return k, v

              def parse(self):
                  v = self.orx()
                  if self.i != len(self.t):
                      raise ValueError(f"unexpected {self.peek()[1]!r}")
                  return v

              def orx(self):
                  a = self.andx()
                  while self.peek() == ("op", "||"):
                      self.take()
                      b = self.andx()
                      ta = truthy(a)
                      if ta is True:
                          pass
                      elif ta is False:
                          a = b
                      else:
                          # v1.49 (#613): an unknown left operand may be truthy,
                          # and then `||` returns it, not the right one.
                          a = U
                  return a

              def andx(self):
                  a = self.cmp()
                  while self.peek() == ("op", "&&"):
                      self.take()
                      b = self.cmp()
                      ta = truthy(a)
                      if ta is False:
                          pass
                      elif ta is True:
                          a = b
                      else:
                          a = b if truthy(b) is False else U
                  return a

              def cmp(self):
                  a = self.unary()
                  while self.peek()[0] == "op" and self.peek()[1] in ("==", "!=", "<", "<=", ">", ">="):
                      op = self.take()[1]
                      b = self.unary()
                      if op == "==":
                          a = eq(a, b)
                      elif op == "!=":
                          r = eq(a, b)
                          a = U if r is U else not r
                      elif a is U or b is U or is_fresh(a) or is_fresh(b):
                          a = U
                      else:
                          x, y = (a.lower(), b.lower()) if isinstance(a, str) and isinstance(b, str) else (num(a), num(b))
                          a = {"<": x < y, "<=": x <= y, ">": x > y, ">=": x >= y}[op]
                  return a

              def unary(self):
                  if self.peek() == ("op", "!"):
                      self.take()
                      t = truthy(self.unary())
                      return U if t is U else not t
                  return self.primary()

              def primary(self):
                  k, v = self.take()
                  if k == "s" or k == "v":
                      return v
                  if (k, v) == ("op", "("):
                      r = self.orx()
                      self.take(")")
                      return r
                  if k != "id":
                      raise ValueError(f"unexpected {v!r}")
                  lv = v.lower()
                  if lv in ("true", "false"):
                      return lv == "true"
                  if lv == "null":
                      return None
                  if self.peek() == ("op", "("):
                      self.take()
                      args = []
                      if self.peek() != ("op", ")"):
                          args.append(self.orx())
                          while self.peek() == ("op", ","):
                              self.take()
                              args.append(self.orx())
                      self.take(")")
                      return self.call(lv, args)
                  path, exact = v, True
                  while self.peek() in (("op", "."), ("op", "[")):
                      if self.take()[1] == ".":
                          k2, v2 = self.take()
                          if k2 != "id":
                              raise ValueError(f"unexpected {v2!r} after '.'")
                          path += "." + v2
                          exact = exact and v2 != "*"
                      else:
                          idx = self.orx()
                          self.take("]")
                          if isinstance(idx, str) and not is_fresh(idx):
                              path += "." + idx
                          else:
                              exact = False
                  return self.get(path) if exact else U

              def call(self, f, a):
                  if f == "always":
                      return True
                  if f in ("startswith", "endswith", "contains") and len(a) == 2:
                      if U in a:
                          return U
                      if f == "contains" and isinstance(a[0], list):
                          rs = [eq(x, a[1]) for x in a[0]]
                          return True if True in rs else U if U in rs else False
                      if is_fresh(a[0]) and isinstance(a[1], str) and not isinstance(a[1], Ref):
                          r, y = a[0], a[1].lower()  # v1.49: decided by the ref prefix alone, or unknown
                          if y == "" or r.full and (r.pre.startswith(y) if f == "startswith" else f == "contains" and y in r.pre):
                              return True
                          return False if f == "startswith" and r.full and not y.startswith(r.pre) else U
                      if any(is_fresh(x) for x in a):
                          return U
                      x, y = (str(s).lower() if s is not None else "" for s in a)
                      return x.startswith(y) if f == "startswith" else x.endswith(y) if f == "endswith" else y in x
                  if any(is_fresh(x) for x in a):
                      return U
                  if f == "fromjson" and len(a) == 1 and isinstance(a[0], str):
                      try:
                          return json.loads(a[0])
                      except ValueError:
                          return U
                  if f == "format" and a and U not in a and isinstance(a[0], str):
                      return re.sub(r"\{(\d+)\}", lambda m: str(a[int(m.group(1)) + 1]) if int(m.group(1)) + 1 < len(a) else m.group(0), a[0])
                  return U  # success(), failure(), hashFiles(), ...: unknown


          def release_runs(toks):
              """The (event, ref) pairs under which the `if` is not false."""
              names = set()
              while True:
                  SEEN.clear()
                  ctxs = [(ev, ref, None) for ev, ref in CTX]
                  for ev, pre in REFS:
                      taken = {n for p, n in names if p == pre}
                      fresh, k = FRESH[pre], 0
                      while fresh in taken:
                          fresh, k = f"{FRESH[pre]}-{k}", k + 1
                      ctxs.append((ev, pre + fresh, True))
                      ctxs += [(ev, pre + n, False) for n in sorted(taken) if (pre, n) != ("refs/heads/", MAIN)]
                  runs = [(ev, ref) for ev, ref, fr in ctxs
                          if truthy(P(toks, lambda p: ctx_get(ev, ref, p, fr)).parse()) is not False]
                  if SEEN <= names:
                      return runs
                  names |= SEEN
                  if len(names) > 64:
                      raise ValueError("it names more than 64 branches or tags")


          def unquote(s):
              s = s.strip()
              if len(s) >= 2 and s[0] == s[-1] == "'":
                  return s[1:-1].replace("''", "'")
              if len(s) >= 2 and s[0] == s[-1] == '"':
                  return json.loads(s)
              return s


          def strip_comment(s):
              q = None
              for i, c in enumerate(s):
                  if q:
                      if c == q:
                          q = None
                  elif c in "'\"":
                      q = c
                  elif c == "#" and (i == 0 or s[i - 1] in " \t"):
                      return s[:i].rstrip()
              return s.rstrip()


          def ind(line):
              return len(line) - len(line.lstrip(" "))


          def body(lines, i, inline):
              """The value text of the key on line i: the inline part plus every deeper line."""
              base, parts = ind(lines[i]), []
              j = i + 1
              while j < len(lines) and (not lines[j].strip() or ind(lines[j]) > base):
                  if lines[j].strip() and not lines[j].lstrip().startswith("#"):
                      parts.append(strip_comment(lines[j]).strip())
                  j += 1
              inline = strip_comment(inline).strip()
              if inline[:1] in ("|", ">"):
                  return (" " if inline[0] == ">" else "\n").join(parts)
              return " ".join([inline] + parts).strip()


          def keys_under(lines, i):
              """(line, key) for each direct child key of the block opened on line i."""
              base, out, child = ind(lines[i]), [], None
              for j in range(i + 1, len(lines)):
                  s = lines[j]
                  if not s.strip() or s.lstrip().startswith("#"):
                      continue
                  if ind(s) <= base:
                      break
                  child = ind(s) if child is None else child
                  if ind(s) == child:
                      m = re.match(r"\s*(?:-\s+)?(['\"]?)([^'\":#]+)\1\s*(?::\s*(.*))?$", s)
                      if m:
                          out.append((j, m.group(2).strip(), m.group(3) or ""))
              return out


          def triggers(lines):
              for i, s in enumerate(lines):
                  m = re.match(r"(['\"]?)(on|true)\1\s*:\s*(.*)$", s)
                  if m:
                      v = strip_comment(m.group(3)).strip()
                      if v.startswith("{"):  # a flow mapping: its keys, nested ones too
                          return set(re.findall(r"([A-Za-z_]+)['\"]?\s*:", v))
                      if v:
                          return {unquote(x) for x in re.split(r"[\s,\[\]]+", v) if x}
                      return {k for _, k, _ in keys_under(lines, i)}
              return set()


          # v1.43 (ruling 833): the standard GitHub-hosted images, free on a public
          # repository; a larger runner (cores, large, xlarge, gpu) bills even there.
          STANDARD = re.compile(r"(ubuntu-(latest|24\.04|22\.04)(-arm)?|ubuntu-slim)")
          LARGER = re.compile(r"(cores|xlarge|large|gpu)", re.I)
          WAIVER = re.compile(r"#\s*self-hosted:\s*(hardware|oversize|credential)\s*:\s*\S")
          BARE = re.compile(r"#\s*self-hosted:")  # v1.46: a waiver whose reason names no category
          # v1.47 (ruling 1007): a review-only label runs only in code-review.yml, and
          # only with its own category; credential: is the codex job's alone.
          REVIEW = {"codex": "credential", "qwen": "hardware"}
          REVIEW_FILES = {"code-review.yml", "code-review.yaml"}
          REVIEW_TOKEN = re.compile(r"(?<![\w.-])['\"]?(codex|qwen)['\"]?(?![\w-])", re.I)
          GH = "https://github.com"
          # v1.48 (ruling 1024): ci.yml's preflight runner selection (v1.54:
          # `Balanced runner pool (ruling 1137)`) outputs runs-on JSON,
          # "ubuntu-latest" or the Dells' self-hosted list ("overflow" below). In ci.yml only, a
          # runs-on that reads exactly these outputs is checked under both: the
          # default must be a standard image, as (c) asks of every job, and the
          # overflow may also be exactly the list its output names. Any other
          # self-hosted value still needs its waiver.
          SEL_FILES = {"ci.yml", "ci.yaml"}
          # v1.53 (Tenant Agent on trusted-firmware #821): code-review.yml's
          # API-only guard jobs may take exactly [self-hosted, linux, x64,
          # bigdisk] for a same-repository head under a PR event; a fork's
          # head and every other event still take a standard image.
          REVIEW_FILES = {"code-review.yml", "code-review.yaml"}
          SEL_OUT = {"needs.preflight.outputs.runner": "bigdisk",
                     "needs.preflight.outputs.runner_docker": "bigdisk-docker"}
          OVERFLOW = [["self-hosted", "linux", "x64", v] for v in SEL_OUT.values()]
          # v1.49 (ruling 1047 (3)): ci.yml's preflight job alone may read the
          # repository variable CI_PREFLIGHT_RUNS_ON. Its runs-on is checked in
          # two states of its own, in place of the selection's: unset, where
          # exactly [self-hosted, linux, x64, bigdisk] passes too, and set to the
          # fallback `"ubuntu-latest"`, where it must give a standard image on
          # every event. Another job that reads the variable reads an unknown.
          PRE_JOB = "preflight"
          PRE_VAR = "vars.ci_preflight_runs_on"
          PRE_READ = re.compile(r"(?<![\w.])vars\.CI_PREFLIGHT_RUNS_ON(?![\w-])", re.I)
          HOSTED_CTX = [  # (event, ref, head repo) on github.com; o/r is this repository
              ("push", "refs/heads/main", None), ("push", "refs/heads/feature", None),
              ("pull_request", "refs/pull/1/merge", "o/r"), ("pull_request", "refs/pull/1/merge", "fork/r"),
              ("workflow_dispatch", "refs/heads/main", None), ("schedule", "refs/heads/main", None),
              # v1.51: the base-defined PR event code-review.yml and signatures.yml run on.
              ("pull_request_target", "refs/heads/main", "o/r"), ("pull_request_target", "refs/heads/main", "fork/r"),
          ]


          def hosted_ctx(text):
              # #613 round 6 sweep: like release_runs for a job's `if`, a runs-on is
              # tried on every branch and tag a string in it names, not only on
              # HOSTED_CTX's main and feature (`github.ref_name == 'develop' && ...`).
              ctxs = list(HOSTED_CTX)
              for s in sorted({m.replace("''", "'") for m in re.findall(r"'((?:[^']|'')*)'", text)}):
                  if not s or s.startswith("refs/pull/"):
                      continue
                  refs = [s] if s.startswith(("refs/heads/", "refs/tags/")) else ["refs/heads/" + s, "refs/tags/" + s]
                  for ref in refs:
                      for ev in ("push", "workflow_dispatch"):
                          if (ev, ref, None) not in ctxs:
                              ctxs.append((ev, ref, None))
              return ctxs


          def hosted_get(ev, ref, head, sel=None):
              def get(path):
                  p = path.lower()
                  if sel and p in SEL_OUT:  # v1.48: the selection output, as JSON text
                      # v1.52: the step outputs the hosted default for a fork's head under pull_request.
                      fork_pr = ev == "pull_request" and head == "fork/r"
                      return json.dumps("ubuntu-latest" if sel == "default" or fork_pr else ["self-hosted", "linux", "x64", SEL_OUT[p]])
                  if sel in ("unset", "set") and p == PRE_VAR:  # v1.49: unset, or the fallback switch
                      return None if sel == "unset" else json.dumps("ubuntu-latest")
                  if p == "github.server_url":
                      return GH
                  if p == "github.repository":
                      return "o/r"
                  if p == "github.event.pull_request.head.repo.full_name":
                      return head if ev in PR else None
                  if p == "github.event.pull_request.draft":
                      return False if ev in PR else None
                  return ctx_get(ev, ref, path)
              return get


          def labels(value):
              # A runs-on value's labels: a string, a list, or an expression's result.
              if value is U or value is None:
                  return None
              if isinstance(value, list):
                  return [str(x) for x in value]
              return [str(value)]


          def runs_on_labels(text, ev, ref, head, sel=None):
              t = text.strip()
              if t.startswith("group:") or t.startswith("labels:") or " labels:" in t:
                  m = re.search(r"labels:\s*(\[[^\]]*\]|\S+)", t)
                  t = m.group(1) if m else ""
              m = re.fullmatch(r"\$\{\{(.*)\}\}", unquote(t), re.S)
              if m:
                  return labels(P(lex(m.group(1)), hosted_get(ev, ref, head, sel)).parse())
              if t.startswith("["):
                  return [unquote(x) for x in re.split(r"\s*,\s*", t.strip("[] ")) if x]
              if t.startswith("- "):
                  return [unquote(x) for x in re.split(r"\s*-\s+", " " + t) if x.strip()]
              return [unquote(t)]


          def review_labels(text):
              # The review-only labels a runs-on names, in its text or in what an
              # expression there yields on any github.com event.
              found = {m.lower() for m in REVIEW_TOKEN.findall(text)}
              for ev, ref, head in hosted_ctx(text):
                  try:
                      got = runs_on_labels(text, ev, ref, head)
                  except ValueError:
                      continue
                  found |= {g.lower() for g in got or [] if g.lower() in REVIEW}
              return sorted(found)


          def review_finding(path, where, ro, ro_line):
              # v1.47 (ruling 1007): label and category together, whatever the waiver says.
              names = review_labels(ro)
              m = WAIVER.search(ro_line)
              cat = m.group(1) if m else None
              base = path.replace("\\", "/").rsplit("/", 1)[-1]
              if names and base not in REVIEW_FILES:
                  return (f"{where}: (f) names the review-only label {', '.join(names)}; ruling 1007 reserves codex and "
                          f"qwen to code-review.yml whatever the `# self-hosted:` waiver says")
              if names:
                  wrong = [n for n in names if cat != REVIEW[n]]
                  if len(names) > 1 or wrong:
                      return (f"{where}: (f) runs on {', '.join(names)} with the category {cat or 'none'}; ruling 1007 pairs "
                              f"codex with `credential:` and qwen with `hardware:`, one review label per job")
                  return None
              if cat == "credential":
                  return (f"{where}: (f) uses the `credential:` category without the codex label; ruling 1007 keeps it "
                          f"for code-review.yml's Codex review job alone")
              return None


          def names_release(text):
              return re.search(r"(?<![\w.-])['\"]?release['\"]?(?![\w-])", text) is not None


          def sels_of(path, job, ro):
              if path.replace("\\", "/").rsplit("/", 1)[-1] not in SEL_FILES:
                  return (None,)
              if job == PRE_JOB and PRE_READ.search(ro):
                  return ("unset", "set")  # v1.49: its own two states, no selection output
              return ("default", "overflow")


          def may_be_release(path, job, ro):
              # v1.49 (#613): a runs-on whose value this step cannot know on some
              # github.com event (`vars.CI_RUNNER || 'ubuntu-latest'`) may name any
              # runner, `release` too, though its text names none. Codex round 4 (#613): so
              # does one that evaluates to `release` (`format('{0}{1}', 're', 'lease')`).
              for ev, ref, head in hosted_ctx(ro):
                  for sel in sels_of(path, job, ro):
                      try:
                          got = runs_on_labels(ro, ev, ref, head, sel)
                      except ValueError:
                          return True
                      if got is None or any(names_release(label) for label in got):
                          return True
              return False


          def condition(text):
              t = unquote(text) if text else ""
              m = re.fullmatch(r"\s*\$\{\{(.*)\}\}\s*", t, re.S)
              if m and OPEN not in m.group(1):
                  return m.group(1)
              if OPEN in t:
                  raise ValueError("text around the expression makes it a string, which is always true")
              return t


          def check(path):
              lines = open(path, encoding="utf-8").read().splitlines()
              on = triggers(lines)
              bad = []
              for i, s in enumerate(lines):
                  if re.match(r"jobs\s*:\s*(#.*)?$", s):
                      for j, job, _ in keys_under(lines, i):
                          ro = cond = ro_line = None
                          for k, key, inline in keys_under(lines, j):
                              if key == "runs-on":
                                  ro, ro_line = body(lines, k, inline), lines[k]
                              elif key == "if":
                                  cond = body(lines, k, inline)
                          where = f"{path}:{job}"
                          if ro is not None and not names_release(ro):
                              # v1.43 (ruling 833): hosted first.
                              if LARGER.search(ro) and re.search(r"ubuntu|windows|macos", ro):
                                  bad.append(f"{where}: (d) names a larger GitHub-hosted runner ({ro}); it bills on a public repository")
                                  continue
                              rf = review_finding(path, where, ro, ro_line)
                              if rf:
                                  bad.append(rf)
                                  continue
                              if WAIVER.search(ro_line):
                                  if not may_be_release(path, job, ro):
                                      continue
                                  # v1.49 (#613): a waived runs-on whose value is unknown, or
                                  # (round 4) evaluates to `release`, is checked as one below.
                              else:
                                  off = []
                                  for ev, ref, head in hosted_ctx(ro):
                                      # v1.51: under pull_request_target, a fork's head never
                                      # reaches a self-hosted runner, overflow or not.
                                      # v1.52: under pull_request too.
                                      fork_target = ev in PR and head == "fork/r" and ev in on
                                      for sel in sels_of(path, job, ro):
                                          try:
                                              got = runs_on_labels(ro, ev, ref, head, sel)
                                          except ValueError as e:
                                              off.append(f"{ev} ({ref}): cannot be read ({e})")
                                              continue
                                          if got is not None and sel == "overflow" and got in OVERFLOW and not fork_target:
                                              continue
                                          if sel == "unset" and got == OVERFLOW[0] and not fork_target:
                                              continue
                                          if (sel is None and got == OVERFLOW[0] and ev in PR and head == "o/r"
                                                  and path.replace("\\", "/").rsplit("/", 1)[-1] in REVIEW_FILES):
                                              continue  # v1.53: a same-repository head's review guard
                                          if got is None or len(got) != 1 or not STANDARD.fullmatch(got[0]):
                                              what = "an unknown label" if got is None else ", ".join(got)
                                              note = ", runner selection overflow" if sel == "overflow" else ""
                                              if sel in ("unset", "set"):
                                                  note = ", CI_PREFLIGHT_RUNS_ON " + ("unset" if sel == "unset" else 'set to "ubuntu-latest"')
                                              if fork_target and got is not None:
                                                  note += f", {ev}: a fork never reaches a self-hosted runner"
                                              off.append(f"{ev} ({ref}{', fork' if head == 'fork/r' else ''}{note}): {what}")
                                  if off and BARE.search(ro_line):
                                      bad.append(f"{where}: (e) its `# self-hosted:` reason names no category; ruling 999 allows a self-hosted job "
                                                 f"only as `# self-hosted: hardware: <reason>` or `# self-hosted: oversize: <reason>`; it runs on " + "; ".join(dict.fromkeys(off)))
                                  elif off:
                                      bad.append(f"{where}: (c) does not run on a standard GitHub-hosted image on github.com and its runs-on "
                                                 f"line gives no `# self-hosted: hardware|oversize: <reason>`; it runs on " + "; ".join(dict.fromkeys(off)))
                                  continue
                          if ro is None:
                              continue
                          if cond is None:
                              if on & PR:
                                  bad.append(f"{where}: (a) names `release` in a workflow with a pull_request trigger, and has no `if:`")
                              bad.append(f"{where}: (b) names `release` and has no `if:` restricting it to {ALLOWED}")
                              continue
                          try:
                              expr = condition(cond)
                              toks = lex(expr)
                              runs = release_runs(toks)
                          except ValueError as e:
                              bad.append(f"{where}: (b) names `release` and its `if:` cannot be read ({e})")
                              continue
                          pr = [c for c in runs if c[0] in PR and c[0] in on]
                          if pr:
                              bad.append(f"{where}: (a) names `release` and a {pr[0][0]} event can run it")
                          rest = [c for c in runs if c not in pr]
                          if rest:
                              bad.append(f"{where}: (b) names `release` and its `if:` does not restrict it to {ALLOWED}; it can run on "
                                         + ", ".join(dict.fromkeys(f"{ev} ({ref})" for ev, ref in rest)))
              return bad


          files = sorted(glob.glob(".github/workflows/*.yml") + glob.glob(".github/workflows/*.yaml"))
          bad = []
          for f in files:
              try:
                  bad += check(f)
              except (OSError, UnicodeError) as e:
                  bad.append(f"{f}: cannot be read ({e})")
          for b in bad:
              print(f"::error::{b}")
          if bad:
              print(f"{len(bad)} runner-label finding(s) in {len(files)} workflow file(s): a `release` job runs only on {ALLOWED}, never for a pull request (ruling 633); every other job runs on a standard GitHub-hosted image, or its runs-on line names a hardware or oversize reason (rulings 833, 999); codex and qwen run only in code-review.yml, with their own category (ruling 1007)")
              sys.exit(1)
          print(f"OK: {len(files)} workflow file(s); every job that names `release` runs only on {ALLOWED}, and every other job on a standard GitHub-hosted image or with a hardware or oversize reason")
          PY

      - name: Is every changed file docs or markdown?
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          # v1.30: lint_gates is false only on a PR whose changed files all
          # miss LINT_GATES_PATTERN; any doubt runs the job. v1.41: a ci:full
          # PR keeps both scopes off (CI_FULL_LABEL; CI_FULL_TIER is true on
          # every PR now).
          docs_only=false lint_gates=true
          if [ "$EVENT" = pull_request ] && [ "$CI_FULL_LABEL" != true ]; then
            if files=$(git diff --name-only --no-renames "$BASE...$HEAD") && [ -n "$files" ]; then
              if ! printf '%s\n' "$files" | grep -qvE "$DOCS_ONLY_PATTERN"; then
                docs_only=true
              fi
              printf '%s\n' "$files" | grep -qE "$LINT_GATES_PATTERN" || lint_gates=false
              printf '%s\n' "$files"
            fi
          fi
          echo "docs only: $docs_only; lint-gates: $lint_gates"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "lint_gates=$lint_gates" >> "$GITHUB_OUTPUT"

      # CUSTOMIZE (trusted-firmware, ruling 218(9)): the ESP32 job (43 min on
      # the critical path of #256's 122-minute run) runs on a PR only when the
      # PR changes a file the ESP32 build or its QEMU test reads, and otherwise
      # on a push to main (ruling 219(5)) and in the nightly tier (schedule,
      # workflow_dispatch). Ruling 220(j) split it: this output gates the
      # esp32-build job alone, and the esp32-qemu-test job runs on no PR.
      # ESP32_PATHS is what
      # mk/arch/esp32-targets.mk's esp32-build and esp32-qemu-test read: FW_SRCS
      # (src/, src/hal/esp32), layer 0's component (boot/, boot/hal/esp32),
      # include/, the ESP32 boards, the make files and the IDF project
      # (mk/arch/esp32), tfwprov (sdk/go), suit-emit (tools/suit-emit), the
      # QEMU harness and wirecheck (test/integration/esp32), the esp32 image's
      # inputs (mk/docker.mk ESP32_INPUTS) and the scripts and workflow the job
      # runs. ESP32_PATHS_EXCLUDE takes out the other arches' HALs and make
      # files, which no ESP32 build reads, and markdown. A failed diff fails
      # this job, and the CI Gate with it.
      - name: Does any changed file feed the ESP32 build?
        id: esp32
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT: ${{ github.event_name }}
          ESP32_PATHS: '^(src/|boot/|include/|boards/esp32|mk/|Makefile$|sdk/go/|tools/suit-emit/|test/integration/esp32/|xkms/go\.(mod|sum)$|build/docker/devcontainer/|scripts/(tool-pins|in-toolchain-image|ci-registry-login|ensure-image)\.sh$|\.github/workflows/ci\.yml$)'
          ESP32_PATHS_EXCLUDE: '^(src/hal/(avr|cortex-m)/|boot/hal/(avr|cortex-m|host)/|mk/arch/(avr|cortex-m))|\.md$'
        run: |
          esp32=false
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only --no-renames "$BASE...$HEAD")
            if printf '%s\n' "$files" | grep -vE "$ESP32_PATHS_EXCLUDE" | grep -qE "$ESP32_PATHS"; then
              esp32=true
            fi
          fi
          echo "ESP32 paths changed: $esp32"
          echo "esp32=$esp32" >> "$GITHUB_OUTPUT"

      # CUSTOMIZE (trusted-firmware, #253 slice 4; modelled on the ESP32 step
      # above, rulings 218(9), 219(5)): the OP-TEE jobs (optee-stack builds or
      # finds the pinned stack, then optee runs xtest and tfw-ta-check in the
      # guest) run on a PR only when the PR changes a file they test, or the
      # PR is labelled ci:full; otherwise a push to main and the nightly tier
      # run them.
      # OPTEE_PATHS: the TA and the check (optee/), the pin and the targets
      # (mk/optee.mk), the design page (docs/optee-trustzone/), the guest
      # runner (scripts/optee_run.py), the optee image's inputs (mk/docker.mk
      # OPTEE_IMAGE_INPUTS) and the script and workflow the job runs. A failed
      # diff fails this job, and the CI Gate with it.
      - name: Does any changed file feed the OP-TEE job?
        id: optee
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT: ${{ github.event_name }}
          OPTEE_PATHS: '^(optee/|mk/optee\.mk$|docs/optee-trustzone/|scripts/optee_run\.py$|mk/docker\.mk$|build/docker/devcontainer/Dockerfile$|docker/packages\.txt$|scripts/(tool-pins|in-toolchain-image|ci-registry-login|ensure-image)\.sh$|\.github/workflows/ci\.yml$)'
        run: |
          optee=false
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only --no-renames "$BASE...$HEAD")
            # v1.41: CI_FULL_TIER is true on every PR; ci:full is CI_FULL_LABEL.
            if [ "$CI_FULL_LABEL" = true ] || printf '%s\n' "$files" | grep -qE "$OPTEE_PATHS"; then
              optee=true
            fi
          fi
          echo "OP-TEE paths changed or ci:full: $optee"
          echo "optee=$optee" >> "$GITHUB_OUTPUT"

      # Architecture gate (v1.20, Company Agent m270 item 9; go-xkms arch-gates).
      # go-objstore owns every blob backend (docs/00), and a repo reaches it only
      # through the packages that are its storage seam. Test files are exempt, and
      # go-objstore itself passes. CUSTOMIZE: OBJSTORE_SEAMS, an extended regex of
      # the paths that may import go-objstore (go-xkms: 'pkg/ca/|pkg/storage/');
      # empty means none may. CUSTOMIZE: the repo's own layering rules (go-xkms:
      # xkmsctl and xkey depend only on sdk/go) are further steps in this job.
      # A source check with grep, not a stage: it runs on the runner's shell.
      # v1.23: a lint-class check, so it stays on the PR tier. v1.34: it reads
      # the tree of the one checkout above, and needs no credential.
      - name: No direct go-objstore import outside the storage seam
        env:
          OBJSTORE_SEAMS: ''      # CUSTOMIZE
        run: |
          if [ "$(sed -n 's/^module //p' go.mod)" = github.com/jeremyhahn/go-objstore ]; then
            echo "OK: this is go-objstore"; exit 0
          fi
          hits=$(grep -rln --include='*.go' '"github.com/jeremyhahn/go-objstore' . \
                 | grep -v '_test\.go$' \
                 | { if [ -n "$OBJSTORE_SEAMS" ]; then grep -vE "$OBJSTORE_SEAMS"; else cat; fi; } || true)
          if [ -n "$hits" ]; then
            echo "go-objstore may be imported only in the storage seam (OBJSTORE_SEAMS='$OBJSTORE_SEAMS'):"
            echo "$hits"; exit 1
          fi
          echo "OK: no go-objstore import outside the storage seam"

  # v1.21: every stage runs in the project's own devcontainer image and no
  # other (ci-standard.md §2, devcontainer.md §7). One image job (Company Agent
  # m601 (a)) builds the images once from build/docker/devcontainer/Dockerfile
  # at this commit (`make docker-build`) and runs each stage's `make` target in
  # the toolchain image as its own step, through scripts/in-toolchain-image.sh
  # (ships beside this file), which copies the checkout into the container: a
  # runner reaches its daemon through a socket, so a bind mount would resolve
  # on the daemon's host. A failed step names its stage; `if: !cancelled()`
  # runs every stage after a failed one, so one run reports them all.
  #
  # No job installs a Go toolchain or a tool on the runner: the image's pin file
  # (devcontainer.md §2) decides every version, and the Makefile carries every
  # flag set (devops.md §4; §8: CI runs gosec through the developers' target).
  # GO_BUILD_TAGS reaches every target as a make variable, so the tag set is
  # still written once. build, test and lint run with no network, on the
  # image's module cache; security and deps-check get one (IN_IMAGE_NETWORK=
  # bridge) for the vulnerability databases and the module proxy.
  #
  # v1.23: lint, assert-build-tags, build and coverage are the PR tier and run
  # on every event. security and trivy image are full tier only
  # (env.CI_FULL_TIER): main after every merge, nightly, dispatch, ci:full.
  # v1.28: deps-check is a lint-class gate on the PR tier and runs on every
  # event (ruling 219(3)).
  #
  # v1.22: every stage mounts the build and golangci-lint cache volumes, and a
  # bridge stage the module cache volume, from the runner's Docker host
  # (in-toolchain-image.sh v2, ci-standard.md §6), so a stage writes its
  # caches there and not into its container's layer.
  #
  # DS-7400 (CA m2066): no module credential reaches the image build. Every
  # module it fetches is public and comes through the public Go proxy. No step
  # and no make target prints the job environment (`env`, `printenv`,
  # `set -x`), and lint steps and `make check-public-literals` report path and
  # line only (ci-standard.md §5, Company Agent m605 item 8).
  #
  # Runners (owner ruling 999; DS-7400, CA m2066): every job runs on
  # ubuntu-latest, the GitHub standard hosted runner, which has Docker. A job
  # goes self-hosted only for hardware or a measured hosted limit (disk, memory,
  # 6 h) recorded beside its runs-on line; none does: the longest leg is 40 min,
  # and each Docker job frees disk first. Larger hosted runners stay out.
  image:
    # CUSTOMIZE (trusted-firmware, owner m751 (d), ci-standard.md §10 (d)): this
    # job builds the run's images once and runs the short stages; the long
    # stages are the legs below, each `needs: image`, run side by side.
    name: Devcontainer image [lint, build]
    runs-on: ${{ github.server_url == 'https://github.com' && fromJSON(needs.preflight.outputs.runner_docker) || 'bigdisk' }}   # v1.48
    needs: preflight   # v1.24 (CA m749, m751 (a)); v1.29.3; v1.34
    # v1.29.3: on a schedule run, only on the schedule guard's `run`.
    if: ${{ !github.event.pull_request.draft && needs.preflight.outputs.verdict == 'run' }}   # v1.26
    # CUSTOMIZE: give the stages honest headroom. A cold BuildKit cache builds
    # the three images in 55 min (run 55218); a warm one reuses them. Then lint
    # and build ~2, the module and cross-arch loops ~6 and trivy image ~5 (run
    # 245908: start to the end of the loops 30 min, warm). 55 + 13 = 68, plus
    # margin. The Cortex-M steps add ~3 (#161): 71. The legs' budgets are on
    # the legs.
    timeout-minutes: 90
    # CUSTOMIZE (trusted-firmware, m751 (d)): the legs run when the images are
    # built, whatever the short stages after them did.
    outputs:
      built: ${{ steps.images.outputs.built }}
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      # v1.22: the cache volumes' trust class. Only a push to main writes the
      # caches main's build reads; every other event, pull requests included,
      # gets the `pr` set (ci-standard.md §6). v1.23: the nightly schedule runs
      # on main, so it writes main's set too.
      CI_CACHE_CLASS: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'main' || 'pr' }}
      # CUSTOMIZE (trusted-firmware, Company Agent m644): the toolchain and
      # esp32 images are tagged by a hash of their inputs (mk/docker.mk) and
      # reused across runs and jobs. IMAGE_CLASS is the trust class as a tag
      # suffix: a pull request reads main's images and writes only `pr` ones.
      # A build goes to a per-run tag first (IMAGE_BUILD_ID), so two runs
      # building one hash on one daemon never export to the same name at once.
      IMAGE_CLASS: ${{ github.event_name == 'push' && 'main' || 'pr' }}
      IMAGE_TRUSTED_CLASS: ${{ github.event_name != 'push' && 'main' || '' }}
      IMAGE_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # v1.21.1 (Company Agent m605 item 8): mask the forge credentials before
      # any other step. The runner injects them as plain environment
      # (dependency-resolution.md §6), which the log does not mask by itself,
      # and the token sits inside GIT_CONFIG_KEY_0's URL, so it is masked alone
      # as well.
      - name: Free hosted runner disk
        if: ${{ runner.environment == 'github-hosted' }}   # v1.48: overflow runs on the Dells
        # Owner ruling 999: ubuntu-latest leaves about 14 GB free on /; the
        # devcontainer images this job builds or pulls need more, so drop the
        # preinstalled toolchains no job here uses instead of a self-hosted host.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker image prune --all --force > /dev/null
          df -h /
      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      # Ruling 887: the LAN addresses this runner's environment names, masked
      # before any step that builds can print one.
      - name: Mask the LAN addresses
        env:
          # v1.53: a registry a later step takes from `vars` is masked here.
          # CUSTOMIZE: one VARS_<NAME> line per vars.<NAME> ending in _REGISTRY
          # that this job reads (testdata/ci-mask-lan-tests.py M1 to M3).
          VARS_CI_IMAGE_REGISTRY: ${{ vars.CI_IMAGE_REGISTRY }}
        run: scripts/ci-mask-lan.sh

      - name: Reap stale CI stacks
        run: scripts/reap-stale-ci-stacks.sh "$CI_STACK_PREFIX"

      # v1.23 (Company Agent m674 item 3, 2026-10-18): the integration image is named by its content,
      # <repo>-ci-it:<hash> (`make -s it-image`, ci-standard.md §9), so every
      # job of every run on this runner names the same image for the same
      # tree, builds it once and reuses it. No job removes it; the reap step does.
      - name: Name the integration image
        run: echo "IT_IMAGE=$(make -s it-image)" >> "$GITHUB_ENV"

      # CUSTOMIZE: host tuning a test needs (e.g. QUIC UDP buffers:
      # sudo sysctl -w net.core.rmem_max=7340032 net.core.wmem_max=7340032)
      # goes here; the container shares the runner's kernel.

      # CUSTOMIZE (trusted-firmware, Company Agent m644): the forge's
      # container registry, from github.server_url, holds the hash-tagged
      # images and their cache; the forge credentials log in to it when they
      # are for its host (none on the github.com mirror).
      - name: Log in to the forge registry
        run: scripts/ci-registry-login.sh

      # CUSTOMIZE (trusted-firmware, Company Agent m644): `make docker-images`
      # reuses the toolchain and esp32 images by hash, from the daemon, then
      # the registry, and builds (and pushes) only when both miss
      # (scripts/ensure-image.sh). The integration image is named by its tree
      # (`make -s it-image`, v1.23) and builds only when the daemon lacks it,
      # with the toolchain image as its cache, so only its source layers build.
      # The legs start on `built`, set once all three images are on hand.
      # CUSTOMIZE (trusted-firmware, DS-3166): a docs-only PR runs `make lint`
      # alone here, which needs only the toolchain image (cppcheck), so it
      # builds no esp32 or integration image and never writes `built`: the
      # four legs skip, and the gate reads them as `docs`. A failed `preflight`
      # job leaves DOCS_ONLY empty, which reads as not docs-only.
      - name: Build the devcontainer images
        id: images
        env:
          DOCS_ONLY: ${{ needs.preflight.outputs.docs_only }} # CUSTOMIZE (trusted-firmware, DS-3166)
        run: |
          # v1.29.4 and v1.29.5: Athens first when the runner sets DEVCACHE_GOPROXY
          # and the cache answers, `|` so any error falls through to the public
          # proxy; "$bp" is one quoted make argument and the Makefile quotes it.
          bp=
          if [ -n "${DEVCACHE_GOPROXY:-}" ] && curl -s -o /dev/null --max-time 5 "$DEVCACHE_GOPROXY/"; then
            bp="GO_BUILD_PROXY=$DEVCACHE_GOPROXY|https://proxy.golang.org"
          fi
          if [ "$DOCS_ONLY" = true ]; then # CUSTOMIZE (trusted-firmware, DS-3166)
            make docker-image-toolchain ${bp:+"$bp"}
          else
            make docker-images ${bp:+"$bp"}
            make docker-build-it ${bp:+"$bp"} IT_IMAGE="$IT_IMAGE"
          fi
          echo "TOOLCHAIN_IMAGE=$(make -s toolchain-image)" >> "$GITHUB_ENV"
          echo "ESP32_IMAGE=$(make -s esp32-image)" >> "$GITHUB_ENV" # CUSTOMIZE: the esp32 stages
          if [ "$DOCS_ONLY" != true ]; then # CUSTOMIZE (trusted-firmware, DS-3166)
            echo "built=true" >> "$GITHUB_OUTPUT" # CUSTOMIZE: the legs' start
          fi

      # Ruling 901: the images the job built or pulled carry no private address in their history or
      # config, checked after the build and before any use, on a pool runner.
      # CUSTOMIZE (trusted-firmware, DS-3166): a docs-only PR builds only the
      # toolchain image (as in the images step), so only it is checked; the
      # esp32 and integration images are named but absent, and
      # ci-image-history.sh fails on an image it cannot inspect (#613).
      - name: Check the images carry no private address
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && runner.environment != 'github-hosted' }}
        env:
          DOCS_ONLY: ${{ needs.preflight.outputs.docs_only }} # CUSTOMIZE (trusted-firmware, DS-3166)
        run: |
          if [ "$DOCS_ONLY" = true ]; then # CUSTOMIZE (trusted-firmware, DS-3166)
            scripts/ci-image-history.sh "$TOOLCHAIN_IMAGE"
          else
            scripts/ci-image-history.sh "$TOOLCHAIN_IMAGE" ${ESP32_IMAGE:+"$ESP32_IMAGE"} ${IT_IMAGE:+"$IT_IMAGE"}
          fi

      # v1.23: a lease on the integration image (from a Codex review). A
      # reused image can be older than REAP_IMAGE_MIN_AGE, so its age alone
      # does not keep another run's reap step off it while this job needs it.
      # A created, never-started container that names the image holds it,
      # because `docker image rm` refuses an image a container uses. Tear down
      # removes the lease; one a dead job leaves behind is a stale container,
      # which the reap step removes after the job timeout like any other.
      # CUSTOMIZE (trusted-firmware, DS-3166): a docs-only PR builds no
      # integration image, so it takes no lease; Tear down's `docker rm` is
      # then a no-op on the empty IT_LEASE.
      - name: Lease the integration image
        if: ${{ needs.preflight.outputs.docs_only != 'true' }}
        run: |
          lease="${CI_STACK_PREFIX}lease-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$(od -An -N4 -tx1 /dev/urandom | tr -d ' \n')"
          # v1.25.3: the daemon's image lock, shared with the reaper (v5) and
          # every re-tag. The next steps source these from image-lock.sh.
          image_lock() {
            local lock="${CI_STACK_PREFIX}image-lock" held at t i
            for ((i = 0; i < 660; i++)); do
              docker image inspect "$lock:base" >/dev/null 2>&1 ||
                head -c 1024 /dev/zero | docker import - "$lock:base" >/dev/null 2>&1 || true
              IMAGE_LOCK_ID=$(docker create --pull never --name "$lock" "$lock:base" true 2>/dev/null) && return 0
              IMAGE_LOCK_ID=
              if read -r held at < <(docker inspect -f '{{.Id}} {{.Created}}' "$lock" 2>/dev/null) &&
                t=$(date -d "$at" +%s 2>/dev/null) && [ $(($(date +%s) - t)) -ge 600 ]; then
                echo "removing the stale image lock $lock (created $at)"
                docker rm "$held" >/dev/null 2>&1 || true
                continue
              fi
              sleep 1
            done
            echo "::error::the image lock $lock was not free within 660 s"
            return 1
          }
          image_unlock() {
            [ -z "${IMAGE_LOCK_ID:-}" ] || docker rm "$IMAGE_LOCK_ID" >/dev/null 2>&1 || true
            IMAGE_LOCK_ID=
          }
          declare -f image_lock image_unlock > "$RUNNER_TEMP/image-lock.sh"
          trap image_unlock EXIT
          # v1.25.2: the lease holds the image id; IT_LEASE_ID carries it to the
          # re-tags. This file has no v1.25.1 rebuild, so a missing image still
          # takes no lease (and the re-tags then do nothing).
          image_lock || exit 1
          if id=$(docker image inspect -f '{{.Id}}' "$IT_IMAGE" 2>/dev/null) &&
            docker create --pull never --name "$lease" "$id" true >/dev/null; then
            echo "IT_LEASE=$lease" >> "$GITHUB_ENV"
            echo "IT_LEASE_ID=$id" >> "$GITHUB_ENV"
          fi
          image_unlock

      # v1.22: bound this repo's cache volumes on the host before the stages
      # add to them (ci-standard.md §6). It never fails the job.
      - name: Trim the CI caches
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: scripts/trim-ci-caches.sh "$CI_STACK_PREFIX" "$TOOLCHAIN_IMAGE"

      # CUSTOMIZE (trusted-firmware, Company Agent m644): no job removes a
      # hash-tagged image, since other runs share it; this keeps the newest
      # three hashes of each on the host. It never fails the job.
      - name: Trim the devcontainer images
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: scripts/trim-ci-images.sh "$TOOLCHAIN_IMAGE" "$ESP32_IMAGE"

      # make lint: gofmt, vet, golangci-lint, actionlint with shellcheck
      # (devops.md §4). .golangci.yml enables staticcheck, errcheck, unused,
      # ineffassign, misspell and gocritic (devops.md §8).
      # CUSTOMIZE (trusted-firmware): this repo's `make lint` is the C
      # firmware's (cppcheck, the preprocessor-confinement and __DATE__ greps,
      # the arch-leak gate). The Go modules' gofmt, vet and golangci-lint run in
      # `make security` (sdk-lint, go-vet, go-golangci, xkms-security) and in
      # the module step below.
      - name: make lint
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make lint GO_BUILD_TAGS='$GO_BUILD_TAGS'"

      # v1.42 (ruling 742 (1)): `make deps-check` left this job. It asks
      # upstream for the latest releases, so its answer changes with no change
      # to the tree; scans.yml runs it on main. Ruling 742 (1) supersedes the
      # Software Department's #981 rule that made it block a PR changing xkms/go.mod
      # or xkms/go.sum: xkms-security (the Security job) checks that module's
      # consistency offline on every PR instead.

      # v1.26.1: a docs-only PR skips `make security`, which runs the
      # releasability gate on every other PR, so it runs here: a private
      # value in README.md or docs/ fails the PR, not the main push after it.
      - name: make releasability (docs-only PR)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && needs.preflight.outputs.docs_only == 'true' }}
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make releasability"

      # v1.9.2, now in the image: the declared tag set must select code. Each
      # tag is checked by removal: if dropping it changes no selected file
      # (tests included), it is misspelled or dead. Compares files, not
      # packages, and a tag may swap files (a `!foo` stub for a `foo` body).
      - name: Assert every build tag selects code
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && env.GO_BUILD_TAGS != '' && needs.preflight.outputs.docs_only != 'true' }}
        # CUSTOMIZE: no root module; the tag is xkms/'s, so it is asserted there.
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "cd xkms && GO_BUILD_TAGS='$GO_BUILD_TAGS' sh ../scripts/assert-build-tags.sh"

      # CUSTOMIZE: nested modules (sdk/go, xkey) and variants (FIPS) are built
      # by `make build` itself, never by an extra step here.
      - name: make build
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && needs.preflight.outputs.docs_only != 'true' }}
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make build GO_BUILD_TAGS='$GO_BUILD_TAGS'"

      # CUSTOMIZE (trusted-firmware): no root module. sdk/go,
      # test/integration/esp32 (which replaces sdk/go) and xkms/ (which
      # requires it by tag) are separate Go modules, so an sdk/go change can
      # break them, and `make build` builds sdk/go alone. Every module is
      # discovered, not declared, so a new go.mod is enrolled automatically, and
      # MODULE_FLOOR fails the step if discovery comes back short. gofmt, build
      # and vet with -tags codec_json, xkms/'s tag (it selects nothing
      # elsewhere); -o /dev/null because test/integration/esp32 has a main
      # package beside a directory of the same name. The suites need tfwsim and
      # run in the test stage and the integration job. The network fetches the
      # modules the image's cache does not carry.
      - name: Build and vet every Go module
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && needs.preflight.outputs.docs_only != 'true' }} # CUSTOMIZE (trusted-firmware, DS-3166)
        env:
          IN_IMAGE_NETWORK: bridge
          MODULES_SCRIPT: |
            set -eu
            export GOWORK=off
            MODULE_FLOOR=3
            MODULES=$(find . -mindepth 1 -type d \( -name '.*' -o -name '_*' -o -name testdata \) -prune -o -name go.mod -printf '%h\n' | sort)
            COUNT=$(printf '%s\n' "$MODULES" | grep -c . || true)
            echo "Discovered $COUNT module(s):"; printf '%s\n' "$MODULES"
            if [ "$COUNT" -lt "$MODULE_FLOOR" ]; then
              echo "FAIL: discovered $COUNT modules but expected at least $MODULE_FLOOR."
              echo "If a module was removed on purpose, lower MODULE_FLOOR in the same commit."
              exit 1
            fi
            FAILED=
            for dir in $MODULES; do
              echo "--- $dir"
              if ! (cd "$dir" && u=$(gofmt -l .) && { [ -z "$u" ] || { echo "not gofmt-formatted:"; echo "$u"; false; }; } \
                    && go build -o /dev/null -tags codec_json ./... && go vet -tags codec_json ./...); then
                FAILED="$FAILED $dir"
              fi
            done
            if [ -n "$FAILED" ]; then echo "FAIL: module(s) did not format, build or vet cleanly:$FAILED"; exit 1; fi
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "$MODULES_SCRIPT"

      # CUSTOMIZE (trusted-firmware): cross-architecture build. The other steps
      # run on linux/amd64; this catches what fails to compile or vet elsewhere:
      # arch- and OS-specific build tags, assembly, assumed type sizes,
      # non-portable syscalls. linux/arm64 is the second 64-bit production
      # target, linux/386 catches untyped constants that overflow int on 32-bit
      # (vet, so test files too), and windows, darwin and freebsd catch
      # Unix-only syscalls and build constraints. Cross-compiled: there is no
      # such runner, and QEMU would multiply every test's wall clock. xkms/ is
      # left out: its dependencies go-xkms (argon2, 386) and go-qrdb
      # (pkg/discovery, windows) do not build there, which is theirs to fix.
      - name: Cross-architecture build and vet
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && needs.preflight.outputs.docs_only != 'true' }} # CUSTOMIZE (trusted-firmware, DS-3166)
        env:
          IN_IMAGE_NETWORK: bridge
          CROSS_ARCH_SCRIPT: |
            set -eu
            export GOWORK=off
            MODULE_FLOOR=2
            MODULES=$(find . -mindepth 1 -type d \( -name '.*' -o -name '_*' -o -name testdata \) -prune -o -name go.mod -printf '%h\n' | grep -vx './xkms' | sort)
            COUNT=$(printf '%s\n' "$MODULES" | grep -c . || true)
            echo "Discovered $COUNT module(s):"; printf '%s\n' "$MODULES"
            if [ "$COUNT" -lt "$MODULE_FLOOR" ]; then
              echo "FAIL: discovered $COUNT modules but expected at least $MODULE_FLOOR."
              echo "If a module was removed on purpose, lower MODULE_FLOOR in the same commit."
              exit 1
            fi
            FAILED=
            for t in linux/arm64 linux/386 windows/amd64 darwin/arm64 freebsd/amd64; do
              for dir in $MODULES; do
                echo "--- $t $dir"
                if ! (export GOOS="${t%/*}" GOARCH="${t#*/}"; cd "$dir" && go build -o /dev/null ./... && go vet ./...); then
                  FAILED="$FAILED $t:$dir"
                fi
              done
            done
            if [ -n "$FAILED" ]; then echo "FAIL: build or vet failed in:$FAILED"; exit 1; fi
            echo "every module builds and vets for every target"
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "$CROSS_ARCH_SCRIPT"

      # CUSTOMIZE (trusted-firmware): the Cortex-M port (#161) on QEMU's
      # mps2-an505 (Cortex-M33) and mps2-an500 (Cortex-M7), in the toolchain
      # image, which carries the Arm toolchain and QEMU (docker/packages.txt).
      # Per board the application, then tfw-boot's one row on that board --
      # P-256 verified in software, never BOOT_SIG=none (m453) -- then the
      # suite that boots both on each: a signed image answers across a reset,
      # a tampered one and another key's stay silent.
      - name: make firmware BOARD=mps2-an505 (toolchain image)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && needs.preflight.outputs.docs_only != 'true' }} # CUSTOMIZE (trusted-firmware, DS-3166)
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" make firmware BOARD=mps2-an505 CRYPTO=soft

      - name: make bootloader BOARD=mps2-an505 (toolchain image)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && needs.preflight.outputs.docs_only != 'true' }} # CUSTOMIZE (trusted-firmware, DS-3166)
        run: >-
          scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" make bootloader BOARD=mps2-an505
          BOOT_TIER=soft BOOT_MEASURE=soft BOOT_SIG=p256-soft BOOT_OTA=0 BOOT_STORE=0

      - name: make firmware BOARD=mps2-an500 (toolchain image)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" make firmware BOARD=mps2-an500 CRYPTO=soft

      - name: make bootloader BOARD=mps2-an500 (toolchain image)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: >-
          scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" make bootloader BOARD=mps2-an500
          BOOT_TIER=soft BOOT_MEASURE=soft BOOT_SIG=p256-soft BOOT_OTA=0 BOOT_STORE=0

      # CUSTOMIZE (trusted-firmware): the STM32H573I-DK (#14), built as
      # mps2-an505 is and with its one tfw-boot row. QEMU models no STM32H5, so
      # no suite boots it; the host tests check its tables and arithmetic.
      - name: make firmware BOARD=stm32h573i-dk (toolchain image)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" make firmware BOARD=stm32h573i-dk CRYPTO=soft

      # CUSTOMIZE (trusted-firmware): its hardware tier, the PKA and HASH
      # provider (#544), so a missing include fails here and not on the bench
      # (#566).
      - name: make firmware BOARD=stm32h573i-dk CRYPTO=stm32h5 (toolchain image)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" make firmware BOARD=stm32h573i-dk CRYPTO=stm32h5

      - name: make bootloader BOARD=stm32h573i-dk (toolchain image)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: >-
          scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" make bootloader BOARD=stm32h573i-dk
          BOOT_TIER=soft BOOT_MEASURE=soft BOOT_SIG=p256-soft BOOT_OTA=0 BOOT_STORE=0

      - name: make integration-test-cortex-m (toolchain image)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && needs.preflight.outputs.docs_only != 'true' }} # CUSTOMIZE (trusted-firmware, DS-3166)
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" make integration-test-cortex-m

      # The tfwctl wire suite on both QEMU boards, through a pty and a QMP
      # reset (#163); its own step so a red wire row names itself apart from
      # a red boot.
      - name: make integration-test-cortex-m-wire (toolchain image)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" make integration-test-cortex-m-wire

      # CUSTOMIZE (trusted-firmware): the RP2350 board of the same port (row
      # rp2350), built and size-checked as mps2-an505's application is. No
      # emulator runs it; its tfw-boot row is in mk/boot.mk's BOOT_SUPPORTED.
      - name: make firmware BOARD=rp2350-pico2w (toolchain image)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" make firmware BOARD=rp2350-pico2w CRYPTO=soft

      # CUSTOMIZE (trusted-firmware): the nRF54L15 DK on the same port (#17),
      # the application only: tfw-boot on that part (RRAM writes, the KMU) is
      # a later slice, and no board is attached to CI, so nothing boots it.
      - name: make firmware BOARD=nrf54l15-dk (toolchain image)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" make firmware BOARD=nrf54l15-dk CRYPTO=soft

      # CUSTOMIZE (trusted-firmware): the second Cortex-M SoC, the MCXN947 on
      # the FRDM-MCXN947 (SPEC row mcxn947). The application only: QEMU models
      # no MCX part, and tfw-boot has no mcxn94x directory yet. Its own step,
      # so a red MCXN build names itself.
      - name: make firmware BOARD=frdm-mcxn947 (toolchain image)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" make firmware BOARD=frdm-mcxn947 CRYPTO=soft

      # CUSTOMIZE (trusted-firmware, owner m751 (d)): the test stage, sdk/go
      # under -race, make security-novuln, and the ESP32 stages are the legs
      # below. The Cortex-M steps above stay here: they run in the toolchain
      # image this job built.

      # v1.42 (ruling 742 (1)): `trivy image (integration image)` left this
      # job. It reads the advisory database, so its answer changes with no
      # change to the tree; scans.yml scans the integration image on main.

      - name: Tear down
        if: always()
        run: |
          rm -f it-image.tar
          [ -z "${IT_LEASE:-}" ] || docker rm "$IT_LEASE" >/dev/null || true
          # CUSTOMIZE (trusted-firmware, Company Agent m644): the registry
          # login. The hash-tagged images stay: other runs share them.
          rm -rf "$RUNNER_TEMP/docker-config"

      # v1.32 (2026-11-08, Company Agent m2098 item 2, InfoSec finding): the
      # internal-name gate. Its patterns are internal values, so they never
      # live in this repository: the Actions secret RELEASABILITY_PATTERNS
      # carries the private pattern file (source: the InfoSec Department's
      # internal-names pattern file). Blank
      # and `#` lines are skipped; every other line is `class<TAB>regex`, a
      # class of coord-host, internal-email, lab-address, lab-host or
      # owner-path (v1.33; an `/i` suffix is allowed) and a POSIX extended regex. A malformed line, an unknown
      # class or a regex grep -E refuses fails the step, which prints the line
      # number only. v1.31 grepped whole lines with -F, so no line matched and
      # the gate was green for a false reason. The step prints path and line
      # of a match, never the value. A run without the secret (a fork PR)
      # skips with a notice; a push to main without it fails.
      - name: Releasability (private patterns)
        if: ${{ !cancelled() }}
        env:
          RELEASABILITY_PATTERNS: ${{ secrets.RELEASABILITY_PATTERNS }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "$RELEASABILITY_PATTERNS" ]; then
            if [ "$EVENT" = push ]; then
              echo "::error::RELEASABILITY_PATTERNS is not set; the gate needs the private pattern file (public-hygiene.md)"
              exit 1
            fi
            echo "::notice::RELEASABILITY_PATTERNS is not available to this run; pushes to main run the gate"
            exit 0
          fi
          pf=$(mktemp)
          chmod 600 "$pf"
          trap 'rm -f "$pf"' EXIT
          tab=$(printf '\t')
          n=0 bad=0 count=0
          while IFS= read -r line || [ -n "$line" ]; do
            n=$((n + 1))
            line=${line%$'\r'}
            trimmed=${line#"${line%%[![:space:]]*}"}
            case $trimmed in ''|'#'*) continue ;; esac
            case $line in
              *"$tab"*) ;;
              *) echo "::error::pattern line $n is not class<TAB>regex"; bad=1; continue ;;
            esac
            class=${line%%"$tab"*}
            re=${line#*"$tab"}
            case $class in
              coord-host|internal-email|lab-address|lab-host|owner-path) ;;
              coord-host/i|internal-email/i|lab-address/i|lab-host/i|owner-path/i) ;;
              *) echo "::error::pattern line $n has an unknown class"; bad=1; continue ;;
            esac
            if [ -z "$re" ]; then
              echo "::error::pattern line $n has an empty regex"; bad=1; continue
            fi
            rc=0
            grep -E -e "$re" /dev/null > /dev/null 2>&1 || rc=$?
            if [ "$rc" -ge 2 ]; then
              echo "::error::pattern line $n has a regex grep -E refuses"; bad=1; continue
            fi
            printf '%s\n' "$re" >> "$pf"
            count=$((count + 1))
          done <<< "$RELEASABILITY_PATTERNS"
          if [ "$bad" != 0 ]; then
            echo "::error::the private pattern file is malformed (line numbers above; the values are not shown)"
            exit 1
          fi
          if [ "$count" = 0 ]; then
            echo "::error::RELEASABILITY_PATTERNS holds no class<TAB>regex line"
            exit 1
          fi
          rc=0
          hits=$(git grep -n -I -i -E -f "$pf" -- . | cut -d: -f1,2; exit "${PIPESTATUS[0]}") || rc=$?
          case $rc in
            0)
              echo "::error::internal names in the tracked tree (path:line; the values are not shown):"
              printf '%s\n' "$hits"
              exit 1 ;;
            1) ;;
            *)
              echo "::error::git grep failed (rc $rc)"
              exit 1 ;;
          esac
          echo "releasability: $count private patterns, 0 matches"

  # CUSTOMIZE (trusted-firmware, owner m751 (d), ci-standard.md §10 (d) and
  # §9): the legs. Each runs one long stage of the old image job, side by side
  # with the others, on the image job's images. The same commit gives the same
  # content tags (mk/docker.mk), so `make docker-image-<family>` finds the
  # image on the runner's daemon, else pulls the one the image job pushed, and
  # builds only when both miss (scripts/ensure-image.sh), through the same
  # make target, which BuildKit caches. IMAGE_BUILD_ID names the job as well,
  # so two legs that miss on one daemon never share a build tag. A leg runs
  # when the image job built the images, whatever its later steps did, as the
  # stages did inside it. No leg removes or trims a family image (§9; the
  # image job trims), and none starts a compose stack: in-toolchain-image.sh
  # removes its own stage container. Each budget: the image, ~10 min for a
  # pull (seconds for a hit), plus the stage as run 245908 timed it.
  # CUSTOMIZE (trusted-firmware): the test stage, the longest of the PR tier's
  # stages, alone so it no longer waits on the others, in three steps, one
  # per shard of it (mk/stages.mk TEST_SHARD_N), balanced by the gates'
  # durations. v1.34 (DS-7805): the three shards and the sdk/go race suite,
  # once four jobs, then the steps of one unit job, are the four legs of one
  # matrix job again (Fleet Ops 21:35Z, CA ruling 580): run one after another
  # they took 96 to 110 min on loaded runners against a 120 min timeout, side
  # by side each leg takes one shard's time. Each leg pulls the image itself.
  # Each shard step runs `make test-shard-N`: every gate in its shard even after
  # one fails (make -k), one PASS or FAIL line each; the three together run every
  # gate of `make test` once (scripts/test_unit_shards.py holds the shard
  # lists to TEST_GATES and these steps to the shards).
  #
  # The shards' minutes were read from the gates' log timestamps on 2026-10-25
  # (green run 65191; at quota, run 65330), with 4.5 min of setup a job green
  # and 7 at quota.
  #
  # The make test steps, all three: make coverage runs the whole unit suite
  # with -race (make test's flags), the PR tier's unit test and race checks in
  # one run (v1.23), and fails when total coverage is below COVERAGE_THRESHOLD
  # (testing-guidelines.md), so the suite runs once. Tags matter here too:
  # without them tag-gated packages are neither tested nor counted. The
  # integration stage is its own job below. CUSTOMIZE (trusted-firmware): this
  # repo's `make coverage` is the C firmware's floor alone; `make test`
  # (mk/stages.mk TEST_GATES) runs it with the host C suites, the boot suites,
  # the board sweep, test-asan (ASan and UBSan over the host and boot suites),
  # verify-vectors, xkms-coverage, sdk-coverage (sdk/go's unit tests alone,
  # floor 90; the cross-implementation suite is the race step's) and
  # scripts-test, so it is the test stage.
  unit:
    name: Unit and race [${{ matrix.leg }}]
    needs: [image, preflight]   # v1.29.3; v1.34
    if: ${{ !cancelled() && needs.image.outputs.built == 'true' && !github.event.pull_request.draft && (github.event_name != 'schedule' || needs.preflight.outputs.verdict == 'run') }}   # v1.26
    runs-on: ubuntu-latest
    # One leg per shard plus the sdk/go race suite (CA ruling 580 follow-up).
    # fail-fast off: every leg reports, as the steps did under !cancelled();
    # the CI Gate's `check unit` reads the matrix's combined result, so any
    # red leg fails the gate. A shard took 30 to 40 min on the loaded runners,
    # so 60 min a leg.
    strategy:
      fail-fast: false
      matrix:
        leg: [shard-1, shard-2, shard-3, race]
    timeout-minutes: 60
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      CI_CACHE_CLASS: ${{ github.event_name == 'push' && 'main' || 'pr' }}
      IMAGE_CLASS: ${{ github.event_name == 'push' && 'main' || 'pr' }}
      IMAGE_TRUSTED_CLASS: ${{ github.event_name != 'push' && 'main' || '' }}
      IMAGE_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.leg }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # v1.21.1: the image job's masking step, first, as in every job.
      - name: Free hosted runner disk
        if: ${{ runner.environment == 'github-hosted' }}   # v1.48: overflow runs on the Dells
        # Owner ruling 999: ubuntu-latest leaves about 14 GB free on /; the
        # devcontainer images this job builds or pulls need more, so drop the
        # preinstalled toolchains no job here uses instead of a self-hosted host.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker image prune --all --force > /dev/null
          df -h /
      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: Log in to the forge registry
        run: scripts/ci-registry-login.sh

      - name: Reuse the toolchain image
        id: toolchain
        run: |
          # v1.29.4 and v1.29.5: Athens first when the runner sets DEVCACHE_GOPROXY
          # and the cache answers, `|` so any error falls through to the public
          # proxy; "$bp" is one quoted make argument and the Makefile quotes it.
          bp=
          if [ -n "${DEVCACHE_GOPROXY:-}" ] && curl -s -o /dev/null --max-time 5 "$DEVCACHE_GOPROXY/"; then
            bp="GO_BUILD_PROXY=$DEVCACHE_GOPROXY|https://proxy.golang.org"
          fi
          make docker-image-toolchain ${bp:+"$bp"}
          echo "TOOLCHAIN_IMAGE=$(make -s toolchain-image)" >> "$GITHUB_ENV"

      # The test stage (m601 (c)), one step per shard: see above the job. Each
      # leg runs only its own step (`matrix.leg`); any failed step fails the leg.
      - name: make test-shard-1 (host suites, board sweep, boot suites sanitized) # CUSTOMIZE: ruling 218(9)
        if: ${{ !cancelled() && matrix.leg == 'shard-1' && steps.toolchain.outcome == 'success' }}
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make test-shard-1 GO_BUILD_TAGS='$GO_BUILD_TAGS'"

      - name: make test-shard-2 (boot suites, coverage floors, wire vectors, scripts) # CUSTOMIZE: ruling 218(9)
        if: ${{ !cancelled() && matrix.leg == 'shard-2' && steps.toolchain.outcome == 'success' }}
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make test-shard-2 GO_BUILD_TAGS='$GO_BUILD_TAGS'"

      - name: make test-shard-3 (host suites sanitized) # CUSTOMIZE: ruling 218(9)
        if: ${{ !cancelled() && matrix.leg == 'shard-3' && steps.toolchain.outcome == 'success' }}
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make test-shard-3 GO_BUILD_TAGS='$GO_BUILD_TAGS'"

      # CUSTOMIZE (trusted-firmware): sdk/go's suite under -race, with the
      # cross-implementation suite against tfwsim (the real firmware compiled
      # for the host), gated at COVERAGE_THRESHOLD: the PR tier's only
      # simulator run. The suite is compiled in by
      # the tfwsim build tag (#163); untagged, this step would run the unit
      # tests alone and the PR tier no simulator test. Every tfwsim-* binary the
      # suite starts must be on the make line, or the suite fails for want of
      # it. The tests fail the step before the gate reads a profile, so a
      # broken suite is never also reported as a coverage drop.
      - name: sdk/go under -race (cross-implementation suite, COVERAGE_THRESHOLD)
        if: ${{ !cancelled() && matrix.leg == 'race' && steps.toolchain.outcome == 'success' }}
        env:
          SDK_RACE_SCRIPT: |
            set -eu
            export GOWORK=off
            make tfwsim tfwsim-atecc608a tfwsim-app-example tfwsim-auto tfwsim-prov tfwsim-otaboot
            cd sdk/go
            go test -race -count=1 -timeout=900s -tags tfwsim -coverprofile=../../coverage.out ./...
            total=$(go tool cover -func=../../coverage.out | tail -n 1 | tr -s ' \t' ' ' | cut -d' ' -f3 | tr -d '%')
            case "$total" in
              '' | *[!0-9.]*) echo "FAIL: coverage could not be read from coverage.out (got '$total')"; exit 1 ;;
            esac
            echo "sdk/go: $total% statement coverage (floor $COVERAGE_THRESHOLD%)"
            if [ "${total%.*}" -lt "$COVERAGE_THRESHOLD" ]; then
              echo "FAIL: coverage $total% is below minimum $COVERAGE_THRESHOLD%"; exit 1
            fi
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "COVERAGE_THRESHOLD=$COVERAGE_THRESHOLD; $SDK_RACE_SCRIPT"

      - name: Tear down
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/docker-config"

  security:
    # CUSTOMIZE (trusted-firmware): make security needs the network and the
    # toolchain image alone, so it leaves the image job. deps-check runs in
    # the image job beside `make lint` from v1.28 (ruling 220(3)).
    # v1.42 (ruling 742 (1)): the job runs `make security-novuln`, every gate
    # of make security that reads only the tree; `make vuln` (govulncheck)
    # and deps-check run in scans.yml.
    name: Security [make security-novuln]
    needs: [image, preflight]   # v1.29.3
    if: ${{ !cancelled() && needs.image.outputs.built == 'true' && !github.event.pull_request.draft && (github.event_name != 'schedule' || needs.preflight.outputs.verdict == 'run') }}   # v1.26
    runs-on: ubuntu-latest
    # CUSTOMIZE: make security ~11 (the v1.20 job; 1 warm on run 245908).
    # 10 + 11, plus margin.
    timeout-minutes: 35
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      CI_CACHE_CLASS: ${{ github.event_name == 'push' && 'main' || 'pr' }}
      IMAGE_CLASS: ${{ github.event_name == 'push' && 'main' || 'pr' }}
      IMAGE_TRUSTED_CLASS: ${{ github.event_name != 'push' && 'main' || '' }}
