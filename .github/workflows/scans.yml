# scans-template: v1.0.0 (customized) — the scheduled scans on main.
# ci-template v1.42 makes the CI Gate hermetic (owner ruling 742 (1)), so
# every check that fails on the state of the world rather than on a change
# runs here, and only here: `make deps-check` (the toolchain pins and every
# Go module's requires against upstream), `make vuln` (govulncheck for every
# Go module and xkms/, the advisory half of `make security`) and `trivy
# image` of the integration image. It runs on a schedule and on
# workflow_dispatch on main, never on a pull_request or a push, and it is
# not the workflow named CI, so a finding never reads as a red main and never
# blocks a PR. A finding opens or updates ONE issue, found by its fixed title
# (SCAN_ISSUE_TITLE), with the run link, and fails this job, so the Actions
# run is red; a run with no finding closes that issue.
#
# CUSTOMIZE (trusted-firmware), against the template:
#   - make security is split in mk/stages.mk: ci.yml's Security job runs the
#     tree-only `make security-novuln`; this workflow runs `make vuln`.
#   - The images are built as ci.yml's image job builds them (`make
#     docker-images`, `make docker-build-it`), through the forge registry
#     login (scripts/ci-registry-login.sh), and trivy image keeps ci.yml's
#     former flags (--ignore-unfixed, --skip-dirs /opt/go/mod, CRITICAL and
#     HIGH; mk/stages.mk TRIVY_IMAGE_FLAGS).
#   - No bump half yet: the template's deps-bump, the commit to
#     ci/deps-bump, the fix PR and the CI dispatch on it are not taken; they
#     come with the full ci-template catch-up (v1.39 to v1.42).
#   - The cron minute: off ci.yml's Tuesday 04:00 schedule.

name: Scheduled Scans

on:
  schedule:
    - cron: '23 6 * * *'   # CUSTOMIZE: the minute, per repository
  workflow_dispatch:

permissions:
  contents: read
  issues: write   # the one issue for a finding

concurrency:
  group: scans-${{ github.repository }}
  cancel-in-progress: false

env:
  GO_BUILD_TAGS: "codec_json"   # CUSTOMIZE: ci.yml's GO_BUILD_TAGS
  SCAN_ISSUE_TITLE: 'scans: findings the scheduled scans report on main (ruling 742)'

jobs:
  scans:
    name: Scheduled scans
    # GitHub only, as the template: the issue calls are GitHub's API (gh).
    if: ${{ github.server_url == 'https://github.com' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      CI_CACHE_CLASS: pr
      IMAGE_CLASS: pr
      IMAGE_TRUSTED_CLASS: main
      IMAGE_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}-scans
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: Free the runner's disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af >/dev/null
          df -h /

      - name: Log in to the forge registry
        run: scripts/ci-registry-login.sh

      - name: Build the devcontainer images
        run: |
          IT_IMAGE=$(make -s it-image)
          echo "IT_IMAGE=$IT_IMAGE" >> "$GITHUB_ENV"
          make docker-images
          make docker-build-it IT_IMAGE="$IT_IMAGE"
          echo "TOOLCHAIN_IMAGE=$(make -s toolchain-image)" >> "$GITHUB_ENV"

      # The checks that left ci.yml (ruling 742 (1)). Each runs to the end;
      # FIRED lists the ones that fail, and the step's own log keeps their
      # output.
      - name: Scans (deps-check, make vuln, trivy image)
        id: scans
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        env:
          IN_IMAGE_NETWORK: bridge
        run: |
          fired=
          scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" make deps-check || fired="$fired deps-check"
          scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make vuln GO_BUILD_TAGS='$GO_BUILD_TAGS'" || fired="$fired vuln"
          if docker save -o it-image.tar "$IT_IMAGE"; then
            scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" \
              trivy image --input it-image.tar --ignore-unfixed --skip-dirs /opt/go/mod --severity CRITICAL,HIGH --exit-code 1 || fired="$fired trivy-image"
          else
            fired="$fired trivy-image"
          fi
          rm -f it-image.tar
          fired=${fired# }
          echo "scans: ${fired:-none fired}"
          echo "fired=$fired" >> "$GITHUB_OUTPUT"

      # ONE issue for the findings, found by its exact title among the open
      # issues (pull requests excluded): created when none is open, its body
      # replaced when one is, and closed with a comment by the first run with
      # no finding.
      - name: Open, update or close the scan issue
        if: ${{ !cancelled() && steps.scans.outcome == 'success' }}
        env:
          FIRED: ${{ steps.scans.outputs.fired }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          issue=$(gh api --paginate "repos/$REPO/issues?state=open&per_page=100" \
            --jq ".[] | select(.pull_request == null and .title == \"$SCAN_ISSUE_TITLE\") | .number" | head -n1)
          if [ -z "$FIRED" ]; then
            if [ -n "$issue" ]; then
              gh api "repos/$REPO/issues/$issue/comments" -f body="The scheduled scans found nothing. Run: $RUN_URL" >/dev/null
              gh api -X PATCH "repos/$REPO/issues/$issue" -f state=closed -f state_reason=completed >/dev/null
              echo "closed #$issue"
            fi
            exit 0
          fi
          body=$(printf '%s\n\n%s\n\n%s\n' \
            'The scheduled scans on main (scans.yml, ruling 742 (1)) fired: a pin or dependency behind its latest release with no reason, a vulnerable version, or an image package. Each needs a fix PR or a documented reason (devops.md §9). The Scans step log of the run names each finding.' \
            "Firing: $FIRED." \
            "Run: $RUN_URL")
          if [ -z "$issue" ]; then
            issue=$(jq -n --arg t "$SCAN_ISSUE_TITLE" --arg b "$body" '{title: $t, body: $b}' | gh api "repos/$REPO/issues" --input - --jq .number)
            echo "opened #$issue"
          else
            jq -n --arg b "$body" '{body: $b}' | gh api -X PATCH "repos/$REPO/issues/$issue" --input - >/dev/null
            echo "updated #$issue"
          fi

      # A finding fails the run, after the issue is open, so it is seen and
      # fixed. This is not CI: no PR and no main commit status reads it.
      - name: Fail on a finding
        if: ${{ !cancelled() && steps.scans.outputs.fired != '' }}
        env:
          FIRED: ${{ steps.scans.outputs.fired }}
        run: |
          echo "::error title=scheduled scans::firing: $FIRED (see the Scans step log)"
          exit 1

      - name: Tear down
        if: always()
        run: |
          rm -f it-image.tar
          rm -rf "$RUNNER_TEMP/docker-config"
