# The Go linters for every Go module here: sdk/go, xkms/ and test/integration/esp32 (`make go-golangci`, `make xkms-security`).
version: "2"

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - unused
    - ineffassign
    - misspell
    - gocritic

formatters:
  enable:
    - gofmt
