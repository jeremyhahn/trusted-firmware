#
# trusted-firmware devcontainer: one service per shipped stage of the Dockerfile beside this file.

x-posture: &posture
  init: true
  read_only: true
  network_mode: none
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 4096
  mem_limit: 8g
  memswap_limit: 8g
  ulimits:
    memlock:
      soft: 67108864
      hard: 67108864
    core:
      soft: 1048576
      hard: 1048576
    nofile:
      soft: 65536
      hard: 65536
  working_dir: /src

services:
  integration:
    <<: *posture
    image: ${TRUSTED_FIRMWARE_IT_IMAGE:-trusted-firmware-it:local}
    pull_policy: never
    user: "10001:10001"
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=3g,mode=1777
      - /src/build:rw,exec,nosuid,nodev,uid=10001,gid=10001
    environment:
      GOTOOLCHAIN: local
      GOPROXY: "off"

  toolchain:
    <<: *posture
    image: trusted-firmware-toolchain:${TRUSTED_FIRMWARE_TOOLCHAIN_TAG:-latest}
    pull_policy: never
    user: "${TRUSTED_FIRMWARE_UID:-10001}:${TRUSTED_FIRMWARE_GID:-10001}"
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=3g,mode=1777
    volumes:
      - ../../..:/src
    environment:
      GOTOOLCHAIN: local
      GOPROXY: "off"
      HOME: /tmp

