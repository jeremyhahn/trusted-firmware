# ATECC608C-TFLXTLS provisioning template -- the TrustFLEX (a1) plan.
#
# THIS FILE IS THE REVIEWABLE ARTEFACT. Read it, and
# docs/device-provisioning/adr-trustflex-608c-slot-map.md, before running
# `tfwprov --commit` on a TrustFLEX part.
#
# Microchip ships this part with both zones locked, so the template writes no
# config blocks and carries no zone lock CRCs; tfwprov refuses it if it does.
# The plan instead:
#
#   1. reads the whole config zone into the provisioning record, and stops
#      before writing anything if slot 6 or 15 is not slot-lockable (option 2),
#      slot 0 needs the Persistent Latch, or slot 6 or 15 is already
#      slot-locked (config bytes 88-89);
#   2. reads the slot-0 DeviceID point, Microchip's, into the record;
#   3. seeds the UDS into slot 6 from the element's TRNG;
#   4. checks HMAC keyed by slot 6 (the firmware does it inside step 6);
#   5. writes the image-signing public key (--image-key) to slot 15;
#   6. SlotLocks slots 6 and 15. IRREVERSIBLE.
#
# `tfwprov --dry-run` prints the plan; run `--commit` on a spare part first.

name = atecc608c-tflxtls-a1-v1
plan = trustflex
